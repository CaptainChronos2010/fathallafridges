<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c66">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>تسجيل درجات الحرارة — فتح الله ماركت</title>
<style>
  :root{
    color-scheme: light;
    --bg:#eef2f1; --card:#fff; --ink:#10201c; --muted:#6a7d77;
    --line:#dde5e2; --brand:#0e7c66; --brand-dark:#0a5f4e; --brand-soft:#e3f3ee;
    --ok:#128a5f; --ok-soft:#e2f5ec; --warn:#a86f00; --warn-soft:#fdf3dd;
    --bad:#b83a2c; --bad-soft:#fdecea;
    --shadow:0 1px 2px rgba(16,32,28,.06), 0 10px 28px rgba(16,32,28,.07);
    --r:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#0d1412; --card:#16211e; --ink:#eaf2ef; --muted:#8fa7a0;
      --line:#243430; --brand:#20a98b; --brand-dark:#17866d; --brand-soft:#12312a;
      --ok:#2ecf95; --ok-soft:#12352a; --warn:#e0a326; --warn-soft:#33280e;
      --bad:#ef6a58; --bad-soft:#361714;
      --shadow:0 1px 0 rgba(255,255,255,.03);
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;
    font-family:'Segoe UI', Tahoma, 'Noto Kufi Arabic', Arial, sans-serif;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button, input, select{ font-family:inherit; font-size:16px; color:inherit; }
  button{ cursor:pointer; }
  .screen{ display:none; }
  .screen.on{ display:block; }

  /* ================= ترويسة البداية ================= */
  .hero{
    background:linear-gradient(160deg, var(--brand), var(--brand-dark));
    color:#fff; padding:22px 18px 18px; border-radius:0 0 26px 26px;
  }
  .hero h1{ margin:0; font-size:18px; font-weight:700; }
  .hero p{ margin:2px 0 0; font-size:13px; opacity:.85; }

  .datebar{ margin-top:16px; display:flex; gap:8px; align-items:center; }
  .datebar input[type="date"]{
    flex:1; min-height:46px; border:none; border-radius:12px; padding:0 12px;
    background:rgba(255,255,255,.14); color:#fff; font-size:15px; font-weight:600;
  }
  .datebar input[type="date"]::-webkit-calendar-picker-indicator{ filter:invert(1); opacity:.85; }
  .icon-btn{
    width:46px; height:46px; flex:0 0 auto; border:none; border-radius:12px;
    background:rgba(255,255,255,.14); color:#fff; font-size:18px; display:flex;
    align-items:center; justify-content:center;
  }
  .icon-btn:active{ transform:scale(.96); }

  /* ================= شاشة البداية ================= */
  .pad{ padding:16px 14px 28px; max-width:520px; margin:0 auto; }

  .pick{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:16px; box-shadow:var(--shadow);
  }
  .fld{ display:block; margin-bottom:14px; }
  .fld > span{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:600; }
  .fld select, .fld input{
    width:100%; min-height:52px; border:1.5px solid var(--line); border-radius:12px;
    background:var(--bg); padding:0 12px; font-size:16px; outline:none; color:var(--ink);
  }
  .fld select:focus, .fld input:focus{ border-color:var(--brand); background:var(--card); box-shadow:0 0 0 3px var(--brand-soft); }
  .pick-info{ font-size:12.5px; color:var(--muted); min-height:18px; margin:-4px 0 14px; }

  /* ================= شاشة العمل ================= */
  .topstick{ position:sticky; top:0; z-index:30; background:var(--bg); }
  .workbar{
    background:var(--brand); color:#fff;
    display:flex; align-items:center; gap:10px; padding:10px 12px 10px;
    padding-top:calc(10px + env(safe-area-inset-top, 0px));
  }
  .workbar .icon-btn{ width:40px; height:40px; background:rgba(255,255,255,.16); }
  .wb-title{ flex:1; min-width:0; line-height:1.25; text-align:center; }
  .wb-title b{ display:block; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wb-title small{ font-size:12px; opacity:.85; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .progress{ height:4px; background:rgba(255,255,255,.22); }
  .progress i{ display:block; height:100%; width:0; background:#fff; transition:width .25s; }

  .chips{
    display:flex; gap:8px; overflow-x:auto; padding:10px 12px;
    scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; scroll-snap-align:center; border:1px solid var(--line); background:var(--card);
    border-radius:999px; padding:9px 14px; font-size:13.5px; font-weight:600; color:var(--muted);
    display:flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .chip b{ font-weight:700; color:inherit; }
  .chip .dot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .chip.done .dot{ background:var(--ok); }
  .chip.done{ color:var(--ok); border-color:var(--ok-soft); background:var(--ok-soft); }
  .chip.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .chip.on .dot{ background:#fff; }

  .cards{ padding:4px 12px 140px; max-width:640px; margin:0 auto; }
  .sec-title{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:2px 4px 10px; }
  .sec-title b{ font-size:16px; }
  .sec-title span{ font-size:12.5px; color:var(--muted); }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .card-top{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .code{
    font-weight:700; font-size:15px; background:var(--brand-soft); color:var(--brand-dark);
    border-radius:8px; padding:3px 9px;
  }
  .type{ font-size:12.5px; color:var(--muted); }
  .state{ margin-inline-start:auto; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; }
  .state.saved{ background:var(--ok-soft); color:var(--ok); }
  .state.dirty{ background:var(--warn-soft); color:var(--warn); }
  .state.none{ background:var(--bg); color:var(--muted); }

  .flabel{ font-size:12px; color:var(--muted); margin-bottom:6px; display:flex; justify-content:space-between; }
  .temp-row{ display:flex; align-items:stretch; gap:8px; }
  .sign{
    width:54px; flex:0 0 auto; border:1px solid var(--line); background:var(--bg);
    border-radius:12px; font-size:22px; font-weight:700; color:var(--brand-dark); line-height:1;
  }
  .sign:active{ background:var(--brand-soft); }
  .temp{
    flex:1; min-width:0; min-height:54px; text-align:center; font-size:22px; font-weight:700;
    border:1.5px solid var(--line); border-radius:12px; background:var(--card); outline:none;
    letter-spacing:.5px; direction:ltr; unicode-bidi:isolate;
  }
  .temp:focus{ border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
  .temp::placeholder{ font-size:15px; font-weight:400; color:var(--muted); letter-spacing:0; }
  .unit{ display:flex; align-items:center; font-size:13px; color:var(--muted); padding-inline-start:2px; }

  .card.alarm{ border-color:var(--bad); box-shadow:0 0 0 3px var(--bad-soft), var(--shadow); }
  .alarm-badge{
    background:var(--bad); color:#fff; border-radius:999px; font-size:11px;
    padding:2px 8px; font-weight:700; white-space:nowrap;
  }

  .seg{ display:grid; grid-template-columns:repeat(auto-fit, minmax(88px, 1fr)); gap:6px; margin-top:4px; }
  .seg-btn{
    min-height:46px; border:1.5px solid var(--line); background:var(--card); border-radius:11px;
    font-size:13px; font-weight:700; color:var(--muted); padding:6px 4px; position:relative;
    transition:transform .08s;
  }
  .seg-btn:active{ transform:scale(.97); }
  .seg-btn.ok.on{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .seg-btn.warn.on{ background:var(--warn); border-color:var(--warn); color:#fff; }
  .seg-btn.bad.on{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .seg-btn.info.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .seg-btn.on::after{ content:"✓"; position:absolute; top:2px; inset-inline-start:6px; font-size:10px; opacity:.9; }

  .hint{ font-size:11.5px; margin-top:6px; color:var(--muted); }
  .hint.over{ color:var(--bad); font-weight:700; }

  details.note{ margin-top:10px; }
  details.note summary{
    font-size:12.5px; color:var(--muted); cursor:pointer; list-style:none; padding:4px 0;
  }
  details.note summary::-webkit-details-marker{ display:none; }
  details.note summary::before{ content:"‹ "; }
  details.note[open] summary::before{ content:"⌄ "; }
  .note input{
    width:100%; margin-top:6px; min-height:42px; border:1px solid var(--line); border-radius:10px;
    padding:0 10px; background:var(--bg); font-size:14px; outline:none;
  }

  /* ================= شريط الحفظ ================= */
  .actionbar{
    position:fixed; inset-inline:0; bottom:0; z-index:40; background:var(--card);
    border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    box-shadow:0 -6px 20px rgba(16,32,28,.07);
  }
  .ab-info{ font-size:12px; color:var(--muted); text-align:center; margin-bottom:8px; }
  .ab-btns{ display:flex; gap:8px; max-width:640px; margin:0 auto; }
  .btn{
    flex:1; min-height:50px; border:none; border-radius:13px; font-size:15px; font-weight:700;
    padding:0 14px; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn.primary{ background:var(--brand); color:#fff; }
  .btn.primary:disabled{ background:var(--line); color:var(--muted); }
  .btn.ghost{ background:var(--bg); color:var(--ink); border:1px solid var(--line); flex:0 0 27%; font-size:14px; padding:0 6px; }
  .btn.ghost:disabled{ opacity:.45; }
  .btn:active{ transform:scale(.99); }

  .problems{
    display:none; background:var(--bad-soft); border-top:1px solid var(--bad);
    padding:10px 14px; font-size:12.5px; color:var(--bad);
  }
  .problems b{ display:block; margin-bottom:4px; }
  .problems ul{ margin:0; padding-inline-start:16px; }

  /* ================= متفرقات ================= */
  .toast{
    position:fixed; inset-inline: 12px; bottom:calc(96px + env(safe-area-inset-bottom, 0px));
    max-width:520px; margin-inline:auto; z-index:60; pointer-events:none;
    background:#14231f; color:#fff; border-radius:12px; padding:12px 14px; font-size:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.22); opacity:0; transform:translateY(10px);
    transition:opacity .18s, transform .18s;
  }
  .toast.on{ opacity:1; transform:none; }
  .toast.ok{ background:#0e7c66; }
  .toast.bad{ background:#b83a2c; }
  .toast.warn{ background:#8a5c00; }

  .banner{
    background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn);
    border-radius:12px; padding:10px 12px; font-size:13px; margin-bottom:12px;
  }
  .empty{
    text-align:center; padding:36px 20px; color:var(--muted); font-size:14px;
    background:var(--card); border-radius:var(--r); border:1px dashed var(--line);
  }
  .empty a{ color:var(--brand); font-weight:700; }
  .skel{ height:112px; border-radius:var(--r); background:linear-gradient(90deg,var(--card),var(--bg),var(--card)); background-size:200% 100%; animation:sh 1.2s infinite; margin-bottom:12px; }
  @keyframes sh{ 0%{background-position:0 0} 100%{background-position:-200% 0} }
  .center{ text-align:center; }
  .modal{ position:fixed; inset:0; background:rgba(8,20,17,.55); display:none; align-items:flex-end; z-index:80; }
  .modal.on{ display:flex; }
  .sheet{
    background:var(--card); width:100%; max-width:520px; margin:0 auto;
    border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  .sheet h3{ margin:0 0 8px; font-size:16px; }
  .sheet p{ margin:0 0 14px; font-size:13.5px; color:var(--muted); line-height:1.7; }
  .sheet .btns{ display:flex; gap:8px; }  .spinner{ width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:spin .8s linear infinite; display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- ============ شاشة البداية ============ -->
<section id="startScreen" class="screen on">
  <div class="hero">
    <h1>فتح الله ماركت</h1>
    <p>تسجيل درجات حرارة الثلاجات</p>
    <div class="datebar">
      <input type="date" id="dateInput" aria-label="التاريخ">
      <button class="icon-btn" id="refreshBtn" title="تحديث">⟳</button>
    </div>
  </div>

  <div class="pad">
    <div id="apiBanner"></div>

    <div class="pick">
      <label class="fld">
        <span>الفرع</span>
        <select id="branchSelect">
          <option value="">— اختر الفرع —</option>
        </select>
      </label>

      <label class="fld">
        <span>اسمك</span>
        <input id="userName" type="text" placeholder="الاسم" maxlength="40" autocomplete="off">
      </label>

      <div class="pick-info" id="branchInfo"></div>

      <button class="btn primary" id="startBtn" disabled>ابدأ التسجيل</button>
    </div>
  </div>
</section>

<!-- ============ شاشة التسجيل ============ -->
<section id="workScreen" class="screen">
  <div class="topstick">
    <div class="workbar">
      <button class="icon-btn" id="backBtn" aria-label="رجوع">→</button>
      <div class="wb-title">
        <b id="wbBranch">—</b>
        <small id="wbSub">—</small>
      </div>
      <button class="icon-btn" id="pickDateBtn" aria-label="تغيير التاريخ">📅</button>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
    <div class="chips" id="sectionChips"></div>
  </div>
  <div class="cards" id="sectionBody"></div>

  <div class="problems" id="problems"></div>

  <div class="actionbar">
    <div class="ab-info" id="abInfo"></div>
    <div class="ab-btns">
      <button class="btn ghost" id="prevBtn">السابق</button>
      <button class="btn primary" id="saveBtn">حفظ القسم</button>
      <button class="btn ghost" id="nextBtn">التالي</button>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<div class="modal" id="confirmModal">
  <div class="sheet">
    <h3>تأكيد الحفظ</h3>
    <p id="confirmText"></p>
    <div class="btns">
      <button class="btn ghost" id="confirmCancel">إلغاء</button>
      <button class="btn primary" id="confirmOk">تأكيد وإرسال</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ⚙️  الإعدادات — تُعدَّل من هنا فقط
   ============================================================ */

/* ١) رابط نشر Apps Script (لازم يكون نفس الرابط في الصفحتين) */
const API_URL = "https://script.google.com/macros/s/AKfycbycG7Fld1-DO3kCcW-GotiiSPkzHpAwNL0lpmdfLpE8_bB_nh-mp8egD0cYcjPIIICI_A/exec";

/* ٢) حالات الثلاجة — عدّل label، ويمكن الإضافة أو الحذف.
      tone: ok (أخضر) | warn (أصفر) | bad (أحمر) | info (أزرق)
      needsTemp: هل تتطلب هذه الحالة درجة حرارة؟
*/
const STATUSES = [
  { key: 'ok',    label: 'سليم',        tone: 'ok',   needsTemp: true  },
  { key: 'fault', label: 'به عطل',      tone: 'bad',  needsTemp: true  },
  { key: 'maint', label: 'تحت الصيانة', tone: 'warn', needsTemp: false }
];

/* ٣) حد الإنذار لكل نوع ثلاجة:
      لو تجاوزت القراءة الرقم المحدد → يظهر تحذير أحمر على بطاقة الثلاجة.
      يمكن تغيير الرقم، أو حذف سطر النوع لتعطيل الإنذار عنه.
*/
const ALARM_ABOVE = {
  'تبريد': 8,     // التبريد: أعلى من ٨° يدل على وجود مشكلة
  'تجميد': -15    // التجميد: أعلى من −١٥° يدل على عدم كفاية التبريد
};

/* ============================================================
   لا حاجة لتعديل ما يلي
   ============================================================ */
const $  = (s, r) => (r || document).querySelector(s);
const LS_LAST  = 'fathalla:last';
const LS_USER  = 'fathalla:user';
const LS_COUNT = 'fathalla:counts';

const state = {
  branches: [],
  branch: '',
  user: '',
  date: '',
  sections: [],
  readings: {},
  active: 0,
  dirty: new Set(),
  saving: false,
  timer: null,
  force: false,
  loading: false
};

/* ---------- أدوات ---------- */
function esc(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function arNum(n){
  const d = '٠١٢٣٤٥٦٧٨٩';
  return String(n).replace(/\d/g, function(x){ return d[+x]; });
}
/* عزل اتجاهي للأرقام حتى تظهر الإشارة السالبة في موضعها */
function num(n){
  return '<bdi dir="ltr">' + arNum(n) + '</bdi>';
}
function todayISO(){
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}
function fmtDate(iso){
  const p = String(iso).split('-');
  if (p.length !== 3) return iso;
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  try {
    return new Intl.DateTimeFormat('ar-EG', { weekday:'long', day:'numeric', month:'long' }).format(d);
  } catch (e) { return iso; }
}
function nowClock(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function arabicClock(hhmm){
  if (!hhmm) return '';
  const p = String(hhmm).split(':');
  if (p.length < 2) return hhmm;
  let h = +p[0];
  const suffix = h >= 12 ? 'م' : 'ص';
  h = h % 12; if (h === 0) h = 12;
  return arNum(h) + ':' + arNum(p[1].padStart(2,'0')) + ' ' + suffix;
}
function parseTemp(v){
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  if (!s || s === '-') return null;
  const n = Number(s
    .replace(/[٠-٩]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
    .replace(/[٫,]/g, '.')
    .replace(/[−–—]/g, '-'));
  return isFinite(n) ? n : null;
}
function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on ' + (kind || '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.className = 'toast ' + (kind || ''); }, 3200);
}
function apiReady(){ return API_URL && API_URL.indexOf('http') === 0; }

/* ---------- الشبكة ---------- */
function fetchJSON(url, opts, timeoutMs){
  const ctrl = new AbortController();
  const timer = setTimeout(function(){ ctrl.abort(); }, timeoutMs || 25000);
  const o = Object.assign({}, opts || {}, { signal: ctrl.signal, cache: 'no-store' });
  return fetch(url, o).then(function(res){
    clearTimeout(timer);
    return res.text().then(function(txt){
      let data;
      try { data = JSON.parse(txt); }
      catch (e) { throw new Error('استجابة غير متوقعة من الخادم'); }
      if (!data || data.status !== 'success') {
        throw new Error((data && data.message) ? data.message : 'فشل الطلب');
      }
      return data;
    });
  }, function(err){
    clearTimeout(timer);
    if (err && err.name === 'AbortError') throw new Error('الاتصال بطيء — أعد المحاولة');
    throw new Error('تعذّر الاتصال بالخادم');
  });
}
function apiGet(params){
  if (!apiReady()) return Promise.reject(new Error('رابط الخادم غير مُعدّ'));
  const qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  return fetchJSON(API_URL + '?t=' + Date.now() + '&' + qs, { method:'GET' });
}
function apiPost(payload){
  if (!apiReady()) return Promise.reject(new Error('رابط الخادم غير مُعدّ'));
  /* إرسال النص كطلب بسيط دون ترويسات إضافية (بدون preflight) */
  return fetchJSON(API_URL, { method:'POST', body: JSON.stringify(payload), redirect:'follow' });
}

/* ---------- شاشات ---------- */
function showScreen(name){
  $('#startScreen').classList.toggle('on', name === 'start');
  $('#workScreen').classList.toggle('on', name === 'work');
  window.scrollTo(0, 0);
}

/* ---------- اختيار الفرع والاسم ---------- */
function renderBranchOptions(){
  const sel = $('#branchSelect');
  const prev = sel.value;

  if (!state.branches.length) {
    sel.innerHTML = '<option value="">لا توجد فروع مسجّلة</option>';
    $('#branchInfo').innerHTML = 'لا يوجد فرع مسجّل حتى الآن.';
    updateStartState();
    return;
  }

  sel.innerHTML = '<option value="">— اختر الفرع —</option>' +
    state.branches.map(function(b){
      return '<option value="' + esc(b.branch) + '">' + esc(b.branch) + '</option>';
    }).join('');

  if (prev) sel.value = prev;
  if (!sel.value && state.branches.length === 1) sel.value = state.branches[0].branch;

  updateBranchInfo();
  updateStartState();
}

function updateBranchInfo(){
  const val = $('#branchSelect').value;
  const b = state.branches.filter(function(x){ return x.branch === val; })[0];
  const info = $('#branchInfo');
  if (!b) { info.textContent = ''; return; }
  info.innerHTML = arNum(b.fridges) + ' ثلاجة في ' + arNum(b.sections) + ' أقسام · ' +
    arNum(b.saved) + ' سُجّلت اليوم';
}

function updateStartState(){
  const name = ($('#userName').value || '').trim();
  const ok = !!$('#branchSelect').value && name.length >= 3;
  $('#startBtn').disabled = !ok;
}

function startRecording(){
  const branch = $('#branchSelect').value;
  const name = ($('#userName').value || '').trim();
  if (!branch) { toast('اختر الفرع أولًا', 'warn'); return; }
  if (name.length < 3) { toast('أدخل اسمك (٣ أحرف على الأقل)', 'warn'); $('#userName').focus(); return; }

  state.user = name;
  localStorage.setItem(LS_USER, name);
  openDay(branch, $('#dateInput').value || todayISO());
}

function loadBranches(){
  if (!apiReady()) {
    $('#apiBanner').innerHTML = '<div class="banner">يجب إدخال رابط النشر في أعلى الكود ' +
      '(المتغير API_URL) لتشغيل الصفحة.</div>';
    return Promise.resolve();
  }
  const sel = $('#branchSelect');
  if (!state.branches.length) sel.innerHTML = '<option value="">جارٍ التحميل…</option>';

  return apiGet({ action:'getBranches', date:$('#dateInput').value || todayISO() })
    .then(function(d){
      state.branches = d.branches || [];
      renderBranchOptions();
    })
    .catch(function(e){
      sel.innerHTML = '<option value="">تعذّر التحميل</option>';
      $('#branchInfo').innerHTML = '<span style="color:var(--bad)">' + esc(e.message) +
        '</span><br><button class="btn primary" style="min-height:40px;margin-top:8px" onclick="loadBranches()">إعادة المحاولة</button>';
    });
}

/* ---------- فتح يوم ---------- */
function openDay(branch, date){
  state.branch = branch;
  state.date = date;
  state.dirty.clear();
  state.force = false;
  localStorage.setItem(LS_LAST, JSON.stringify({ branch:branch, date:date, user:state.user, ts:Date.now() }));

  showScreen('work');
  $('#wbBranch').textContent = branch;
  $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(date) + ' · جارٍ التحميل…';
  $('#sectionChips').innerHTML = '';
  $('#sectionBody').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  setActionInfo('…');
  hideProblems();

  return apiGet({ action:'getDay', branch:branch, date:date })
    .then(function(d){
      state.sections = d.sections || [];
      state.readings = {};
      Object.keys(d.readings || {}).forEach(function(code){
        const r = d.readings[code];
        state.readings[code] = {
          temp: (r.temp === null || r.temp === '' || r.temp === undefined) ? '' : String(r.temp),
          status: r.status || '',
          note: r.note || '',
          time: r.time || ''
        };
      });
      if (!state.sections.length) return renderNoFridges();
      state.active = firstIncomplete();
      renderChips();
      renderSection();
      refreshHeader();
    })
    .catch(function(e){
      $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(date);
      $('#sectionBody').innerHTML =
        '<div class="empty">تعذّر تحميل بيانات الفرع<br><small>' + esc(e.message) + '</small><br><br>' +
        '<button class="btn primary" style="max-width:220px;margin:auto" id="retryDay">إعادة المحاولة</button></div>';
      const b = $('#retryDay');
      if (b) b.onclick = function(){ openDay(branch, date); };
    });
}

function renderNoFridges(){
  $('#sectionChips').innerHTML = '';
  $('#progressBar').style.width = '0%';
  $('#sectionBody').innerHTML =
    '<div class="empty">لا توجد ثلاجات مسجّلة لهذا الفرع.</div>';
  $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(state.date);
  setActionInfo('لا توجد ثلاجات');
  $('#saveBtn').disabled = true;
  $('#nextBtn').disabled = true;
  $('#prevBtn').disabled = true;
}

/* ---------- الحالة ---------- */
function readingOf(code){
  if (!state.readings[code]) state.readings[code] = { temp:'', status:'', note:'', time:'' };
  return state.readings[code];
}
function statusByLabel(label){
  for (let i = 0; i < STATUSES.length; i++) if (STATUSES[i].label === label) return STATUSES[i];
  return label ? { key:'other', label:label, tone:'info', needsTemp:true } : null;
}
function isSaved(code){
  const r = state.readings[code];
  return !!(r && r.status);
}
function sectionStats(sec){
  let total = sec.fridges.length, saved = 0;
  sec.fridges.forEach(function(f){ if (isSaved(f.code)) saved++; });
  return { total: total, saved: saved };
}
function totalStats(){
  let total = 0, saved = 0;
  state.sections.forEach(function(s){
    const st = sectionStats(s);
    total += st.total; saved += st.saved;
  });
  return { total: total, saved: saved };
}
function firstIncomplete(){
  for (let i = 0; i < state.sections.length; i++) {
    const st = sectionStats(state.sections[i]);
    if (st.saved < st.total) return i;
  }
  return 0;
}
function activeSection(){
  return state.sections[state.active] || null;
}

/* ---------- الرسم ---------- */
function refreshHeader(){
  const t = totalStats();
  const pct = t.total ? Math.round(t.saved / t.total * 100) : 0;
  const sec = activeSection();
  const st = sec ? sectionStats(sec) : { total:0, saved:0 };
  let alarms = 0;
  state.sections.forEach(function(s){ alarms += sectionAlarms(s); });
  $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(state.date) + ' · ' +
    arNum(t.saved) + ' من ' + arNum(t.total) + ' ثلاجة' +
    (alarms ? ' · ⚠ ' + arNum(alarms) + ' فوق الحد' : '');
  $('#progressBar').style.width = pct + '%';
  setActionInfo(sec
    ? 'القسم «' + sec.name + '» — ' + arNum(st.saved) + ' من ' + arNum(st.total) + ' مسجّلة'
    : '');
  $('#saveBtn').disabled = !sec;
  $('#nextBtn').disabled = !sec;
  $('#prevBtn').disabled = !sec || state.active === 0;
  document.title = arNum(t.saved) + '/' + arNum(t.total) + ' · ' + state.branch;
}

function renderChips(){
  const box = $('#sectionChips');
  box.innerHTML = state.sections.map(function(s, i){
    const st = sectionStats(s);
    const done = st.total > 0 && st.saved >= st.total;
    return '<button class="chip ' + (i === state.active ? 'on' : '') + (done ? ' done' : '') + '" data-i="' + i + '">' +
      '<span class="dot"></span>' + esc(s.name) +
      ' <b>' + arNum(st.saved) + '/' + arNum(st.total) + '</b></button>';
  }).join('');
  const on = box.querySelector('.chip.on');
  if (on && on.scrollIntoView) on.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
}

function renderSection(){
  const sec = activeSection();
  const body = $('#sectionBody');
  if (!sec) { body.innerHTML = ''; return; }

  const st0 = sectionStats(sec);
  const al0 = sectionAlarms(sec);
  const head = '<div class="sec-title"><b>' + esc(sec.name) + '</b>' +
    '<span>' + arNum(st0.saved) + ' من ' + arNum(st0.total) + ' مسجّلة' +
    (al0 ? ' · <b style="color:var(--bad)">' + arNum(al0) + ' فوق الحد</b>' : '') +
    '</span></div>';

  body.innerHTML = head + sec.fridges.map(function(f, i){
    const r = readingOf(f.code);
    const st = statusByLabel(r.status);
    const limit = ALARM_ABOVE[f.type];
    const val = parseTemp(r.temp);
    const over = (limit !== undefined && val !== null && val > limit);

    const statusBtns = (st && st.key === 'other' ? STATUSES.concat([st]) : STATUSES).map(function(s){
      return '<button type="button" class="seg-btn ' + s.tone + (r.status === s.label ? ' on' : '') +
        '" data-act="status" data-label="' + esc(s.label) + '">' + esc(s.label) + '</button>';
    }).join('');

    const stateText = isSaved(f.code)
      ? (state.dirty.has(f.code) ? 'معدّلة' : 'محفوظة ' + arabicClock(r.time))
      : 'لم تُسجَّل';

    return '<div class="card' + (over ? ' alarm' : '') + '" data-code="' + esc(f.code) + '">' +
      '<div class="card-top">' +
        '<span class="code">' + esc(f.code) + '</span>' +
        '<span class="type">' + esc(f.type) + '</span>' +
        '<span class="alarm-badge"' + (over ? '' : ' hidden') + '>⚠ فوق الحد</span>' +
        '<span class="state ' + (isSaved(f.code) ? (state.dirty.has(f.code) ? 'dirty' : 'saved') : 'none') + '">' +
          stateText + '</span>' +
      '</div>' +

      '<div class="flabel"><span>درجة الحرارة</span></div>' +

      '<div class="temp-row">' +
        '<button type="button" class="sign" data-act="sign" aria-label="سالب">−</button>' +
        '<input class="temp" dir="ltr" inputmode="decimal" enterkeyhint="done" autocomplete="off" ' +
          'value="' + esc(r.temp) + '" placeholder="القراءة">' +
        '<span class="unit">°م</span>' +
      '</div>' +

      '<div class="hint"></div>' +

      '<div class="flabel" style="margin-top:12px">الحالة</div>' +
      '<div class="seg">' + statusBtns + '</div>' +

      '<details class="note"' + (r.note ? ' open' : '') + '>' +
        '<summary>ملاحظة (اختياري)</summary>' +
        '<input class="note-input" maxlength="120" value="' + esc(r.note) + '">' +
      '</details>' +
    '</div>';
  }).join('');

  body.querySelectorAll('.card').forEach(function(card){
    updateHint(card);
  });
  refreshHeader();
}

function updateHint(card){
  const code = card.dataset.code;
  const f = (activeSection() || { fridges:[] }).fridges.filter(function(x){ return x.code === code; })[0];
  const r = readingOf(code);
  const hint = card.querySelector('.hint');
  if (!hint) return;

  const val = parseTemp(r.temp);
  const limit = f ? ALARM_ABOVE[f.type] : undefined;
  const over = (limit !== undefined && val !== null && val > limit);

  card.classList.toggle('alarm', over);
  const badge = card.querySelector('.alarm-badge');
  if (badge) badge.hidden = !over;

  hint.classList.remove('over');

  if (!String(r.temp).trim()) {
    hint.textContent = (statusByLabel(r.status) && !statusByLabel(r.status).needsTemp)
      ? 'هذه الحالة لا تتطلب درجة حرارة' : 'استخدم − للقيم السالبة';
  } else if (val === null) {
    hint.textContent = 'القراءة غير صحيحة';
    hint.classList.add('over');
  } else if (over) {
    hint.innerHTML = '⚠ تجاوز الحد المسموح (' + num(limit) + ')';
    hint.classList.add('over');
  } else {
    hint.textContent = '✓ داخل الحد';
  }
}

function sectionAlarms(sec){
  let n = 0;
  sec.fridges.forEach(function(f){
    const r = state.readings[f.code];
    if (!r) return;
    const v = parseTemp(r.temp);
    const lim = ALARM_ABOVE[f.type];
    if (lim !== undefined && v !== null && v > lim) n++;
  });
  return n;
}

function alarmsIn(rows){
  return rows.filter(function(r){
    const lim = ALARM_ABOVE[r.type];
    return lim !== undefined && r.temp !== null && r.temp !== undefined && r.temp > lim;
  });
}

function openConfirm(over){
  $('#confirmText').innerHTML =
    'يوجد ' + arNum(over.length) + ' قراءة متجاوزة للحد: ' +
    over.map(function(r){ return '«' + esc(r.code) + '» ' + num(r.temp); }).join('، ') +
    '<br>يمكن المتابعة وحفظها كما هي.';
  $('#confirmModal').classList.add('on');
}

function paintCardState(code){
  const card = document.querySelector('#sectionBody .card[data-code="' + code.replace(/"/g,'\\"') + '"]');
  if (!card) return;
  const el = card.querySelector('.state');
  const r = state.readings[code];
  if (!r || !r.status) { el.className = 'state none'; el.textContent = 'لم تُسجَّل'; return; }
  if (state.dirty.has(code)) { el.className = 'state dirty'; el.textContent = 'معدّلة'; }
  else { el.className = 'state saved'; el.textContent = 'محفوظة ' + arabicClock(r.time); }
}

function setActionInfo(txt){ $('#abInfo').textContent = txt || ''; }

/* ---------- تعديل القيم ---------- */
function onInput(e){
  const input = e.target;
  const card = input.closest('.card');
  if (!card) return;
  const code = card.dataset.code;
  const r = readingOf(code);

  if (input.classList.contains('temp')) {
    r.temp = input.value;
    state.dirty.add(code);
    paintCardState(code);
    updateHint(card);
    scheduleAutosave();
  } else if (input.classList.contains('note-input')) {
    r.note = input.value;
    state.dirty.add(code);
    paintCardState(code);
    scheduleAutosave();
  }
}

function onClick(e){
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const card = btn.closest('.card');
  if (!card) return;
  const code = card.dataset.code;
  const r = readingOf(code);

  if (btn.dataset.act === 'status') {
    const label = btn.dataset.label;
    if (!label) return;
    r.status = label;
    state.dirty.add(code);
    card.querySelectorAll('.seg-btn').forEach(function(b){
      b.classList.toggle('on', b.dataset.label === label);
    });
    paintCardState(code);
    updateHint(card);
    const needs = statusByLabel(label) && statusByLabel(label).needsTemp;
    const input = card.querySelector('.temp');
    if (needs && !String(r.temp).trim()) input.focus();
    scheduleAutosave();
  }

  if (btn.dataset.act === 'sign') {
    const input = card.querySelector('.temp');
    const v = input.value.trim();
    input.value = !v ? '-' : (v.charAt(0) === '-' ? v.slice(1) : '-' + v);
    r.temp = input.value;
    state.dirty.add(code);
    paintCardState(code);
    updateHint(card);
    scheduleAutosave();
  }
}

/* ---------- تجميع بيانات القسم ---------- */
function collectSection(sec){
  const rows = [];
  const problems = [];
  sec.fridges.forEach(function(f){
    const r = readingOf(f.code);
    const st = statusByLabel(r.status);
    const tempStr = String(r.temp === null || r.temp === undefined ? '' : r.temp).trim();

    if (!r.status) { problems.push(f.code + ': اختر الحالة'); return; }
    if (st && st.needsTemp && !tempStr) { problems.push(f.code + ': اكتب درجة الحرارة'); return; }
    if (tempStr) {
      const n = parseTemp(tempStr);
      if (n === null) { problems.push(f.code + ': القراءة غير صحيحة'); return; }
      rows.push({ code:f.code, type:f.type, temp:n, status:r.status, note:(r.note || '').trim() });
    } else {
      rows.push({ code:f.code, type:f.type, temp:null, status:r.status, note:(r.note || '').trim() });
    }
  });
  return { rows:rows, problems:problems };
}

function hasDirtyIn(sec){
  return sec.fridges.some(function(f){ return state.dirty.has(f.code); });
}

/* ---------- الحفظ ---------- */
function scheduleAutosave(){
  clearTimeout(state.timer);
  state.force = false;
  state.timer = setTimeout(function(){
    const sec = activeSection();
    if (!sec || state.saving) return;
    if (!hasDirtyIn(sec)) return;
    const c = collectSection(sec);
    if (!c.rows.length || c.problems.length) return; /* الحفظ التلقائي عند اكتمال القسم فقط */
    saveSection({ silent:true, force:true });
  }, 1800);
}

function saveSection(opts){
  opts = opts || {};
  const sec = activeSection();
  if (!sec || state.saving) return Promise.resolve();

  const c = collectSection(sec);
  if (!c.rows.length) { toast('لا توجد قراءات مكتملة في هذا القسم', 'warn'); return Promise.resolve(); }
  if (c.problems.length && !opts.force) {
    showProblems(c.problems, sec, c.rows.length);
    return Promise.resolve();
  }

  const over = alarmsIn(c.rows);
  if (over.length && !opts.confirmed && !opts.silent) {
    openConfirm(over);
    return Promise.resolve();
  }
  hideProblems();
  state.force = false;
  state.saving = true;
  $('#saveBtn').textContent = 'جارٍ الحفظ…';

  const payload = {
    action:'saveSection', branch:state.branch, date:state.date, by:state.user,
    section:sec.name, readings:c.rows
  };

  return apiPost(payload)
    .then(function(res){ applySaved(sec, c.rows, res.time); return res; })
    .catch(function(err){
      /* قد يكون الحفظ قد تم دون وصول الرد — نتحقق من الخادم */
      return verifySaved(sec, c.rows).then(function(ok){
        if (!ok) throw err;
        applySaved(sec, c.rows, nowClock());
        return { saved:c.rows.length, time:nowClock() };
      });
    })
    .then(function(res){
      if (!opts.silent) {
        toast('تم حفظ «' + sec.name + '» ✓', 'ok');
      }
    })
    .catch(function(err){
      toast('تعذّر الحفظ: ' + err.message + ' — أعد المحاولة', 'bad');
      const card = document.querySelector('#sectionBody .card');
      if (card) card.scrollIntoView({ behavior:'smooth', block:'center' });
    })
    .then(function(){
      state.saving = false;
      $('#saveBtn').textContent = 'حفظ القسم';
      refreshHeader();
    });
}

function verifySaved(sec, rows){
  return apiGet({ action:'getDay', branch:state.branch, date:state.date })
    .then(function(d){
      const saved = d.readings || {};
      return rows.every(function(r){
        const s = saved[r.code];
        if (!s) return false;
        if (s.status !== r.status) return false;
        const a = parseTemp(s.temp);
        return r.temp === null ? a === null : a === r.temp;
      });
    })
    .catch(function(){ return false; });
}

function applySaved(sec, rows, time){
  rows.forEach(function(r){
    const cur = readingOf(r.code);
    cur.temp = r.temp === null ? '' : String(r.temp);
    cur.status = r.status;
    cur.note = r.note;
    cur.time = time || nowClock();
    state.dirty.delete(r.code);
  });
  renderChips();
  refreshHeader();
  document.querySelectorAll('#sectionBody .card').forEach(function(card){
    paintCardState(card.dataset.code);
  });
  const st = sectionStats(sec);
  const head = document.querySelector('#sectionBody .sec-title span');
  if (head) head.textContent = arNum(st.saved) + ' من ' + arNum(st.total) + ' مسجّلة';
}

function showProblems(problems, sec, readyCount){
  const box = $('#problems');
  box.innerHTML = '<b>يوجد ' + arNum(problems.length) + ' حقلًا ناقصًا:</b><ul>' +
    problems.slice(0, 6).map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') +
    '</ul><div style="margin-top:8px">لحفظ المكتمل فقط، اضغط «حفظ القسم» مرة أخرى.</div>';
  box.style.display = 'block';
  $('#saveBtn').textContent = 'حفظ المكتمل (' + arNum(readyCount) + ')';
  state.force = true;
}
function hideProblems(){
  const box = $('#problems');
  box.style.display = 'none';
  box.innerHTML = '';
  if (!state.saving) $('#saveBtn').textContent = 'حفظ القسم';
}

/* ---------- التنقل بين الأقسام ---------- */
function goSection(i){
  if (i < 0 || i >= state.sections.length) return;
  const cur = activeSection();
  const after = function(){
    state.active = i;
    hideProblems();
    renderChips();
    renderSection();
    window.scrollTo(0, 0);
  };
  if (cur && hasDirtyIn(cur)) {
    const c = collectSection(cur);
    if (c.rows.length) {
      saveSection({ silent:true, force:true }).then(after);
      return;
    }
  }
  after();
}

/* ---------- الأحداث ---------- */
function bind(){
  $('#dateInput').addEventListener('change', function(){
    localStorage.setItem(LS_COUNT, this.value);
    loadBranches();
  });
  $('#refreshBtn').addEventListener('click', function(){ loadBranches(); });

  $('#branchSelect').addEventListener('change', function(){
    updateBranchInfo();
    updateStartState();
  });
  $('#userName').addEventListener('input', updateStartState);
  $('#userName').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !$('#startBtn').disabled) startRecording();
  });
  $('#startBtn').addEventListener('click', startRecording);

  $('#backBtn').addEventListener('click', function(){
    if (state.dirty.size) {
      const sec = activeSection();
      if (sec) saveSection({ silent:true, force:true });
    }
    showScreen('start');
    loadBranches();
  });

  $('#pickDateBtn').addEventListener('click', function(){
    const el = document.createElement('input');
    el.type = 'date';
    el.value = state.date;
    el.max = todayISO();
    el.style.position = 'fixed'; el.style.opacity = '0'; el.style.pointerEvents = 'none';
    document.body.appendChild(el);
    el.addEventListener('change', function(){
      if (el.value && el.value !== state.date) openDay(state.branch, el.value);
      setTimeout(function(){ el.remove(); }, 100);
    });
    if (el.showPicker) { try { el.showPicker(); } catch (err) { el.focus(); el.click(); } }
    else { el.focus(); el.click(); }
  });

  $('#sectionChips').addEventListener('click', function(e){
    const chip = e.target.closest('.chip');
    if (chip) goSection(+chip.dataset.i);
  });

  $('#sectionBody').addEventListener('input', onInput);
  $('#sectionBody').addEventListener('click', onClick);

  $('#saveBtn').addEventListener('click', function(){
    if (state.force) { saveSection({ force:true }); return; }
    const sec = activeSection();
    if (!sec) return;
    const c = collectSection(sec);
    if (c.problems.length) { showProblems(c.problems, sec, c.rows.length); return; }
    saveSection({ force:true });
  });

  $('#prevBtn').addEventListener('click', function(){
    if (state.active > 0) goSection(state.active - 1);
  });

  $('#confirmCancel').addEventListener('click', function(){
    $('#confirmModal').classList.remove('on');
  });
  $('#confirmOk').addEventListener('click', function(){
    $('#confirmModal').classList.remove('on');
    saveSection({ force:true, confirmed:true });
  });

  $('#nextBtn').addEventListener('click', function(){
    if (state.active < state.sections.length - 1) {
      goSection(state.active + 1);
    } else {
      const t = totalStats();
      toast(t.saved >= t.total
        ? 'تم ✓ تسجيل جميع الثلاجات (' + arNum(t.total) + ') اليوم'
        : 'هذا آخر قسم — تبقّى ' + arNum(t.total - t.saved) + ' ثلاجة', t.saved >= t.total ? 'ok' : 'warn');
    }
  });

  window.addEventListener('beforeunload', function(e){
    if (state.dirty.size) { e.preventDefault(); e.returnValue = ''; }
  });

  window.addEventListener('online', function(){
    if (state.dirty.size) scheduleAutosave();
  });
}

/* ---------- البداية ---------- */
function boot(){
  const today = todayISO();
  const dateEl = $('#dateInput');
  dateEl.value = today;
  dateEl.max = today;

  const savedUser = localStorage.getItem(LS_USER) || '';
  $('#userName').value = savedUser;

  bind();

  let last = null;
  try { last = JSON.parse(localStorage.getItem(LS_LAST) || 'null'); } catch (e) {}

  loadBranches().then(function(){
    const hasLast = last && last.branch && state.branches.some(function(b){ return b.branch === last.branch; });

    if (hasLast) {
      /* يوم جديد: نختار الفرع السابق تلقائيًا ولا نفتح التسجيل */
      $('#branchSelect').value = last.branch;
      updateBranchInfo();
      updateStartState();
    }

    if (hasLast && last.date === today && last.user) {
      state.user = last.user;
      $('#userName').value = last.user;
      openDay(last.branch, today);
    }
  });
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
