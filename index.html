<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#112E5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>تسجيل درجات الحرارة — أسواق فتح الله</title>
<style>
  :root{
    color-scheme: light;
    --bg:#F4F5F7; --card:#FFFFFF; --card-done:#F6FAF7; --ink:#141B29; --muted:#606B80;
    --line:#E2E6EE; --brand:#C8102E; --brand-dark:#9E0B22; --brand-soft:#FDECEF;
    --navy:#112E5B; --navy-dark:#0A1E3E; --navy-soft:#EBF0F8;
    --ok:#0F8A56; --ok-soft:#E6F6EE; --warn:#B06A00; --warn-soft:#FEF4E2;
    --bad:#C62828; --bad-soft:#FDECEA;
    --shadow:0 1px 2px rgba(17,46,91,.05);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#0E131D; --card:#161E2C; --card-done:#14211D; --ink:#EEF2F9; --muted:#97A3B8;
      --line:#253147; --brand:#E6324B; --brand-dark:#BE1D34; --brand-soft:#35161D;
      --navy:#193A70; --navy-dark:#0D1C36; --navy-soft:#1C2A42;
      --ok:#2CD08C; --ok-soft:#112D23; --warn:#E6A22E; --warn-soft:#2F2510;
      --bad:#F06B6B; --bad-soft:#36191B;
      --shadow:none;
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-size:15.5px; line-height:1.45;
    font-family:'Segoe UI', Tahoma, 'Noto Kufi Arabic', Arial, sans-serif;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button, input, select{ font-family:inherit; font-size:15.5px; color:inherit; }
  button{ cursor:pointer; }
  .screen{ display:none; }
  .screen.on{ display:block; }

  .brand-lockup{ display:flex; align-items:center; gap:11px; }
  .brand-mark{
    width:42px; height:42px; flex:0 0 42px; border-radius:11px;
    background:#C8102E; border:2px solid rgba(255,255,255,.92);
    display:grid; place-items:center; box-shadow:0 4px 12px rgba(0,0,0,.18);
  }
  .brand-text h1{ margin:0; font-size:18px; font-weight:800; letter-spacing:-.2px; }
  .brand-text p{ margin:1px 0 0; font-size:12.5px; opacity:.86; }

  .hero{
    background:linear-gradient(155deg, var(--navy), var(--navy-dark));
    color:#fff; padding:20px 18px 18px; border-bottom:4px solid var(--brand);
    border-radius:0 0 22px 22px;
  }
  .hero-inner{ max-width:520px; margin:0 auto; }

  .datebar{ margin-top:14px; display:flex; gap:8px; align-items:center; }
  .datebar input[type="date"]{
    flex:1; min-height:44px; border:1px solid rgba(255,255,255,.18); border-radius:11px; padding:0 12px;
    background:rgba(255,255,255,.1); color:#fff; font-size:15px; font-weight:600;
  }
  .datebar input[type="date"]::-webkit-calendar-picker-indicator{ filter:invert(1); opacity:.85; }
  .icon-btn{
    width:44px; height:44px; flex:0 0 auto; border:none; border-radius:11px;
    background:rgba(255,255,255,.14); color:#fff; font-size:18px; display:flex;
    align-items:center; justify-content:center;
  }
  .icon-btn:active{ transform:scale(.96); }

  .pad{ padding:16px 14px 28px; max-width:520px; margin:0 auto; }
  .pick{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:16px; box-shadow:var(--shadow);
  }
  .fld{ display:block; margin-bottom:14px; }
  .fld > span{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:700; }
  .fld select, .fld input{
    width:100%; min-height:50px; border:1.5px solid var(--line); border-radius:11px;
    background:var(--bg); padding:0 12px; font-size:16px; outline:none; color:var(--ink);
  }
  .fld select:focus, .fld input:focus{ border-color:var(--brand); background:var(--card); box-shadow:0 0 0 3px var(--brand-soft); }
  .pick-info{ font-size:12.5px; color:var(--muted); min-height:18px; margin:-4px 0 14px; }

  .topstick{ position:sticky; top:0; z-index:30; background:var(--bg); border-bottom:1px solid var(--line); }
  .workbar{
    background:var(--navy); color:#fff;
    display:flex; align-items:center; gap:8px; padding:8px 10px;
    padding-top:calc(8px + env(safe-area-inset-top, 0px));
  }
  .workbar .icon-btn{ width:38px; height:38px; background:rgba(255,255,255,.14); font-size:16px; }
  .wb-title{ flex:1; min-width:0; line-height:1.25; text-align:center; }
  .wb-title b{ display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wb-title small{ font-size:11.5px; opacity:.85; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .progress{ height:3px; background:rgba(255,255,255,.18); }
  .progress i{ display:block; height:100%; width:0; background:var(--brand); transition:width .25s; }

  .chips{
    display:flex; gap:6px; overflow-x:auto; padding:8px 10px;
    scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; scroll-snap-align:center; border:1px solid var(--line); background:var(--card);
    border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; color:var(--muted);
    display:flex; align-items:center; gap:6px; white-space:nowrap; min-height:36px;
  }
  .chip b{ font-weight:700; color:inherit; font-variant-numeric:tabular-nums; }
  .chip.done{ color:var(--ok); border-color:var(--ok-soft); background:var(--ok-soft); }
  .chip.on{ background:var(--brand); border-color:var(--brand); color:#fff; }

  .work-wrap{ padding:10px 12px 150px; max-width:960px; margin:0 auto; }
  .sec-toolbar{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px;
    margin-bottom:10px;
  }
  .sec-title{ display:flex; align-items:baseline; gap:8px; }
  .sec-title b{ font-size:16.5px; color:var(--navy); }
  @media (prefers-color-scheme: dark){ .sec-title b{ color:var(--ink); } }
  .sec-title span{ font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }

  .filter-bar{
    display:flex; gap:4px; background:var(--card); border:1px solid var(--line);
    padding:3px; border-radius:10px;
  }
  .f-btn{
    border:none; background:transparent; color:var(--muted); font-size:12.5px; font-weight:700;
    padding:6px 10px; border-radius:7px; white-space:nowrap; min-height:34px;
    transition:background .12s, color .12s;
  }
  .f-btn.on{ background:var(--navy); color:#fff; }
  .f-btn.has-warn.on{ background:var(--bad); color:#fff; }

  .search-wrap{ width:100%; margin-bottom:10px; }
  .search-input{
    width:100%; min-height:42px; border:1px solid var(--line); border-radius:10px;
    background:var(--card); padding:0 12px; font-size:14px; outline:none;
  }
  .search-input:focus{ border-color:var(--navy); box-shadow:0 0 0 2px var(--navy-soft); }

  .cards-grid{
    display:grid; grid-template-columns:1fr; gap:8px;
  }
  @media (min-width: 720px){
    .cards-grid{ grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
  }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:10px 12px; box-shadow:var(--shadow);
    transition:background .15s, border-color .15s;
  }
  .card.is-saved{ background:var(--card-done); border-color:#CBE4D5; }
  @media (prefers-color-scheme: dark){ .card.is-saved{ border-color:#244435; } }
  .card.alarm{ border-color:var(--bad); box-shadow:0 0 0 2px var(--bad-soft); }

  .card-top{
    display:flex; align-items:center; gap:8px; margin-bottom:8px; min-height:28px;
  }
  .code{
    font-weight:800; font-size:15px; background:var(--navy); color:#fff;
    border-radius:7px; padding:2px 9px; white-space:nowrap; font-variant-numeric:tabular-nums;
  }
  .meta-line{
    flex:1; min-width:0; font-size:12.5px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .meta-line strong{ color:var(--brand-dark); font-weight:700; }
  @media (prefers-color-scheme: dark){ .meta-line strong{ color:#FF7A8D; } }

  .state{
    font-size:11.5px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums;
  }
  .state.saved{ color:var(--ok); }
  .state.dirty{ color:var(--warn); }
  .state.none{ color:var(--muted); }

  .note-toggle{
    width:34px; height:34px; flex:0 0 34px; border:1px solid var(--line); background:var(--bg);
    border-radius:8px; font-size:13px; color:var(--muted); display:grid; place-items:center;
  }
  .note-toggle.has-note{ border-color:var(--navy); color:var(--navy); background:var(--navy-soft); }

  .card-body{ display:flex; flex-direction:row-reverse; gap:8px; align-items:center; }

  .status-col{ flex:1; min-width:0; }
  .seg{
    display:flex; gap:3px; background:var(--bg); border:1px solid var(--line);
    padding:3px; border-radius:10px;
  }
  .seg-btn{
    flex:1; min-width:0; height:38px; border:none; background:transparent;
    border-radius:7px; font-size:12px; font-weight:700; color:var(--muted);
    padding:0 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:background .12s, color .12s, transform .08s;
  }
  .seg-btn:active{ transform:scale(.97); }
  .seg-btn.ok.on{ background:var(--ok); color:#fff; }
  .seg-btn.warn.on{ background:var(--warn); color:#fff; }
  .seg-btn.bad.on{ background:var(--bad); color:#fff; }
  .seg-btn.info.on{ background:var(--navy); color:#fff; }

  .temp-col{ flex:0 0 auto; display:flex; align-items:center; gap:4px; }
  .sign{
    width:38px; height:44px; border:1px solid var(--line); background:var(--bg);
    border-radius:9px; font-size:19px; font-weight:700; color:var(--navy); line-height:1;
  }
  @media (prefers-color-scheme: dark){ .sign{ color:var(--ink); } }
  .sign:active{ background:var(--navy-soft); }
  .temp{
    width:68px; height:44px; text-align:center; font-size:20px; font-weight:700;
    border:1.5px solid var(--line); border-radius:9px; background:var(--card); outline:none;
    direction:ltr; unicode-bidi:isolate; font-variant-numeric:tabular-nums;
  }
  .temp:focus{ border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
  .temp::placeholder{ font-size:12px; font-weight:500; color:var(--muted); }

  .hint{ font-size:11.5px; margin-top:6px; color:var(--bad); font-weight:700; display:none; }
  .hint.show{ display:block; }

  .note-box{ display:none; margin-top:8px; }
  .note-box.open{ display:block; }
  .note-input{
    width:100%; min-height:38px; border:1px solid var(--line); border-radius:9px;
    padding:0 10px; background:var(--bg); font-size:13.5px; outline:none;
  }
  .note-input:focus{ border-color:var(--navy); background:var(--card); }

  .actionbar{
    position:fixed; inset-inline:0; bottom:0; z-index:40; background:var(--card);
    border-top:1px solid var(--line); padding:8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    box-shadow:0 -4px 18px rgba(17,46,91,.07);
  }
  .actionbar .problems{ margin:0 0 8px; }
  .ab-info{ font-size:11.5px; color:var(--muted); text-align:center; margin-bottom:6px; font-variant-numeric:tabular-nums; }
  .ab-btns{ display:flex; gap:8px; max-width:960px; margin:0 auto; }
  .btn{
    flex:1; min-height:48px; border:none; border-radius:12px; font-size:15.5px; font-weight:700;
    padding:0 14px; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn.primary{ background:var(--brand); color:#fff; }
  .btn.primary:disabled{ background:var(--line); color:var(--muted); }
  .btn.ghost{ background:var(--bg); color:var(--ink); border:1px solid var(--line); flex:0 0 26%; font-size:13.5px; padding:0 6px; }
  .btn.ghost:disabled{ opacity:.45; }
  .btn:active{ transform:scale(.99); }

  .problems{
    display:none; background:var(--bad-soft); border:1px solid var(--bad);
    border-radius:12px; padding:10px 12px; font-size:13px; color:var(--bad); max-width:960px; margin-inline:auto;
  }
  .problems b{ display:block; margin-bottom:4px; font-size:14px; }
  .problems ul{ margin:4px 0 0; padding-inline-start:18px; line-height:1.7; }

  .toast{
    position:fixed; inset-inline:12px; bottom:calc(96px + env(safe-area-inset-bottom, 0px));
    max-width:520px; margin-inline:auto; z-index:60; pointer-events:none;
    background:var(--navy-dark); color:#fff; border-radius:11px; padding:11px 14px; font-size:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.22); opacity:0; transform:translateY(10px);
    transition:opacity .18s, transform .18s;
  }
  .toast.on{ opacity:1; transform:none; }
  .toast.ok{ background:var(--ok); }
  .toast.bad{ background:var(--bad); }
  .toast.warn{ background:var(--warn); }

  .banner{
    background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn);
    border-radius:11px; padding:10px 12px; font-size:13px; margin-bottom:10px;
  }
  .empty{
    text-align:center; padding:30px 18px; color:var(--muted); font-size:14px;
    background:var(--card); border-radius:var(--r); border:1px dashed var(--line);
  }
  .skel{ height:96px; border-radius:var(--r); background:linear-gradient(90deg,var(--card),var(--bg),var(--card)); background-size:200% 100%; animation:sh 1.2s infinite; margin-bottom:8px; }
  @keyframes sh{ 0%{background-position:0 0} 100%{background-position:-200% 0} }
  .modal{ position:fixed; inset:0; background:rgba(10,30,62,.55); display:none; align-items:flex-end; z-index:80; }
  .modal.on{ display:flex; }
  .sheet{
    background:var(--card); width:100%; max-width:520px; margin:0 auto;
    border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  .sheet h3{ margin:0 0 8px; font-size:16px; }
  .sheet p{ margin:0 0 14px; font-size:13.5px; color:var(--muted); line-height:1.7; }
  .sheet .btns{ display:flex; gap:8px; }
</style>
</head>
<body>

<section id="startScreen" class="screen on">
  <div class="hero">
    <div class="hero-inner">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M5 5H19V8.2H9.2V10.8H17V13.8H9.2V19H5V5Z" fill="#FFFFFF"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>أسواق فتح الله</h1>
          <p>متابعة وتسجيل درجات حرارة الثلاجات</p>
        </div>
      </div>

      <div class="datebar">
        <input type="date" id="dateInput" aria-label="التاريخ">
        <button class="icon-btn" id="refreshBtn" title="تحديث">⟳</button>
      </div>
    </div>
  </div>

  <div class="pad">
    <div id="apiBanner"></div>

    <div class="pick">
      <label class="fld">
        <span>الفرع</span>
        <select id="branchSelect">
          <option value="">— اختر الفرع —</option>
        </select>
      </label>

      <label class="fld">
        <span>اسم المسؤول</span>
        <input id="userName" type="text" placeholder="اكتب اسمك" maxlength="40" autocomplete="off">
      </label>

      <div class="pick-info" id="branchInfo"></div>

      <button class="btn primary" id="startBtn" disabled>ابدأ التسجيل</button>
    </div>
  </div>
</section>

<section id="workScreen" class="screen">
  <div class="topstick">
    <div class="workbar">
      <button class="icon-btn" id="backBtn" aria-label="رجوع">→</button>
      <div class="wb-title">
        <b id="wbBranch">—</b>
        <small id="wbSub">—</small>
      </div>
      <button class="icon-btn" id="pickDateBtn" aria-label="تغيير التاريخ">📅</button>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
    <div class="chips" id="sectionChips"></div>
  </div>

  <div class="work-wrap" id="sectionBody"></div>

  <div class="actionbar">
    <div class="problems" id="problems"></div>
    <div class="ab-info" id="abInfo"></div>
    <div class="ab-btns">
      <button class="btn ghost" id="prevBtn">السابق</button>
      <button class="btn primary" id="saveBtn">حفظ القسم</button>
      <button class="btn ghost" id="nextBtn">التالي</button>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<div class="modal" id="confirmModal">
  <div class="sheet">
    <h3>تأكيد الحفظ</h3>
    <p id="confirmText"></p>
    <div class="btns">
      <button class="btn ghost" id="confirmCancel">إلغاء</button>
      <button class="btn primary" id="confirmOk">تأكيد وإرسال</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbycG7Fld1-DO3kCcW-GotiiSPkzHpAwNL0lpmdfLpE8_bB_nh-mp8egD0cYcjPIIICI_A/exec";

const STATUSES = [
  { key: 'ok',    label: 'سليم',        tone: 'ok',   needsTemp: true  },
  { key: 'fault', label: 'به عطل',      tone: 'bad',  needsTemp: true  },
  { key: 'maint', label: 'تحت الصيانة', tone: 'warn', needsTemp: false }
];

const ALARM_ABOVE = {
  'تبريد': 8,
  'تجميد': -15
};

const $  = (s, r) => (r || document).querySelector(s);
const LS_LAST  = 'fathalla:last';
const LS_USER  = 'fathalla:user';
const LS_COUNT = 'fathalla:counts';
const LS_DRAFT_READINGS = 'fathalla:draft:readings';

const state = {
  branches: [],
  branch: '',
  user: '',
  date: '',
  sections: [],
  readings: {},
  active: 0,
  filter: 'all',
  query: '',
  dirty: new Set(),
  saving: false,
  timer: null,
  force: false
};

function esc(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function arNum(n){
  const d = '٠١٢٣٤٥٦٧٨٩';
  return String(n).replace(/\d/g, function(x){ return d[+x]; });
}
function num(n){
  return '<bdi dir="ltr">' + arNum(n) + '</bdi>';
}
function todayISO(){
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}
function fmtDate(iso){
  const p = String(iso).split('-');
  if (p.length !== 3) return iso;
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  try {
    return new Intl.DateTimeFormat('ar-EG', { weekday:'long', day:'numeric', month:'long' }).format(d);
  } catch (e) { return iso; }
}
function nowClock(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function arabicClock(hhmm){
  if (!hhmm) return '';
  const p = String(hhmm).split(':');
  if (p.length < 2) return hhmm;
  let h = +p[0];
  const suffix = h >= 12 ? 'م' : 'ص';
  h = h % 12; if (h === 0) h = 12;
  return arNum(h) + ':' + arNum(p[1].padStart(2,'0')) + ' ' + suffix;
}
function parseTemp(v){
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  if (!s || s === '-') return null;
  const n = Number(s
    .replace(/[٠-٩]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
    .replace(/[٫,]/g, '.')
    .replace(/[−–—]/g, '-'));
  return isFinite(n) ? n : null;
}
function getFridgeCooling(f){
  if (f && f.cooling) return f.cooling;
  return String((f && f.type) || '').split(/[|·]/)[0].trim() || 'تبريد';
}
function getFridgeSubtype(f){
  if (f && f.subtype) return f.subtype;
  const parts = String((f && f.type) || '').split(/[|·]/);
  return parts.length > 1 ? parts[1].trim() : '';
}
function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on ' + (kind || '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.className = 'toast ' + (kind || ''); }, 3200);
}
function apiReady(){ return API_URL && API_URL.indexOf('http') === 0; }

function fetchJSON(url, opts, timeoutMs){
  const ctrl = new AbortController();
  const timer = setTimeout(function(){ ctrl.abort(); }, timeoutMs || 25000);
  const o = Object.assign({}, opts || {}, { signal: ctrl.signal, cache: 'no-store' });
  return fetch(url, o).then(function(res){
    clearTimeout(timer);
    return res.text().then(function(txt){
      let data;
      try { data = JSON.parse(txt); }
      catch (e) { throw new Error('استجابة غير متوقعة من الخادم'); }
      if (!data || data.status !== 'success') {
        throw new Error((data && data.message) ? data.message : 'فشل الطلب');
      }
      return data;
    });
  }, function(err){
    clearTimeout(timer);
    if (err && err.name === 'AbortError') throw new Error('الاتصال بطيء — أعد المحاولة');
    throw new Error('تعذّر الاتصال بالخادم');
  });
}
function apiGet(params){
  if (!apiReady()) return Promise.reject(new Error('رابط الخادم غير مُعدّ'));
  const qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  return fetchJSON(API_URL + '?t=' + Date.now() + '&' + qs, { method:'GET' });
}
function apiPost(payload){
  if (!apiReady()) return Promise.reject(new Error('رابط الخادم غير مُعدّ'));
  return fetchJSON(API_URL, { method:'POST', body: JSON.stringify(payload), redirect:'follow' });
}

function showScreen(name){
  $('#startScreen').classList.toggle('on', name === 'start');
  $('#workScreen').classList.toggle('on', name === 'work');
  window.scrollTo(0, 0);
}

function renderBranchOptions(){
  const sel = $('#branchSelect');
  const prev = sel.value;

  if (!state.branches.length) {
    sel.innerHTML = '<option value="">لا توجد فروع مسجّلة</option>';
    $('#branchInfo').innerHTML = 'لا يوجد فرع مسجّل حتى الآن.';
    updateStartState();
    return;
  }

  sel.innerHTML = '<option value="">— اختر الفرع —</option>' +
    state.branches.map(function(b){
      return '<option value="' + esc(b.branch) + '">' + esc(b.branch) + '</option>';
    }).join('');

  if (prev) sel.value = prev;
  if (!sel.value && state.branches.length === 1) sel.value = state.branches[0].branch;

  updateBranchInfo();
  updateStartState();
}

function updateBranchInfo(){
  const val = $('#branchSelect').value;
  const b = state.branches.filter(function(x){ return x.branch === val; })[0];
  const info = $('#branchInfo');
  if (!b) { info.textContent = ''; return; }
  info.innerHTML = arNum(b.fridges) + ' ثلاجة في ' + arNum(b.sections) + ' أقسام · ' +
    arNum(b.saved) + ' سُجّلت اليوم';
}

function updateStartState(){
  const name = ($('#userName').value || '').trim();
  const ok = !!$('#branchSelect').value && name.length >= 3;
  $('#startBtn').disabled = !ok;
}

function startRecording(){
  const branch = $('#branchSelect').value;
  const name = ($('#userName').value || '').trim();
  if (!branch) { toast('اختر الفرع أولًا', 'warn'); return; }
  if (name.length < 3) { toast('أدخل اسمك (٣ أحرف على الأقل)', 'warn'); $('#userName').focus(); return; }

  state.user = name;
  localStorage.setItem(LS_USER, name);

  const date = $('#dateInput').value || todayISO();
  const b = state.branches.filter(function(x){ return x.branch === branch; })[0];
  if (b && b.saved > 0 && date === todayISO()) {
    const pct = Math.round(b.saved / b.fridges * 100);
    const info = document.createElement('div');
    info.className = 'banner';
    info.style.marginTop = '10px';
    info.innerHTML = '⚠ هذا الفرع سُجّل جزئياً اليوم بالفعل (<b>' + arNum(b.saved) + '</b> من <b>' + arNum(b.fridges) + '</b> ثلاجة — ' +
      arNum(pct) + '%). ' +
      '<button id="continueAnyway" style="margin-top:6px;border:none;background:var(--brand);color:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer">متابعة واستكمال</button>';
    const existing = document.querySelector('.pick .banner');
    if (existing) existing.remove();
    $('#startBtn').parentNode.insertBefore(info, $('#startBtn'));
    document.getElementById('continueAnyway').onclick = function(){
      info.remove();
      openDay(branch, date);
    };
    return;
  }

  openDay(branch, date);
}

function loadBranches(){
  if (!apiReady()) {
    $('#apiBanner').innerHTML = '<div class="banner">يجب إدخال رابط النشر في أعلى الكود ' +
      '(المتغير API_URL) لتشغيل الصفحة.</div>';
    return Promise.resolve();
  }
  const sel = $('#branchSelect');
  if (!state.branches.length) sel.innerHTML = '<option value="">جارٍ التحميل…</option>';

  return apiGet({ action:'getBranches', date:$('#dateInput').value || todayISO() })
    .then(function(d){
      state.branches = d.branches || [];
      renderBranchOptions();
    })
    .catch(function(e){
      sel.innerHTML = '<option value="">تعذّر التحميل</option>';
      $('#branchInfo').innerHTML =
        '<span style="color:var(--bad);font-weight:700">خطأ: ' + esc(e.message) + '</span><br>' +
        '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">' +
          '<button class="btn primary" style="min-height:40px;flex:1" onclick="loadBranches()">🔄 إعادة المحاولة</button>' +
          '<button class="btn ghost" style="min-height:40px;flex:1" onclick="clearCacheAndReload()">🗑 مسح الكاش</button>' +
        '</div>';
    });
}

function clearCacheAndReload(){
  try {
    localStorage.removeItem(LS_LAST);
    localStorage.removeItem(LS_USER);
    localStorage.removeItem(LS_DRAFT_READINGS);
  } catch(e) {}
  location.reload();
}

function openDay(branch, date){
  state.branch = branch;
  state.date = date;
  state.filter = 'all';
  state.query = '';
  state.dirty.clear();
  state.force = false;
  localStorage.setItem(LS_LAST, JSON.stringify({ branch:branch, date:date, user:state.user, ts:Date.now() }));

  showScreen('work');
  $('#wbBranch').textContent = branch;
  $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(date) + ' · جارٍ التحميل…';
  $('#sectionChips').innerHTML = '';
  $('#sectionBody').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  setActionInfo('…');
  hideProblems();

  return apiGet({ action:'getDay', branch:branch, date:date })
    .then(function(d){
      state.sections = d.sections || [];
      state.readings = {};
      const rawList = Array.isArray(d.readings) ? d.readings : [];
      rawList.forEach(function(item){
        if (!item || !item.code || !item.status) return;
        const secName = item.section || '';
        const k = readingKey(item.code, secName);
        state.readings[k] = {
          temp: (item.temp === null || item.temp === '' || item.temp === undefined) ? '' : String(item.temp),
          status: item.status || '',
          note: item.note || '',
          time: item.time || ''
        };
      });
      if (!state.sections.length) return renderNoFridges();

      const draft = loadDraftReadings(branch, date);
      if (draft && draft.readings) {
        let restored = 0;
        Object.keys(draft.readings).forEach(function(k){
          if (!state.readings[k] || !state.readings[k].status) {
            state.readings[k] = draft.readings[k];
            state.dirty.add(k);
            restored++;
          }
        });
        if (restored > 0) {
          const banner = document.createElement('div');
          banner.className = 'banner';
          banner.innerHTML = '🔄 تم استرجاع <b>' + arNum(restored) + '</b> قراءة غير محفوظة. ' +
            '<button style="border:none;background:var(--warn);color:#fff;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer" id="discardDraftBtn">تجاهل</button>';
          $('#sectionBody').parentNode.insertBefore(banner, $('#sectionBody'));
          document.getElementById('discardDraftBtn').onclick = function(){
            state.dirty.clear();
            clearDraftReadings();
            banner.remove();
            openDay(branch, date);
          };
        }
      }

      state.active = firstIncomplete();
      renderChips();
      renderSection();
      refreshHeader();
    })
    .catch(function(e){
      $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(date);
      $('#sectionBody').innerHTML =
        '<div class="empty">تعذّر تحميل بيانات الفرع<br><small>' + esc(e.message) + '</small><br><br>' +
        '<button class="btn primary" style="max-width:220px;margin:auto" id="retryDay">إعادة المحاولة</button></div>';
      const b = $('#retryDay');
      if (b) b.onclick = function(){ openDay(branch, date); };
    });
}

function renderNoFridges(){
  $('#sectionChips').innerHTML = '';
  $('#progressBar').style.width = '0%';
  $('#sectionBody').innerHTML =
    '<div class="empty">لا توجد ثلاجات مسجّلة لهذا الفرع.</div>';
  $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(state.date);
  setActionInfo('لا توجد ثلاجات');
  $('#saveBtn').disabled = true;
  $('#nextBtn').disabled = true;
  $('#prevBtn').disabled = true;
}

function readingKey(code, sectionName){
  const sec = sectionName !== undefined ? sectionName : (activeSection() ? activeSection().name : '');
  return sec + '|||' + code;
}
function readingOf(code, sectionName){
  const k = readingKey(code, sectionName);
  if (!state.readings[k]) state.readings[k] = { temp:'', status:'', note:'', time:'' };
  return state.readings[k];
}
function statusByLabel(label){
  for (let i = 0; i < STATUSES.length; i++) if (STATUSES[i].label === label) return STATUSES[i];
  return label ? { key:'other', label:label, tone:'info', needsTemp:true } : null;
}
function isSaved(code, sectionName){
  const r = state.readings[readingKey(code, sectionName)];
  return !!(r && r.status);
}
function isFridgeOver(f, secName){
  const r = state.readings[readingKey(f.code, secName)];
  if (!r) return false;
  const v = parseTemp(r.temp);
  const lim = ALARM_ABOVE[getFridgeCooling(f)];
  return (lim !== undefined && v !== null && v > lim);
}
function sectionStats(sec){
  let total = sec.fridges.length, saved = 0;
  sec.fridges.forEach(function(f){ if (isSaved(f.code, sec.name)) saved++; });
  return { total: total, saved: saved };
}
function totalStats(){
  let total = 0, saved = 0;
  state.sections.forEach(function(s){
    const st = sectionStats(s);
    total += st.total; saved += st.saved;
  });
  return { total: total, saved: saved };
}
function firstIncomplete(){
  for (let i = 0; i < state.sections.length; i++) {
    const st = sectionStats(state.sections[i]);
    if (st.saved < st.total) return i;
  }
  return 0;
}
function activeSection(){
  return state.sections[state.active] || null;
}

function refreshHeader(){
  const t = totalStats();
  const pct = t.total ? Math.round(t.saved / t.total * 100) : 0;
  const sec = activeSection();
  const st = sec ? sectionStats(sec) : { total:0, saved:0 };
  let alarms = 0;
  state.sections.forEach(function(s){ alarms += sectionAlarms(s); });
  $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(state.date) + ' · ' +
    arNum(t.saved) + ' / ' + arNum(t.total) + ' ثلاجة' +
    (alarms ? ' · ⚠ ' + arNum(alarms) + ' فوق الحد' : '');
  $('#progressBar').style.width = pct + '%';
  setActionInfo(sec
    ? 'القسم «' + sec.name + '» — ' + arNum(st.saved) + ' من ' + arNum(st.total) + ' مسجّلة'
    : '');
  $('#saveBtn').disabled = !sec;
  $('#nextBtn').disabled = !sec;
  $('#prevBtn').disabled = !sec || state.active === 0;
  document.title = arNum(t.saved) + '/' + arNum(t.total) + ' · ' + state.branch;
}

function renderChips(){
  const box = $('#sectionChips');
  box.innerHTML = state.sections.map(function(s, i){
    const st = sectionStats(s);
    const done = st.total > 0 && st.saved >= st.total;
    const alarms = sectionAlarms(s);
    let badge = '';
    if (alarms > 0 && !done) badge = ' ⚠' + arNum(alarms);
    else if (done) badge = ' ✓';
    return '<button class="chip ' + (i === state.active ? 'on' : '') + (done ? ' done' : '') + '" data-i="' + i + '">' +
      esc(s.name) + ' <b>' + arNum(st.saved) + '/' + arNum(st.total) + '</b>' + badge + '</button>';
  }).join('');
  const on = box.querySelector('.chip.on');
  if (on && on.scrollIntoView) on.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
}

function renderSection(){
  const sec = activeSection();
  const body = $('#sectionBody');
  if (!sec) { body.innerHTML = ''; return; }

  const st0 = sectionStats(sec);
  const al0 = sectionAlarms(sec);
  const todoCount = Math.max(0, st0.total - st0.saved);

  const toolbar = '<div class="sec-toolbar">' +
    '<div class="sec-title"><b>' + esc(sec.name) + '</b>' +
      '<span>' + arNum(st0.saved) + '/' + arNum(st0.total) + '</span>' +
    '</div>' +
    '<div class="filter-bar">' +
      '<button type="button" class="f-btn' + (state.filter === 'all' ? ' on' : '') + '" data-filter="all">الكل (' + arNum(st0.total) + ')</button>' +
      '<button type="button" class="f-btn' + (state.filter === 'todo' ? ' on' : '') + '" data-filter="todo">المتبقية (' + arNum(todoCount) + ')</button>' +
      (al0 ? '<button type="button" class="f-btn has-warn' + (state.filter === 'alarm' ? ' on' : '') + '" data-filter="alarm">⚠ (' + arNum(al0) + ')</button>' : '') +
    '</div>' +
  '</div>';

  const searchBar = (sec.fridges.length >= 6)
    ? '<div class="search-wrap"><input type="text" class="search-input" id="secSearch" value="' + esc(state.query) + '" placeholder="بحث برمز الثلاجة أو الموديل…" autocomplete="off"></div>'
    : '';

  const q = state.query.trim().toLowerCase();
  const visibleFridges = sec.fridges.filter(function(f){
    const saved = isSaved(f.code, sec.name);
    const over = isFridgeOver(f, sec.name);
    if (state.filter === 'todo' && saved && !state.dirty.has(readingKey(f.code, sec.name))) return false;
    if (state.filter === 'alarm' && !over) return false;
    if (q) {
      const hay = (f.code + ' ' + getFridgeCooling(f) + ' ' + getFridgeSubtype(f)).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  let cardsHtml = '';
  if (!visibleFridges.length) {
    cardsHtml = '<div class="empty">' +
      (state.filter === 'todo' && !q
        ? '✓ تم تسجيل جميع ثلاجات هذا القسم بالكامل'
        : 'لا توجد ثلاجات مطابقة للتصفية الحالية') +
      '</div>';
  } else {
    cardsHtml = '<div class="cards-grid">' + visibleFridges.map(function(f){
      const r = readingOf(f.code, sec.name);
      const st = statusByLabel(r.status);
      const coolingLabel = getFridgeCooling(f);
      const subtypeLabel = getFridgeSubtype(f);
      const limit = ALARM_ABOVE[coolingLabel];
      const val = parseTemp(r.temp);
      const over = (limit !== undefined && val !== null && val > limit);

      const statusBtns = (st && st.key === 'other' ? STATUSES.concat([st]) : STATUSES).map(function(s){
        return '<button type="button" class="seg-btn ' + s.tone + (r.status === s.label ? ' on' : '') +
          '" data-act="status" data-label="' + esc(s.label) + '">' + esc(s.label) + '</button>';
      }).join('');

      const rkey = readingKey(f.code, sec.name);
      const savedNow = isSaved(f.code, sec.name);
      const isCleanSaved = savedNow && !state.dirty.has(rkey);
      const stateText = savedNow
        ? (state.dirty.has(rkey) ? 'معدّلة' : '✓ ' + arabicClock(r.time))
        : 'لم تُسجَّل';

      return '<div class="card' + (isCleanSaved ? ' is-saved' : '') + (over ? ' alarm' : '') + '" data-code="' + esc(f.code) + '" data-section="' + esc(sec.name) + '">' +
        '<div class="card-top">' +
          '<span class="code">' + esc(f.code) + '</span>' +
          '<span class="meta-line">' + esc(coolingLabel) +
            (subtypeLabel ? ' · <strong>' + esc(subtypeLabel) + '</strong>' : '') +
          '</span>' +
          '<span class="state ' + (savedNow ? (state.dirty.has(rkey) ? 'dirty' : 'saved') : 'none') + '">' + stateText + '</span>' +
          '<button type="button" class="note-toggle' + (r.note ? ' has-note' : '') + '" data-act="note" title="ملاحظة">✎</button>' +
        '</div>' +

        '<div class="card-body">' +
          '<div class="status-col">' +
            '<div class="seg">' + statusBtns + '</div>' +
          '</div>' +
          '<div class="temp-col">' +
            '<input class="temp" dir="ltr" inputmode="decimal" enterkeyhint="next" autocomplete="off" ' +
              'value="' + esc(r.temp) + '" placeholder="°م">' +
            '<button type="button" class="sign" data-act="sign" aria-label="سالب">−</button>' +
          '</div>' +
        '</div>' +

        '<div class="hint"></div>' +
        '<div class="note-box' + (r.note ? ' open' : '') + '">' +
          '<input class="note-input" maxlength="120" placeholder="أضف ملاحظة (اختياري)…" value="' + esc(r.note) + '">' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  body.innerHTML = toolbar + searchBar + cardsHtml;

  body.querySelectorAll('.card').forEach(function(card){
    updateHint(card);
  });
  refreshHeader();
}

function updateHint(card){
  const code = card.dataset.code;
  const rkey = cardRkey(card);
  const sec = card.dataset.section;
  const f = (state.sections.filter(function(s){ return s.name === sec; })[0] || { fridges:[] })
              .fridges.filter(function(x){ return x.code === code; })[0];
  const r = state.readings[rkey] || readingOf(code, sec);
  const hint = card.querySelector('.hint');
  if (!hint) return;

  const val = parseTemp(r.temp);
  const limit = f ? ALARM_ABOVE[getFridgeCooling(f)] : undefined;
  const over = (limit !== undefined && val !== null && val > limit);

  card.classList.toggle('alarm', over);
  hint.classList.remove('show');

  if (String(r.temp).trim() && val === null) {
    hint.textContent = '⚠ القراءة غير صحيحة';
    hint.classList.add('show');
  } else if (over) {
    hint.innerHTML = '⚠ تجاوز الحد المسموح (' + num(limit) + '°)';
    hint.classList.add('show');
  }
}

function sectionAlarms(sec){
  let n = 0;
  sec.fridges.forEach(function(f){ if (isFridgeOver(f, sec.name)) n++; });
  return n;
}

function alarmsIn(rows){
  return rows.filter(function(r){
    const lim = ALARM_ABOVE[getFridgeCooling(r)];
    return lim !== undefined && r.temp !== null && r.temp !== undefined && r.temp > lim;
  });
}

function openConfirm(over){
  $('#confirmText').innerHTML =
    'يوجد ' + arNum(over.length) + ' قراءة متجاوزة للحد: ' +
    over.map(function(r){ return '«' + esc(r.code) + '» ' + num(r.temp); }).join('، ') +
    '<br>يمكن المتابعة وحفظها كما هي.';
  $('#confirmModal').classList.add('on');
}

function paintCardState(rkey){
  const parts = rkey.split('|||');
  const secName = parts[0];
  const code = parts.slice(1).join('|||');
  const card = document.querySelector(
    '#sectionBody .card[data-code="' + code.replace(/"/g,'\\"') + '"][data-section="' + secName.replace(/"/g,'\\"') + '"]'
  );
  if (!card) return;
  const el = card.querySelector('.state');
  const r = state.readings[rkey];
  const saved = !!(r && r.status);
  const isDirty = state.dirty.has(rkey);
  card.classList.toggle('is-saved', saved && !isDirty);
  if (!saved) { el.className = 'state none'; el.textContent = 'لم تُسجَّل'; return; }
  if (isDirty) { el.className = 'state dirty'; el.textContent = 'معدّلة'; }
  else { el.className = 'state saved'; el.textContent = '✓ ' + arabicClock(r.time); }
}

function setActionInfo(txt){ $('#abInfo').textContent = txt || ''; }

function cardRkey(card){
  return readingKey(card.dataset.code, card.dataset.section);
}

function onInput(e){
  const input = e.target;
  if (input.id === 'secSearch') {
    state.query = input.value;
    renderSection();
    const s = $('#secSearch');
    if (s) {
      s.focus();
      try { s.setSelectionRange(s.value.length, s.value.length); } catch (err) {}
    }
    return;
  }

  const card = input.closest('.card');
  if (!card) return;
  const rkey = cardRkey(card);
  const r = state.readings[rkey] || (state.readings[rkey] = { temp:'', status:'', note:'', time:'' });

  if (input.classList.contains('temp')) {
    r.temp = input.value;
    if (!r.status && parseTemp(r.temp) !== null && STATUSES.length) {
      r.status = STATUSES[0].label;
      card.querySelectorAll('.seg-btn').forEach(function(b){
        b.classList.toggle('on', b.dataset.label === r.status);
      });
    }
    state.dirty.add(rkey);
    paintCardState(rkey);
    updateHint(card);
    scheduleAutosave();
  } else if (input.classList.contains('note-input')) {
    r.note = input.value;
    const toggle = card.querySelector('.note-toggle');
    if (toggle) toggle.classList.toggle('has-note', !!r.note.trim());
    state.dirty.add(rkey);
    paintCardState(rkey);
    scheduleAutosave();
  }
}

function onKeyDown(e){
  if (e.key !== 'Enter') return;
  if (!e.target.classList.contains('temp')) return;
  e.preventDefault();
  const inputs = Array.prototype.slice.call(document.querySelectorAll('#sectionBody .temp'));
  const idx = inputs.indexOf(e.target);
  if (idx >= 0 && idx < inputs.length - 1) {
    inputs[idx + 1].focus();
    inputs[idx + 1].select();
  } else {
    e.target.blur();
  }
}

function onClick(e){
  const filterBtn = e.target.closest('[data-filter]');
  if (filterBtn) {
    state.filter = filterBtn.dataset.filter;
    renderSection();
    return;
  }

  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const card = btn.closest('.card');
  if (!card) return;
  const rkey = cardRkey(card);
  const r = state.readings[rkey] || (state.readings[rkey] = { temp:'', status:'', note:'', time:'' });

  if (btn.dataset.act === 'status') {
    const label = btn.dataset.label;
    if (!label) return;
    r.status = label;
    state.dirty.add(rkey);
    card.querySelectorAll('.seg-btn').forEach(function(b){
      b.classList.toggle('on', b.dataset.label === label);
    });
    paintCardState(rkey);
    updateHint(card);
    const needs = statusByLabel(label) && statusByLabel(label).needsTemp;
    const input = card.querySelector('.temp');
    if (needs && !String(r.temp).trim()) input.focus();
    scheduleAutosave();
  }

  if (btn.dataset.act === 'sign') {
    const input = card.querySelector('.temp');
    const v = input.value.trim();
    input.value = !v ? '-' : (v.charAt(0) === '-' ? v.slice(1) : '-' + v);
    r.temp = input.value;
    if (!r.status && parseTemp(r.temp) !== null && STATUSES.length) {
      r.status = STATUSES[0].label;
      card.querySelectorAll('.seg-btn').forEach(function(b){
        b.classList.toggle('on', b.dataset.label === r.status);
      });
    }
    state.dirty.add(rkey);
    paintCardState(rkey);
    updateHint(card);
    input.focus();
    scheduleAutosave();
  }

  if (btn.dataset.act === 'note') {
    const box = card.querySelector('.note-box');
    if (!box) return;
    const willOpen = !box.classList.contains('open');
    box.classList.toggle('open', willOpen);
    if (willOpen) {
      const inp = box.querySelector('.note-input');
      if (inp) inp.focus();
    }
  }
}

function collectSection(sec){
  const rows = [];
  const problems = [];
  sec.fridges.forEach(function(f){
    const r = readingOf(f.code, sec.name);
    const st = statusByLabel(r.status);
    const tempStr = String(r.temp === null || r.temp === undefined ? '' : r.temp).trim();

    if (!r.status) { problems.push(f.code + ': لم تختر الحالة بعد'); return; }
    if (st && st.needsTemp && !tempStr) { problems.push(f.code + ': لم تكتب درجة الحرارة'); return; }

    const cooling = getFridgeCooling(f);
    const subtype = getFridgeSubtype(f);

    if (tempStr) {
      const n = parseTemp(tempStr);
      if (n === null) { problems.push(f.code + ': الرقم المكتوب غير صحيح'); return; }
      rows.push({ code:f.code, cooling:cooling, subtype:subtype, type:f.type, temp:n, status:r.status, note:(r.note || '').trim() });
    } else {
      rows.push({ code:f.code, cooling:cooling, subtype:subtype, type:f.type, temp:null, status:r.status, note:(r.note || '').trim() });
    }
  });
  return { rows:rows, problems:problems };
}

function hasDirtyIn(sec){
  return sec.fridges.some(function(f){ return state.dirty.has(readingKey(f.code, sec.name)); });
}

function saveDraftReadings(){
  if (!state.branch || !state.date) return;
  try {
    localStorage.setItem(LS_DRAFT_READINGS, JSON.stringify({
      branch: state.branch,
      date: state.date,
      user: state.user,
      readings: state.readings,
      ts: Date.now()
    }));
  } catch(e) {}
}

function loadDraftReadings(branch, date){
  try {
    const raw = localStorage.getItem(LS_DRAFT_READINGS);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (d.branch === branch && d.date === date) return d;
  } catch(e) {}
  return null;
}

function clearDraftReadings(){
  try { localStorage.removeItem(LS_DRAFT_READINGS); } catch(e) {}
}

function scheduleAutosave(){
  clearTimeout(state.timer);
  state.force = false;
  saveDraftReadings();
  state.timer = setTimeout(function(){
    const sec = activeSection();
    if (!sec || state.saving) return;
    if (!hasDirtyIn(sec)) return;
    const c = collectSection(sec);
    if (!c.rows.length || c.problems.length) return;
    saveSection({ silent:true, force:true });
  }, 1800);
}

function saveSection(opts){
  opts = opts || {};
  const sec = activeSection();
  if (!sec || state.saving) return Promise.resolve();

  const c = collectSection(sec);
  if (!c.rows.length) { toast('لا توجد قراءات مكتملة في هذا القسم', 'warn'); return Promise.resolve(); }
  if (c.problems.length && !opts.force) {
    showProblems(c.problems, sec, c.rows.length);
    return Promise.resolve();
  }

  const over = alarmsIn(c.rows);
  if (over.length && !opts.confirmed && !opts.silent) {
    openConfirm(over);
    return Promise.resolve();
  }
  hideProblems();
  state.force = false;
  state.saving = true;
  $('#saveBtn').textContent = 'جارٍ الحفظ…';

  const payload = {
    action:'saveSection', branch:state.branch, date:state.date, by:state.user,
    section:sec.name, readings:c.rows
  };

  return apiPost(payload)
    .then(function(res){ applySaved(sec, c.rows, res.time); return res; })
    .catch(function(err){
      return verifySaved(sec, c.rows).then(function(ok){
        if (!ok) throw err;
        applySaved(sec, c.rows, nowClock());
        return { saved:c.rows.length, time:nowClock() };
      });
    })
    .then(function(res){
      if (!opts.silent) {
        toast('تم حفظ «' + sec.name + '» ✓', 'ok');
      }
    })
    .catch(function(err){
      toast('تعذّر الحفظ: ' + err.message + ' — أعد المحاولة', 'bad');
    })
    .then(function(){
      state.saving = false;
      $('#saveBtn').textContent = 'حفظ القسم';
      refreshHeader();
    });
}

function verifySaved(sec, rows){
  return apiGet({ action:'getDay', branch:state.branch, date:state.date })
    .then(function(d){
      const list = Array.isArray(d.readings) ? d.readings : [];
      return rows.every(function(r){
        const s = list.filter(function(x){
          return x.section === sec.name && x.code === r.code;
        })[0];
        if (!s) return false;
        if (s.status !== r.status) return false;
        const a = parseTemp(s.temp);
        return r.temp === null ? a === null : a === r.temp;
      });
    })
    .catch(function(){ return false; });
}

function applySaved(sec, rows, time){
  rows.forEach(function(r){
    const cur = readingOf(r.code, sec.name);
    cur.temp = r.temp === null ? '' : String(r.temp);
    cur.status = r.status;
    cur.note = r.note;
    cur.time = time || nowClock();
    state.dirty.delete(readingKey(r.code, sec.name));
  });
  if (!state.dirty.size) clearDraftReadings();
  renderChips();
  refreshHeader();
  document.querySelectorAll('#sectionBody .card').forEach(function(card){
    paintCardState(cardRkey(card));
  });
  const st = sectionStats(sec);
  const head = document.querySelector('#sectionBody .sec-title span');
  if (head) head.textContent = arNum(st.saved) + '/' + arNum(st.total);
}

function showProblems(problems, sec, readyCount){
  const box = $('#problems');
  const msgs = problems.slice(0, 6);
  const extra = problems.length > 6 ? ' وغيرها' : '';
  box.innerHTML = '<b>' + arNum(problems.length) + ' ثلاجة ناقصة في هذا القسم</b><ul>' +
    msgs.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') +
    (extra ? '<li>' + extra + '</li>' : '') +
    '</ul>' +
    (readyCount > 0
      ? '<div style="margin-top:6px;font-weight:700">اضغط حفظ مرة ثانية لحفظ ' + arNum(readyCount) + ' ثلاجة مكتملة فقط.</div>'
      : '');
  box.style.display = 'block';
  $('#saveBtn').textContent = readyCount > 0 ? 'حفظ المكتمل (' + arNum(readyCount) + ')' : 'حفظ القسم';
  state.force = readyCount > 0;
}
function hideProblems(){
  const box = $('#problems');
  box.style.display = 'none';
  box.innerHTML = '';
  if (!state.saving) $('#saveBtn').textContent = 'حفظ القسم';
}

function goSection(i){
  if (i < 0 || i >= state.sections.length) return;
  const cur = activeSection();
  const after = function(){
    state.active = i;
    state.query = '';
    hideProblems();
    renderChips();
    renderSection();
    window.scrollTo(0, 0);
  };
  if (cur && hasDirtyIn(cur)) {
    const c = collectSection(cur);
    if (c.rows.length) {
      saveSection({ silent:true, force:true }).then(after);
      return;
    }
  }
  after();
}

function bind(){
  $('#dateInput').addEventListener('change', function(){
    localStorage.setItem(LS_COUNT, this.value);
    loadBranches();
  });
  $('#refreshBtn').addEventListener('click', function(){ loadBranches(); });

  $('#branchSelect').addEventListener('change', function(){
    updateBranchInfo();
    updateStartState();
  });
  $('#userName').addEventListener('input', updateStartState);
  $('#userName').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !$('#startBtn').disabled) startRecording();
  });
  $('#startBtn').addEventListener('click', startRecording);

  $('#backBtn').addEventListener('click', function(){
    if (state.dirty.size) {
      const sec = activeSection();
      if (sec) saveSection({ silent:true, force:true });
    }
    showScreen('start');
    loadBranches();
  });

  $('#pickDateBtn').addEventListener('click', function(){
    const el = document.createElement('input');
    el.type = 'date';
    el.value = state.date;
    el.max = todayISO();
    el.style.position = 'fixed'; el.style.opacity = '0'; el.style.pointerEvents = 'none';
    document.body.appendChild(el);
    el.addEventListener('change', function(){
      if (el.value && el.value !== state.date) openDay(state.branch, el.value);
      setTimeout(function(){ el.remove(); }, 100);
    });
    if (el.showPicker) { try { el.showPicker(); } catch (err) { el.focus(); el.click(); } }
    else { el.focus(); el.click(); }
  });

  $('#sectionChips').addEventListener('click', function(e){
    const chip = e.target.closest('.chip');
    if (chip) goSection(+chip.dataset.i);
  });

  $('#sectionBody').addEventListener('input', onInput);
  $('#sectionBody').addEventListener('keydown', onKeyDown);
  $('#sectionBody').addEventListener('click', onClick);

  $('#saveBtn').addEventListener('click', function(){
    if (state.force) { saveSection({ force:true }); return; }
    const sec = activeSection();
    if (!sec) return;
    const c = collectSection(sec);
    if (c.problems.length) { showProblems(c.problems, sec, c.rows.length); return; }
    saveSection({ force:true });
  });

  $('#prevBtn').addEventListener('click', function(){
    if (state.active > 0) goSection(state.active - 1);
  });

  $('#confirmCancel').addEventListener('click', function(){
    $('#confirmModal').classList.remove('on');
  });
  $('#confirmOk').addEventListener('click', function(){
    $('#confirmModal').classList.remove('on');
    saveSection({ force:true, confirmed:true });
  });

  $('#nextBtn').addEventListener('click', function(){
    if (state.active < state.sections.length - 1) {
      goSection(state.active + 1);
    } else {
      const t = totalStats();
      toast(t.saved >= t.total
        ? 'تم ✓ تسجيل جميع الثلاجات (' + arNum(t.total) + ') اليوم'
        : 'هذا آخر قسم — تبقّى ' + arNum(t.total - t.saved) + ' ثلاجة', t.saved >= t.total ? 'ok' : 'warn');
    }
  });

  window.addEventListener('beforeunload', function(e){
    if (state.dirty.size) { e.preventDefault(); e.returnValue = ''; }
  });

  window.addEventListener('online', function(){
    if (state.dirty.size) scheduleAutosave();
  });
}

function boot(){
  const today = todayISO();
  const dateEl = $('#dateInput');
  dateEl.value = today;
  dateEl.max = today;

  const savedUser = localStorage.getItem(LS_USER) || '';
  $('#userName').value = savedUser;

  bind();

  let last = null;
  try { last = JSON.parse(localStorage.getItem(LS_LAST) || 'null'); } catch (e) {}

  loadBranches().then(function(){
    const hasLast = last && last.branch && state.branches.some(function(b){ return b.branch === last.branch; });

    if (hasLast) {
      $('#branchSelect').value = last.branch;
      updateBranchInfo();
      updateStartState();
    }

    if (hasLast && last.date === today && last.user) {
      state.user = last.user;
      $('#userName').value = last.user;
      openDay(last.branch, today);
    }
  });
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
