<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>تسجيل درجات الحرارة — أسواق فتح الله للجملة</title>
<style>
  :root{
    color-scheme: light;
    --bg:#F5F4F2; --card:#FFFFFF; --ink:#141414; --muted:#666666;
    --line:#E5E2DC; --brand:#F37021; --brand-dark:#DF5B00; --brand-soft:#FFF1E6;
    --black:#141414; --black-soft:#242424;
    --ok:#107C41; --ok-soft:#E7F6ED;
    --warn:#B45309; --warn-soft:#FEF3C7;
    --bad:#C62828; --bad-soft:#FDECEA;
    --shadow:0 1px 3px rgba(20,20,20,.06), 0 8px 22px rgba(20,20,20,.05);
    --r:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#0E0E0E; --card:#181818; --ink:#F4F4F2; --muted:#A3A3A3;
      --line:#2B2B2B; --brand:#F37021; --brand-dark:#FF8538; --brand-soft:#2D1A0E;
      --black:#111111; --black-soft:#222222;
      --ok:#2DCE7A; --ok-soft:#102B1D;
      --warn:#F59E0B; --warn-soft:#2F220B;
      --bad:#EF5350; --bad-soft:#341616;
      --shadow:none;
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45;
    font-family:'Segoe UI', Tahoma, 'Noto Kufi Arabic', Arial, sans-serif;
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  button, input, select{ font-family:inherit; font-size:16px; color:inherit; }
  button{ cursor:pointer; }
  .screen{ display:none; }
  .screen.on{ display:block; }

  /* ================= ترويسة أسواق فتح الله (برتقالي على أسود) ================= */
  .hero{
    background:linear-gradient(165deg, #1A1A1A, #0D0D0D);
    color:#fff; padding:20px 16px 18px;
    border-bottom:4px solid var(--brand);
    border-radius:0 0 24px 24px;
  }
  .brand-lockup{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:44px; height:44px; flex:0 0 44px; border-radius:12px;
    background:var(--brand); color:#fff;
    display:grid; place-items:center;
    box-shadow:0 4px 14px rgba(243,112,33,.35);
  }
  .hero h1{ margin:0; font-size:18px; font-weight:800; letter-spacing:-.2px; }
  .hero p{ margin:2px 0 0; font-size:12.5px; color:#D4D4D4; }

  .datebar{ margin-top:16px; display:flex; gap:8px; align-items:center; }
  .datebar input[type="date"]{
    flex:1; min-height:46px; border:1px solid rgba(255,255,255,.16); border-radius:12px;
    padding:0 12px; background:rgba(255,255,255,.08); color:#fff; font-size:15px; font-weight:600;
  }
  .datebar input[type="date"]::-webkit-calendar-picker-indicator{ filter:invert(1); opacity:.9; }
  .icon-btn{
    width:44px; height:44px; flex:0 0 44px; border:1px solid rgba(255,255,255,.15);
    border-radius:12px; background:rgba(255,255,255,.1); color:#fff; font-size:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active{ transform:scale(.95); }

  /* ================= شاشة البداية ================= */
  .pad{ padding:16px 14px 32px; max-width:520px; margin:0 auto; }
  .pick{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:16px; box-shadow:var(--shadow);
  }
  .fld{ display:block; margin-bottom:14px; }
  .fld > span{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:700; }
  .fld select, .fld input{
    width:100%; min-height:50px; border:1.5px solid var(--line); border-radius:12px;
    background:var(--bg); padding:0 12px; font-size:16px; outline:none; color:var(--ink);
  }
  .fld select:focus, .fld input:focus{
    border-color:var(--brand); background:var(--card); box-shadow:0 0 0 3px var(--brand-soft);
  }
  .pick-info{ font-size:13px; color:var(--muted); min-height:18px; margin:-4px 0 14px; }

  /* ================= شاشة العمل ================= */
  .topstick{ position:sticky; top:0; z-index:30; background:var(--bg); border-bottom:1px solid var(--line); }
  .workbar{
    background:var(--black); color:#fff;
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top, 0px));
  }
  .wb-title{ flex:1; min-width:0; line-height:1.25; text-align:center; }
  .wb-title b{ display:block; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wb-title small{ font-size:11.5px; color:#CFCFCF; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .progress{ height:4px; background:#2E2E2E; }
  .progress i{ display:block; height:100%; width:0; background:var(--brand); transition:width .25s; }

  .chips{
    display:flex; gap:8px; overflow-x:auto; padding:10px 12px;
    scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; scroll-snap-align:center; border:1.5px solid var(--line); background:var(--card);
    border-radius:12px; padding:9px 13px; font-size:13.5px; font-weight:700; color:var(--muted);
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .chip .dot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .chip.done{ color:var(--ok); border-color:var(--ok-soft); background:var(--ok-soft); }
  .chip.done .dot{ background:var(--ok); }
  .chip.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .chip.on .dot{ background:#fff; }

  /* ================= محتوى القسم ================= */
  .cards{ padding:10px 12px 190px; max-width:600px; margin:0 auto; }
  .sec-title{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:2px 2px 8px; }
  .sec-title b{ font-size:17px; font-weight:800; }
  .sec-title span{ font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }

  .sec-toolbar{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .filter-row{ display:flex; gap:6px; }
  .flt-btn{
    flex:1; min-height:38px; border:1.5px solid var(--line); background:var(--card);
    border-radius:10px; font-size:12.5px; font-weight:700; color:var(--muted);
    padding:0 8px; white-space:nowrap;
  }
  .flt-btn.on{ background:var(--black); border-color:var(--black); color:#fff; }
  @media (prefers-color-scheme: dark){
    .flt-btn.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
  }
  .flt-btn.warn-flt.on{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .search-box{ position:relative; }
  .search-box input{
    width:100%; min-height:42px; border:1.5px solid var(--line); border-radius:11px;
    background:var(--card); padding:0 12px; font-size:14.5px; outline:none;
  }
  .search-box input:focus{ border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }

  /* ================= بطاقة الثلاجة (محاذاة متساوية من الأعلى) ================= */
  .card{
    background:var(--card); border:1.5px solid var(--line); border-radius:var(--r);
    padding:12px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .card.is-done{ border-color:var(--ok-soft); }
  .card.alarm{ border-color:var(--bad); box-shadow:0 0 0 2px var(--bad-soft), var(--shadow); }
  .card[hidden]{ display:none !important; }

  .card-top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
    margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .card-id{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .card-row1{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .code{
    font-weight:800; font-size:15.5px; background:var(--black); color:#fff;
    border-radius:8px; padding:3px 10px; letter-spacing:.2px;
  }
  .alarm-badge{
    background:var(--bad); color:#fff; border-radius:7px; font-size:11px;
    padding:3px 7px; font-weight:700; white-space:nowrap;
  }
  .card-row2{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .type{ font-size:12.5px; font-weight:700; color:var(--muted); }
  .subtype-tag{
    font-size:12px; color:var(--brand-dark); background:var(--brand-soft);
    border:1px solid rgba(243,112,33,.25);
    border-radius:7px; padding:2px 8px; font-weight:700;
  }

  .state{
    font-size:11px; font-weight:700; padding:4px 9px; border-radius:8px;
    white-space:nowrap; flex:0 0 auto;
  }
  .state.saved{ background:var(--ok-soft); color:var(--ok); }
  .state.dirty{ background:var(--warn-soft); color:var(--warn); }
  .state.none{ background:var(--bg); color:var(--muted); }

  /* flex-start يثبت عنوان "الحالة" مع "الحرارة" والمربعين مع خانة الدرجة على خط واحد */
  .card-body{ display:flex; flex-direction:row; gap:10px; align-items:flex-start; }
  .flabel{ font-size:11px; font-weight:700; color:var(--muted); margin-bottom:5px; line-height:1.25; }

  .status-col{ flex:1; min-width:0; }
  .seg{ display:flex; gap:6px; }
  .seg-btn{
    flex:1; min-width:0; height:48px; border:1.5px solid var(--line); background:var(--bg);
    border-radius:11px; font-size:14px; font-weight:800; color:var(--muted);
    padding:0 6px; position:relative; transition:transform .08s, background .12s;
    white-space:nowrap;
  }
  .seg-btn:active{ transform:scale(.97); }
  .seg-btn.ok.on{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .seg-btn.bad.on{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .seg-btn.warn.on{ background:var(--warn); border-color:var(--warn); color:#fff; }
  .seg-btn.info.on{ background:var(--brand); border-color:var(--brand); color:#fff; }

  .temp-col{ flex:0 0 auto; display:flex; flex-direction:column; }
  .temp-row{ display:flex; direction:ltr; align-items:stretch; gap:5px; }
  .sign{
    width:42px; height:48px; flex:0 0 42px; border:1.5px solid var(--line); background:var(--bg);
    border-radius:10px; font-size:22px; font-weight:800; color:var(--ink); line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .sign:active{ background:var(--brand-soft); border-color:var(--brand); }
  .temp{
    width:78px; height:48px; text-align:center; font-size:21px; font-weight:800;
    border:1.5px solid var(--line); border-radius:10px; background:var(--card); outline:none;
    direction:ltr; unicode-bidi:isolate; font-variant-numeric:tabular-nums;
  }
  .temp:focus{ border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
  .temp::placeholder{ font-size:13px; font-weight:600; color:var(--muted); }

  .hint{ font-size:11px; margin-top:5px; color:var(--muted); min-height:15px; text-align:center; }
  .hint.over{ color:var(--bad); font-weight:700; }

  details.note{ margin-top:6px; }
  details.note summary{
    font-size:12px; color:var(--muted); cursor:pointer; list-style:none; padding:4px 0; font-weight:600;
  }
  details.note summary::-webkit-details-marker{ display:none; }
  details.note summary::before{ content:"+ "; color:var(--brand); font-weight:800; }
  details.note[open] summary::before{ content:"− "; }
  .note input{
    width:100%; margin-top:6px; min-height:42px; border:1.5px solid var(--line); border-radius:10px;
    padding:0 10px; background:var(--bg); font-size:14px; outline:none;
  }
  .note input:focus{ border-color:var(--brand); background:var(--card); }

  /* ================= شريط الحفظ ================= */
  .actionbar{
    position:fixed; inset-inline:0; bottom:0; z-index:40; background:var(--card);
    border-top:1px solid var(--line); padding:9px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    box-shadow:0 -6px 22px rgba(0,0,0,.08);
  }
  .actionbar .problems{ margin:0 auto 9px; max-width:600px; }
  .ab-info{ font-size:12px; color:var(--muted); text-align:center; margin-bottom:7px; font-variant-numeric:tabular-nums; }
  .ab-btns{ display:flex; gap:8px; max-width:600px; margin:0 auto; }
  .btn{
    flex:1; min-height:52px; border:none; border-radius:13px; font-size:15.5px; font-weight:800;
    padding:0 14px; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn.primary{ background:var(--brand); color:#fff; }
  .btn.primary:disabled{ background:var(--line); color:var(--muted); }
  .btn.ghost{ background:var(--bg); color:var(--ink); border:1.5px solid var(--line); flex:0 0 26%; font-size:14px; padding:0 6px; }
  .btn.ghost:disabled{ opacity:.45; }
  .btn:active{ transform:scale(.99); }

  .problems{
    display:none; background:var(--bad-soft); border:1px solid var(--bad);
    border-radius:12px; padding:10px 12px; font-size:13.5px; color:var(--bad);
  }
  .problems b{ display:block; margin-bottom:4px; font-size:14px; }
  .problems ul{ margin:4px 0 0; padding-inline-start:18px; line-height:1.8; }

  /* ================= متفرقات ================= */
  .toast{
    position:fixed; inset-inline:12px; bottom:calc(96px + env(safe-area-inset-bottom, 0px));
    max-width:520px; margin-inline:auto; z-index:60; pointer-events:none;
    background:var(--black); color:#fff; border-radius:12px; padding:12px 14px; font-size:14px; font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.25); opacity:0; transform:translateY(10px);
    transition:opacity .18s, transform .18s;
  }
  .toast.on{ opacity:1; transform:none; }
  .toast.ok{ background:var(--ok); }
  .toast.bad{ background:var(--bad); }
  .toast.warn{ background:var(--warn); }

  .banner{
    background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn);
    border-radius:12px; padding:10px 12px; font-size:13px; margin-bottom:12px;
  }
  .empty{
    text-align:center; padding:32px 18px; color:var(--muted); font-size:14px;
    background:var(--card); border-radius:var(--r); border:1.5px dashed var(--line);
  }
  .skel{ height:120px; border-radius:var(--r); background:linear-gradient(90deg,var(--card),var(--bg),var(--card)); background-size:200% 100%; animation:sh 1.2s infinite; margin-bottom:12px; }
  @keyframes sh{ 0%{background-position:0 0} 100%{background-position:-200% 0} }
  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; z-index:80; }
  .modal.on{ display:flex; }
  .sheet{
    background:var(--card); width:100%; max-width:520px; margin:0 auto;
    border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  .sheet h3{ margin:0 0 8px; font-size:16px; }
  .sheet p{ margin:0 0 14px; font-size:13.5px; color:var(--muted); line-height:1.7; }
  .sheet .btns{ display:flex; gap:8px; }
</style>
</head>
<body>

<!-- ============ شاشة البداية ============ -->
<section id="startScreen" class="screen on">
  <div class="hero">
    <div class="brand-lockup">
      <div class="brand-mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M5 5H19V8.4H9.4V11H17.2V14.2H9.4V19H5V5Z" fill="#FFFFFF"/>
        </svg>
      </div>
      <div>
        <h1>أسواق فتح الله للجملة</h1>
        <p>متابعة وتسجيل درجات حرارة الثلاجات</p>
      </div>
    </div>
    <div class="datebar">
      <input type="date" id="dateInput" aria-label="التاريخ">
      <button class="icon-btn" id="refreshBtn" title="تحديث">⟳</button>
    </div>
  </div>

  <div class="pad">
    <div id="apiBanner"></div>

    <div class="pick">
      <label class="fld">
        <span>الفرع</span>
        <select id="branchSelect">
          <option value="">— اختر الفرع —</option>
        </select>
      </label>

      <label class="fld">
        <span>اسم مراقب الجودة</span>
        <input id="userName" type="text" placeholder="الاسم ثلاثي أو اسم المستخدم" maxlength="40" autocomplete="off">
      </label>

      <div class="pick-info" id="branchInfo"></div>

      <button class="btn primary" id="startBtn" disabled>ابدأ التسجيل</button>
    </div>
  </div>
</section>

<!-- ============ شاشة التسجيل ============ -->
<section id="workScreen" class="screen">
  <div class="topstick">
    <div class="workbar">
      <button class="icon-btn" id="backBtn" aria-label="رجوع">→</button>
      <div class="wb-title">
        <b id="wbBranch">—</b>
        <small id="wbSub">—</small>
      </div>
      <button class="icon-btn" id="pickDateBtn" aria-label="تغيير التاريخ">📅</button>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
    <div class="chips" id="sectionChips"></div>
  </div>
  <div class="cards" id="sectionBody"></div>

  <div class="actionbar">
    <div class="problems" id="problems"></div>
    <div class="ab-info" id="abInfo"></div>
    <div class="ab-btns">
      <button class="btn ghost" id="prevBtn">السابق</button>
      <button class="btn primary" id="saveBtn">حفظ القسم</button>
      <button class="btn ghost" id="nextBtn">التالي</button>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<div class="modal" id="confirmModal">
  <div class="sheet">
    <h3>تأكيد الحفظ</h3>
    <p id="confirmText"></p>
    <div class="btns">
      <button class="btn ghost" id="confirmCancel">إلغاء</button>
      <button class="btn primary" id="confirmOk">تأكيد وإرسال</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ⚙️  الإعدادات
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbycG7Fld1-DO3kCcW-GotiiSPkzHpAwNL0lpmdfLpE8_bB_nh-mp8egD0cYcjPIIICI_A/exec";

/* زرارين للحالة فقط */
const STATUSES = [
  { key: 'ok',    label: 'سليم',   tone: 'ok',  needsTemp: true },
  { key: 'fault', label: 'عطلان',  tone: 'bad', needsTemp: true }
];

const ALARM_ABOVE = {
  'تبريد': 8,
  'تجميد': -15
};

/* ============================================================
   الحالة والمتغيرات الداخلية
   ============================================================ */
const $  = (s, r) => (r || document).querySelector(s);
const LS_LAST  = 'fathalla:last';
const LS_USER  = 'fathalla:user';
const LS_COUNT = 'fathalla:counts';
const LS_DRAFT_READINGS = 'fathalla:draft:readings';

const state = {
  branches: [],
  branch: '',
  user: '',
  date: '',
  sections: [],
  readings: {},
  active: 0,
  dirty: new Set(),
  saving: false,
  timer: null,
  force: false,
  loading: false,
  filter: 'all',
  search: ''
};

/* ---------- أدوات ---------- */
function esc(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function normPart(s){
  return String(s === null || s === undefined ? '' : s).replace(/\s+/g, ' ').trim();
}
function arNum(n){
  const d = '٠١٢٣٤٥٦٧٨٩';
  return String(n).replace(/\d/g, function(x){ return d[+x]; });
}
function num(n){
  return '<bdi dir="ltr">' + arNum(n) + '</bdi>';
}
function todayISO(){
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}
function fmtDate(iso){
  const p = String(iso).split('-');
  if (p.length !== 3) return iso;
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  try {
    return new Intl.DateTimeFormat('ar-EG', { weekday:'long', day:'numeric', month:'long' }).format(d);
  } catch (e) { return iso; }
}
function nowClock(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function arabicClock(hhmm){
  if (!hhmm) return '';
  const p = String(hhmm).split(':');
  if (p.length < 2) return hhmm;
  let h = +p[0];
  const suffix = h >= 12 ? 'م' : 'ص';
  h = h % 12; if (h === 0) h = 12;
  return arNum(h) + ':' + arNum(p[1].padStart(2,'0')) + ' ' + suffix;
}
function parseTemp(v){
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  if (!s || s === '-') return null;
  const n = Number(s
    .replace(/[٠-٩]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
    .replace(/[٫,]/g, '.')
    .replace(/[−–—]/g, '-'));
  return isFinite(n) ? n : null;
}
function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on ' + (kind || '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.className = 'toast ' + (kind || ''); }, 3200);
}
function apiReady(){ return API_URL && API_URL.indexOf('http') === 0; }

/* ---------- استخراج التبريد/التجميد والموديل ---------- */
function getFridgeCooling(f){
  if (!f) return '';
  if (f.cooling) return normPart(f.cooling);
  const parts = String(f.type || '').split(/[|·]/);
  return normPart(parts[0]);
}
function getFridgeSubtype(f){
  if (!f) return '';
  if (f.subtype) return normPart(f.subtype);
  const parts = String(f.type || '').split(/[|·]/);
  return parts.length > 1 ? normPart(parts.slice(1).join('|')) : '';
}
function normalizeLoadedStatus(s){
  if (s === 'به عطل') return 'عطلان';
  return s || '';
}

/* ---------- المفتاح الرباعي الفريد للثلاجة ---------- */
function readingKey(code, sectionName, cooling, subtype){
  const sec = normPart(sectionName !== undefined ? sectionName : (activeSection() ? activeSection().name : ''));
  return [
    sec,
    normPart(code).toLowerCase(),
    normPart(cooling),
    normPart(subtype)
  ].join('|||');
}
function fridgeKey(f, sectionName){
  return readingKey(f.code, sectionName, getFridgeCooling(f), getFridgeSubtype(f));
}
function readingOfFridge(f, sectionName){
  const k = fridgeKey(f, sectionName);
  if (!state.readings[k]) state.readings[k] = { temp:'', status:'', note:'', time:'' };
  return state.readings[k];
}
function findFridge(secName, code, cooling, subtype){
  const sec = state.sections.filter(function(s){ return s.name === secName; })[0];
  if (!sec) return null;
  const target = readingKey(code, secName, cooling, subtype);
  for (let i = 0; i < sec.fridges.length; i++) {
    if (fridgeKey(sec.fridges[i], secName) === target) return sec.fridges[i];
  }
  return null;
}
function cardRkey(card){
  return readingKey(card.dataset.code, card.dataset.section, card.dataset.cooling, card.dataset.subtype);
}
function findCardByRkey(rkey){
  const cards = document.querySelectorAll('#sectionBody .card');
  for (let i = 0; i < cards.length; i++) {
    if (cardRkey(cards[i]) === rkey) return cards[i];
  }
  return null;
}

/* ---------- الشبكة ---------- */
function fetchJSON(url, opts, timeoutMs){
  const ctrl = new AbortController();
  const timer = setTimeout(function(){ ctrl.abort(); }, timeoutMs || 25000);
  const o = Object.assign({}, opts || {}, { signal: ctrl.signal, cache: 'no-store' });
  return fetch(url, o).then(function(res){
    clearTimeout(timer);
    return res.text().then(function(txt){
      let data;
      try { data = JSON.parse(txt); }
      catch (e) { throw new Error('استجابة غير متوقعة من الخادم'); }
      if (!data || data.status !== 'success') {
        throw new Error((data && data.message) ? data.message : 'فشل الطلب');
      }
      return data;
    });
  }, function(err){
    clearTimeout(timer);
    if (err && err.name === 'AbortError') throw new Error('الاتصال بطيء — أعد المحاولة');
    throw new Error('تعذّر الاتصال بالخادم');
  });
}
function apiGet(params){
  if (!apiReady()) return Promise.reject(new Error('رابط الخادم غير مُعدّ'));
  const qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  return fetchJSON(API_URL + '?t=' + Date.now() + '&' + qs, { method:'GET' });
}
function apiPost(payload){
  if (!apiReady()) return Promise.reject(new Error('رابط الخادم غير مُعدّ'));
  return fetchJSON(API_URL, { method:'POST', body: JSON.stringify(payload), redirect:'follow' });
}

/* ---------- مسودة القراءات ---------- */
function saveDraftReadings(){
  if (!state.branch || !state.date) return;
  try {
    const out = {};
    state.dirty.forEach(function(k){
      if (state.readings[k]) out[k] = state.readings[k];
    });
    if (!Object.keys(out).length) { clearDraftReadings(); return; }
    localStorage.setItem(LS_DRAFT_READINGS, JSON.stringify({
      branch: state.branch, date: state.date, readings: out, ts: Date.now()
    }));
  } catch (e) {}
}
function loadDraftReadings(branch, date){
  try {
    const d = JSON.parse(localStorage.getItem(LS_DRAFT_READINGS) || 'null');
    if (d && d.branch === branch && d.date === date) return d;
  } catch (e) {}
  return null;
}
function clearDraftReadings(){
  try { localStorage.removeItem(LS_DRAFT_READINGS); } catch (e) {}
}

/* ---------- شاشات ---------- */
function showScreen(name){
  $('#startScreen').classList.toggle('on', name === 'start');
  $('#workScreen').classList.toggle('on', name === 'work');
  window.scrollTo(0, 0);
}

/* ---------- اختيار الفرع والاسم ---------- */
function renderBranchOptions(){
  const sel = $('#branchSelect');
  const prev = sel.value;

  if (!state.branches.length) {
    sel.innerHTML = '<option value="">لا توجد فروع مسجّلة</option>';
    $('#branchInfo').innerHTML = 'لا يوجد فرع مسجّل حتى الآن.';
    updateStartState();
    return;
  }

  sel.innerHTML = '<option value="">— اختر الفرع —</option>' +
    state.branches.map(function(b){
      return '<option value="' + esc(b.branch) + '">' + esc(b.branch) + '</option>';
    }).join('');

  if (prev) sel.value = prev;
  if (!sel.value && state.branches.length === 1) sel.value = state.branches[0].branch;

  updateBranchInfo();
  updateStartState();
}

function updateBranchInfo(){
  const val = $('#branchSelect').value;
  const b = state.branches.filter(function(x){ return x.branch === val; })[0];
  const info = $('#branchInfo');
  if (!b) { info.textContent = ''; return; }
  info.innerHTML = arNum(b.fridges) + ' ثلاجة في ' + arNum(b.sections) + ' أقسام · ' +
    arNum(b.saved) + ' سُجّلت اليوم';
}

function updateStartState(){
  const name = ($('#userName').value || '').trim();
  const ok = !!$('#branchSelect').value && name.length >= 3;
  $('#startBtn').disabled = !ok;
}

function startRecording(){
  const branch = $('#branchSelect').value;
  const name = ($('#userName').value || '').trim();
  if (!branch) { toast('اختر الفرع أولًا', 'warn'); return; }
  if (name.length < 3) { toast('أدخل اسمك (٣ أحرف على الأقل)', 'warn'); $('#userName').focus(); return; }

  state.user = name;
  localStorage.setItem(LS_USER, name);

  const date = $('#dateInput').value || todayISO();
  const b = state.branches.filter(function(x){ return x.branch === branch; })[0];
  if (b && b.saved > 0 && date === todayISO()) {
    const pct = Math.round(b.saved / b.fridges * 100);
    const info = document.createElement('div');
    info.className = 'banner';
    info.style.marginTop = '10px';
    info.innerHTML = '⚠ هذا الفرع سُجّل جزئياً اليوم بالفعل (<b>' + arNum(b.saved) + '</b> من <b>' + arNum(b.fridges) + '</b> ثلاجة — ' +
      arNum(pct) + '%). ' +
      '<button id="continueAnyway" style="margin-top:6px;border:none;background:var(--brand);color:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer">متابعة واستكمال</button>';
    const existing = document.querySelector('.pick .banner');
    if (existing) existing.remove();
    $('#startBtn').parentNode.insertBefore(info, $('#startBtn'));
    document.getElementById('continueAnyway').onclick = function(){
      info.remove();
      openDay(branch, date);
    };
    return;
  }

  openDay(branch, date);
}

function loadBranches(){
  if (!apiReady()) {
    $('#apiBanner').innerHTML = '<div class="banner">يجب إدخال رابط النشر في أعلى الكود (المتغير API_URL) لتشغيل الصفحة.</div>';
    return Promise.resolve();
  }
  const sel = $('#branchSelect');
  if (!state.branches.length) sel.innerHTML = '<option value="">جارٍ التحميل…</option>';

  return apiGet({ action:'getBranches', date:$('#dateInput').value || todayISO() })
    .then(function(d){
      state.branches = d.branches || [];
      renderBranchOptions();
    })
    .catch(function(e){
      sel.innerHTML = '<option value="">تعذّر التحميل</option>';
      $('#branchInfo').innerHTML =
        '<span style="color:var(--bad);font-weight:700">خطأ: ' + esc(e.message) + '</span><br>' +
        '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">' +
          '<button class="btn primary" style="min-height:40px;flex:1" onclick="loadBranches()">إعادة المحاولة</button>' +
          '<button class="btn ghost" style="min-height:40px;flex:1" onclick="clearCacheAndReload()">مسح الكاش</button>' +
        '</div>';
    });
}

function clearCacheAndReload(){
  try {
    localStorage.removeItem(LS_LAST);
    localStorage.removeItem(LS_USER);
    localStorage.removeItem(LS_DRAFT_READINGS);
  } catch(e) {}
  location.reload();
}

/* ---------- فتح يوم ---------- */
function openDay(branch, date){
  state.branch = branch;
  state.date = date;
  state.dirty.clear();
  state.force = false;
  state.filter = 'all';
  state.search = '';
  localStorage.setItem(LS_LAST, JSON.stringify({ branch:branch, date:date, user:state.user, ts:Date.now() }));

  showScreen('work');
  $('#wbBranch').textContent = branch;
  $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(date) + ' · جارٍ التحميل…';
  $('#sectionChips').innerHTML = '';
  $('#sectionBody').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  setActionInfo('…');
  hideProblems();

  return apiGet({ action:'getDay', branch:branch, date:date })
    .then(function(d){
      state.sections = d.sections || [];
      state.readings = {};

      const rawList = Array.isArray(d.readings) ? d.readings : [];
      rawList.forEach(function(item){
        if (!item || !item.code || !item.status) return;
        const secName = normPart(item.section);
        let cooling = getFridgeCooling(item);
        let subtype = getFridgeSubtype(item);

        if (!cooling && !subtype) {
          const secObj = state.sections.filter(function(s){ return s.name === secName; })[0];
          const matches = secObj
            ? secObj.fridges.filter(function(f){ return normPart(f.code).toLowerCase() === normPart(item.code).toLowerCase(); })
            : [];
          if (matches.length === 1) {
            cooling = getFridgeCooling(matches[0]);
            subtype = getFridgeSubtype(matches[0]);
          }
        }

        const k = readingKey(item.code, secName, cooling, subtype);
        state.readings[k] = {
          temp: (item.temp === null || item.temp === '' || item.temp === undefined) ? '' : String(item.temp),
          status: normalizeLoadedStatus(item.status),
          note: item.note || '',
          time: item.time || ''
        };
      });

      if (!state.sections.length) return renderNoFridges();

      const draft = loadDraftReadings(branch, date);
      if (draft && draft.readings) {
        let restored = 0;
        Object.keys(draft.readings).forEach(function(k){
          if (k.split('|||').length !== 4) return;
          if (!state.readings[k] || !state.readings[k].status) {
            state.readings[k] = draft.readings[k];
            state.dirty.add(k);
            restored++;
          }
        });
        if (restored > 0) {
          const banner = document.createElement('div');
          banner.className = 'banner';
          banner.innerHTML = 'تم استرجاع <b>' + arNum(restored) + '</b> قراءة غير محفوظة من الجلسة السابقة. ' +
            '<button style="border:none;background:var(--warn);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer" id="discardDraftBtn">تجاهل</button>';
          $('#sectionBody').parentNode.insertBefore(banner, $('#sectionBody'));
          document.getElementById('discardDraftBtn').onclick = function(){
            state.dirty.clear();
            clearDraftReadings();
            banner.remove();
            openDay(branch, date);
          };
        }
      }

      state.active = firstIncomplete();
      renderChips();
      renderSection();
      refreshHeader();
    })
    .catch(function(e){
      $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(date);
      $('#sectionBody').innerHTML =
        '<div class="empty">تعذّر تحميل بيانات الفرع<br><small>' + esc(e.message) + '</small><br><br>' +
        '<button class="btn primary" style="max-width:220px;margin:auto" id="retryDay">إعادة المحاولة</button></div>';
      const b = $('#retryDay');
      if (b) b.onclick = function(){ openDay(branch, date); };
    });
}

function renderNoFridges(){
  $('#sectionChips').innerHTML = '';
  $('#progressBar').style.width = '0%';
  $('#sectionBody').innerHTML = '<div class="empty">لا توجد ثلاجات مسجّلة لهذا الفرع.</div>';
  $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(state.date);
  setActionInfo('لا توجد ثلاجات');
  $('#saveBtn').disabled = true;
  $('#nextBtn').disabled = true;
  $('#prevBtn').disabled = true;
}

/* ---------- الحالة والإحصائيات ---------- */
function statusByLabel(label){
  for (let i = 0; i < STATUSES.length; i++) if (STATUSES[i].label === label) return STATUSES[i];
  return label ? { key:'other', label:label, tone:'info', needsTemp:true } : null;
}
function isFridgeSaved(f, sectionName){
  const r = state.readings[fridgeKey(f, sectionName)];
  return !!(r && r.status);
}
function sectionStats(sec){
  let total = sec.fridges.length, saved = 0;
  sec.fridges.forEach(function(f){ if (isFridgeSaved(f, sec.name)) saved++; });
  return { total: total, saved: saved };
}
function totalStats(){
  let total = 0, saved = 0;
  state.sections.forEach(function(s){
    const st = sectionStats(s);
    total += st.total; saved += st.saved;
  });
  return { total: total, saved: saved };
}
function firstIncomplete(){
  for (let i = 0; i < state.sections.length; i++) {
    const st = sectionStats(state.sections[i]);
    if (st.saved < st.total) return i;
  }
  return 0;
}
function activeSection(){
  return state.sections[state.active] || null;
}
function hasDirtyIn(sec){
  return sec.fridges.some(function(f){ return state.dirty.has(fridgeKey(f, sec.name)); });
}

/* ---------- الرسم ---------- */
function refreshHeader(){
  const t = totalStats();
  const pct = t.total ? Math.round(t.saved / t.total * 100) : 0;
  const sec = activeSection();
  const st = sec ? sectionStats(sec) : { total:0, saved:0 };
  let alarms = 0;
  state.sections.forEach(function(s){ alarms += sectionAlarms(s); });

  $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(state.date) + ' · ' +
    arNum(t.saved) + ' من ' + arNum(t.total) + ' ثلاجة' +
    (alarms ? ' · ⚠ ' + arNum(alarms) + ' فوق الحد' : '');
  $('#progressBar').style.width = pct + '%';
  setActionInfo(sec
    ? 'القسم «' + sec.name + '» — ' + arNum(st.saved) + ' من ' + arNum(st.total) + ' مسجّلة'
    : '');
  $('#saveBtn').disabled = !sec;
  $('#nextBtn').disabled = !sec;
  $('#prevBtn').disabled = !sec || state.active === 0;
  document.title = arNum(t.saved) + '/' + arNum(t.total) + ' · ' + state.branch;
}

function refreshToolbarCounts(){
  const sec = activeSection();
  if (!sec) return;
  const st = sectionStats(sec);
  const al = sectionAlarms(sec);
  const rem = st.total - st.saved;

  const titleSpan = document.querySelector('#sectionBody .sec-title span');
  if (titleSpan) {
    titleSpan.innerHTML = arNum(st.saved) + ' من ' + arNum(st.total) + ' مسجّلة' +
      (al ? ' · <b style="color:var(--bad)">' + arNum(al) + ' فوق الحد</b>' : '');
  }
  const fAll = document.querySelector('#sectionBody .flt-btn[data-flt="all"]');
  const fRem = document.querySelector('#sectionBody .flt-btn[data-flt="rem"]');
  const fAl  = document.querySelector('#sectionBody .flt-btn[data-flt="alarm"]');
  if (fAll) fAll.textContent = 'الكل (' + arNum(st.total) + ')';
  if (fRem) fRem.textContent = 'المتبقية (' + arNum(rem) + ')';
  if (fAl) {
    fAl.textContent = 'فوق الحد (' + arNum(al) + ')';
    fAl.style.display = al > 0 ? '' : 'none';
  }
}

function renderChips(){
  const box = $('#sectionChips');
  box.innerHTML = state.sections.map(function(s, i){
    const st = sectionStats(s);
    const done = st.total > 0 && st.saved >= st.total;
    const alarms = sectionAlarms(s);
    return '<button class="chip ' + (i === state.active ? 'on' : '') + (done ? ' done' : '') + '" data-i="' + i + '">' +
      '<span class="dot"></span>' + esc(s.name) +
      ' <b>' + arNum(st.saved) + '/' + arNum(st.total) + '</b>' +
      (done ? ' ✓' : (alarms ? ' ⚠' : '')) +
      '</button>';
  }).join('');
  const on = box.querySelector('.chip.on');
  if (on && on.scrollIntoView) on.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
}

function applyCardVisibility(){
  const sec = activeSection();
  if (!sec) return;
  const q = state.search.trim().toLowerCase();
  let visibleCount = 0;

  document.querySelectorAll('#cardsList .card').forEach(function(card){
    const rkey = cardRkey(card);
    const r = state.readings[rkey];
    const saved = !!(r && r.status);
    const isAlarm = card.classList.contains('alarm');

    let matchFlt = true;
    if (state.filter === 'rem') matchFlt = !saved;
    else if (state.filter === 'alarm') matchFlt = isAlarm;

    let matchSearch = true;
    if (q) {
      const hay = (card.dataset.code + ' ' + card.dataset.cooling + ' ' + card.dataset.subtype).toLowerCase();
      matchSearch = hay.indexOf(q) > -1;
    }

    const show = matchFlt && matchSearch;
    card.hidden = !show;
    if (show) visibleCount++;
  });

  const emptyEl = $('#filterEmpty');
  if (emptyEl) emptyEl.style.display = visibleCount === 0 ? 'block' : 'none';
}

function renderSection(){
  const sec = activeSection();
  const body = $('#sectionBody');

    (al0 ? ' · <b style="color:var(--bad)">' + arNum(al0) + ' فوق الحد</b>' : '') +

    '<div class="filter-row">' +
      '<button type="button" class="flt-btn' + (state.filter === 'all' ? ' on' : '') + '" data-flt="all">الكل (' + arNum(st0.total) + ')</button>' +

      : '') +

      '<details class="note"' + (r.note ? ' open' : '') + '>' +
        '<summary>ملاحظة (اختياري)</summary>' +
        '<input class="note-input" maxlength="120" value="' + esc(r.note) + '" placeholder="اكتب ملاحظة إذا وجدت…">' +
      '</details>' +
    '</div>';
  }).join('');

  body.innerHTML = head + toolbar +
    '<div id="cardsList">' + cardsHtml + '</div>' +
    '<div id="filterEmpty" class="empty" style="display:none">لا توجد ثلاجات مطابقة للبحث أو الفلتر الحالي.</div>';

  body.querySelectorAll('.card').forEach(function(card){ updateHint(card); });
  applyCardVisibility();
  refreshHeader();
}

function updateHint(card){
  const code = card.dataset.code;
  const sec = card.dataset.section;
  const cooling = card.dataset.cooling;
  const subtype = card.dataset.subtype;
  const rkey = cardRkey(card);
  const f = findFridge(sec, code, cooling, subtype);
  const r = state.readings[rkey] || { temp:'', status:'', note:'', time:'' };
  const hint = card.querySelector('.hint');
  if (!hint) return;

  const val = parseTemp(r.temp);
  const limit = ALARM_ABOVE[f ? getFridgeCooling(f) : cooling];
  const over = (limit !== undefined && val !== null && val > limit);

  card.classList.toggle('alarm', over);
  card.classList.toggle('is-done', !!r.status && !over);
  const badge = card.querySelector('.alarm-badge');
  if (badge) badge.hidden = !over;

  hint.classList.remove('over');
  if (!String(r.temp).trim()) {
    hint.textContent = (statusByLabel(r.status) && !statusByLabel(r.status).needsTemp)
      ? 'لا تتطلب درجة' : 'استخدم − للسالب';
  } else if (val === null) {
    hint.textContent = 'رقم غير صحيح';
    hint.classList.add('over');
  } else if (over) {
    hint.innerHTML = '⚠ الحد ' + num(limit) + '°';
    hint.classList.add('over');
  } else {
    hint.textContent = '✓ ضمن الحد';
  }
}

function sectionAlarms(sec){
  let n = 0;
  sec.fridges.forEach(function(f){
    const r = state.readings[fridgeKey(f, sec.name)];
    if (!r) return;
    const v = parseTemp(r.temp);
    const lim = ALARM_ABOVE[getFridgeCooling(f)];
    if (lim !== undefined && v !== null && v > lim) n++;
  });
  return n;
}

function alarmsIn(rows){
  return rows.filter(function(r){
    const lim = ALARM_ABOVE[r.cooling || getFridgeCooling(r)];
    return lim !== undefined && r.temp !== null && r.temp !== undefined && r.temp > lim;
  });
}

function openConfirm(over){
  $('#confirmText').innerHTML =
    'يوجد ' + arNum(over.length) + ' قراءة متجاوزة للحد: ' +
    over.map(function(r){ return '«' + esc(r.code) + (r.subtype ? ' · ' + esc(r.subtype) : '') + '» ' + num(r.temp); }).join('، ') +
    '<br>يمكن المتابعة وحفظها كما هي.';
  $('#confirmModal').classList.add('on');
}

function paintCardState(rkey){
  const card = findCardByRkey(rkey);
  if (!card) return;
  const el = card.querySelector('.state');
  const r = state.readings[rkey];
  if (!r || !r.status) { el.className = 'state none'; el.textContent = 'لم تُسجَّل'; return; }
  if (state.dirty.has(rkey)) { el.className = 'state dirty'; el.textContent = 'معدّلة'; }
  else { el.className = 'state saved'; el.textContent = 'محفوظة ' + arabicClock(r.time); }
}

function setActionInfo(txt){ $('#abInfo').textContent = txt || ''; }

/* ---------- تعديل القيم ---------- */
function onInput(e){
  const input = e.target;
  if (input.id === 'secSearch') {
    state.search = input.value;
    applyCardVisibility();
    return;
  }

  const card = input.closest('.card');
  if (!card) return;
  const rkey = cardRkey(card);
  const r = state.readings[rkey] || (state.readings[rkey] = { temp:'', status:'', note:'', time:'' });

  if (input.classList.contains('temp')) {
    r.temp = input.value;
    if (!r.status && parseTemp(r.temp) !== null) {
      r.status = STATUSES[0].label;
      card.querySelectorAll('.seg-btn').forEach(function(b){
        b.classList.toggle('on', b.dataset.label === r.status);
      });
    }
    state.dirty.add(rkey);
    paintCardState(rkey);
    updateHint(card);
    saveDraftReadings();
    refreshToolbarCounts();
    refreshHeader();
    scheduleAutosave();
  } else if (input.classList.contains('note-input')) {
    r.note = input.value;
    state.dirty.add(rkey);
    paintCardState(rkey);
    saveDraftReadings();
    scheduleAutosave();
  }
}

function onClick(e){
  const flt = e.target.closest('.flt-btn');
  if (flt) {
    state.filter = flt.dataset.flt || 'all';
    document.querySelectorAll('#sectionBody .flt-btn').forEach(function(b){
      b.classList.toggle('on', b === flt);
    });
    applyCardVisibility();
    return;
  }

  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const card = btn.closest('.card');
  if (!card) return;
  const rkey = cardRkey(card);
  const r = state.readings[rkey] || (state.readings[rkey] = { temp:'', status:'', note:'', time:'' });

  if (btn.dataset.act === 'status') {
    const label = btn.dataset.label;
    if (!label) return;
    r.status = label;
    state.dirty.add(rkey);
    card.querySelectorAll('.seg-btn').forEach(function(b){
      b.classList.toggle('on', b.dataset.label === label);
    });
    paintCardState(rkey);
    updateHint(card);
    saveDraftReadings();
    refreshToolbarCounts();
    refreshHeader();
    const needs = statusByLabel(label) && statusByLabel(label).needsTemp;
    const input = card.querySelector('.temp');
    if (needs && !String(r.temp).trim()) input.focus();
    scheduleAutosave();
  }

  if (btn.dataset.act === 'sign') {
    const input = card.querySelector('.temp');
    const v = input.value.trim();
    input.value = !v ? '-' : (v.charAt(0) === '-' ? v.slice(1) : '-' + v);
    r.temp = input.value;
    state.dirty.add(rkey);
    paintCardState(rkey);
    updateHint(card);
    saveDraftReadings();
    refreshToolbarCounts();
    scheduleAutosave();
  }
}

/* ---------- تجميع وحفظ القسم ---------- */
function collectSection(sec){
  const rows = [];
  const problems = [];
  sec.fridges.forEach(function(f){
    const r = readingOfFridge(f, sec.name);
    const st = statusByLabel(r.status);
    const cooling = getFridgeCooling(f);
    const subtype = getFridgeSubtype(f);
    const fullType = subtype ? (cooling + '|' + subtype) : cooling;
    const labelName = f.code + (subtype ? ' (' + subtype + ')' : '');
    const tempStr = String(r.temp === null || r.temp === undefined ? '' : r.temp).trim();

    if (!r.status) { problems.push(labelName + ': لم تختر الحالة بعد'); return; }
    if (st && st.needsTemp && !tempStr) { problems.push(labelName + ': لم تكتب درجة الحرارة'); return; }
    if (tempStr) {
      const n = parseTemp(tempStr);
      if (n === null) { problems.push(labelName + ': الرقم المكتوب غير صحيح'); return; }
      rows.push({
        section: sec.name, code: f.code, cooling: cooling, subtype: subtype, type: fullType,
        status: r.status, temp: n, note: r.note || ''
      });
    } else {
      rows.push({
        section: sec.name, code: f.code, cooling: cooling, subtype: subtype, type: fullType,
        status: r.status, temp: null, note: r.note || ''
      });
    }
  });
  return { rows: rows, problems: problems };
}

function scheduleAutosave(){
  clearTimeout(state.timer);
  state.timer = setTimeout(function(){
    const sec = activeSection();
    if (!sec || state.saving || !hasDirtyIn(sec)) return;
    const c = collectSection(sec);
    if (!c.rows.length) return;
    saveSection({ silent:true, force:true });
  }, 1500);
}

function saveSection(opts){
  opts = opts || {};
  const sec = activeSection();
  if (!sec || state.saving) return Promise.resolve();

  const c = collectSection(sec);
  if (!opts.force && c.problems.length) {
    showProblems(c.problems, sec, c.rows.length);
    return Promise.resolve();
  }
  if (!c.rows.length) {
    if (!opts.silent) toast('أدخل قراءة واحدة على الأقل قبل الحفظ', 'warn');
    return Promise.resolve();
  }

  const over = alarmsIn(c.rows);
  if (!opts.silent && !opts.confirmed && over.length) {
    openConfirm(over);
    return Promise.resolve();
  }

  hideProblems();
  state.force = false;
  state.saving = true;
  $('#saveBtn').textContent = 'جارٍ الحفظ…';

  const payload = {
    action:'saveSection', branch:state.branch, date:state.date, by:state.user,
    section:sec.name, readings:c.rows
  };

  return apiPost(payload)
    .then(function(res){ applySaved(sec, c.rows, res.time); return res; })
    .catch(function(err){
      return verifySaved(sec, c.rows).then(function(ok){
        if (!ok) throw err;
        applySaved(sec, c.rows, nowClock());
        return { saved:c.rows.length, time:nowClock() };
      });
    })
    .then(function(){
      if (!opts.silent) toast('تم حفظ «' + sec.name + '» ✓', 'ok');
    })
    .catch(function(err){
      if (!opts.silent) {
        toast('تعذّر الحفظ: ' + err.message + ' — أعد المحاولة', 'bad');
        const card = document.querySelector('#sectionBody .card');
        if (card) card.scrollIntoView({ behavior:'smooth', block:'center' });
      }
    })
    .then(function(){
      state.saving = false;
      $('#saveBtn').textContent = 'حفظ القسم';
      refreshHeader();
    });
}

function verifySaved(sec, rows){
  return apiGet({ action:'getDay', branch:state.branch, date:state.date })
    .then(function(d){
      const list = Array.isArray(d.readings) ? d.readings : [];
      const byKey = {};
      list.forEach(function(item){
        if (!item) return;
        const k = readingKey(item.code, item.section || sec.name, getFridgeCooling(item), getFridgeSubtype(item));
        byKey[k] = item;
      });
      return rows.every(function(r){
        const k = readingKey(r.code, r.section || sec.name, r.cooling, r.subtype);
        const s = byKey[k];
        if (!s) return false;
        if (normalizeLoadedStatus(s.status) !== r.status) return false;
        const a = parseTemp(s.temp);
        return r.temp === null ? a === null : a === r.temp;
      });
    })
    .catch(function(){ return false; });
}

function applySaved(sec, rows, time){
  rows.forEach(function(r){
    const k = readingKey(r.code, sec.name, r.cooling, r.subtype);
    const cur = state.readings[k] || (state.readings[k] = { temp:'', status:'', note:'', time:'' });
    cur.temp = r.temp === null ? '' : String(r.temp);
    cur.status = r.status;
    cur.note = r.note;
    cur.time = time || nowClock();
    state.dirty.delete(k);
  });
  saveDraftReadings();
  renderChips();
  refreshHeader();
  refreshToolbarCounts();
  document.querySelectorAll('#sectionBody .card').forEach(function(card){
    paintCardState(cardRkey(card));
  });
  if (state.filter === 'rem') applyCardVisibility();
}

function showProblems(problems, sec, readyCount){
  const box = $('#problems');
  const msgs = problems.slice(0, 6);
  const extra = problems.length > 6 ? ' وغيرها' : '';
  box.innerHTML = '<b>' + arNum(problems.length) + ' ثلاجة ناقصة في هذا القسم</b><ul>' +
    msgs.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') +
    (extra ? '<li>' + extra + '</li>' : '') +
    '</ul>' +
    (readyCount > 0
      ? '<div style="margin-top:6px;font-weight:700">اضغط حفظ مرة ثانية لحفظ ' + arNum(readyCount) + ' ثلاجة مكتملة فقط.</div>'
      : '');
  box.style.display = 'block';
  $('#saveBtn').textContent = readyCount > 0 ? 'حفظ المكتمل (' + arNum(readyCount) + ')' : 'حفظ القسم';
  state.force = readyCount > 0;
}
function hideProblems(){
  const box = $('#problems');
  box.style.display = 'none';
  box.innerHTML = '';
  if (!state.saving) $('#saveBtn').textContent = 'حفظ القسم';
}

/* ---------- التنقل بين الأقسام ---------- */
function goSection(i){
  if (i < 0 || i >= state.sections.length) return;
  const cur = activeSection();
  const after = function(){
    state.active = i;
    state.filter = 'all';
    state.search = '';
    hideProblems();
    renderChips();
    renderSection();
    window.scrollTo(0, 0);
  };
  if (cur && hasDirtyIn(cur)) {
    const c = collectSection(cur);
    if (c.rows.length) {
      saveSection({ silent:true, force:true }).then(after);
      return;
    }
  }
  after();
}

/* ---------- الأحداث ---------- */
function bind(){
  $('#dateInput').addEventListener('change', function(){
    localStorage.setItem(LS_COUNT, this.value);
    loadBranches();
  });
  $('#refreshBtn').addEventListener('click', function(){ loadBranches(); });

  $('#branchSelect').addEventListener('change', function(){
    updateBranchInfo();
    updateStartState();
  });
  $('#userName').addEventListener('input', updateStartState);
  $('#userName').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !$('#startBtn').disabled) startRecording();
  });
  $('#startBtn').addEventListener('click', startRecording);

  $('#backBtn').addEventListener('click', function(){
    if (state.dirty.size) {
      const sec = activeSection();
      if (sec) saveSection({ silent:true, force:true });
    }
    showScreen('start');
    loadBranches();
  });

  $('#pickDateBtn').addEventListener('click', function(){
    const el = document.createElement('input');
    el.type = 'date';
    el.value = state.date;
    el.max = todayISO();
    el.style.position = 'fixed'; el.style.opacity = '0'; el.style.pointerEvents = 'none';
    document.body.appendChild(el);
    el.addEventListener('change', function(){
      if (el.value && el.value !== state.date) openDay(state.branch, el.value);
      setTimeout(function(){ el.remove(); }, 100);
    });
    if (el.showPicker) { try { el.showPicker(); } catch (err) { el.focus(); el.click(); } }
    else { el.focus(); el.click(); }
  });

  $('#sectionChips').addEventListener('click', function(e){
    const chip = e.target.closest('.chip');
    if (chip) goSection(+chip.dataset.i);
  });

  $('#sectionBody').addEventListener('input', onInput);
  $('#sectionBody').addEventListener('click', onClick);
  $('#sectionBody').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target.classList.contains('temp')) {
      e.preventDefault();
      const temps = Array.prototype.slice.call(document.querySelectorAll('#sectionBody .card:not([hidden]) .temp'));
      const idx = temps.indexOf(e.target);
      if (idx > -1 && idx < temps.length - 1) temps[idx + 1].focus();
      else e.target.blur();
    }
  });

  $('#saveBtn').addEventListener('click', function(){
    if (state.force) { saveSection({ force:true }); return; }
    const sec = activeSection();
    if (!sec) return;
    const c = collectSection(sec);
    if (c.problems.length) { showProblems(c.problems, sec, c.rows.length); return; }
    saveSection({ force:true });
  });

  $('#prevBtn').addEventListener('click', function(){
    if (state.active > 0) goSection(state.active - 1);
  });

  $('#confirmCancel').addEventListener('click', function(){
    $('#confirmModal').classList.remove('on');
  });
  $('#confirmOk').addEventListener('click', function(){
    $('#confirmModal').classList.remove('on');
    saveSection({ force:true, confirmed:true });
  });

  $('#nextBtn').addEventListener('click', function(){
    if (state.active < state.sections.length - 1) {
      goSection(state.active + 1);
    } else {
      const t = totalStats();
      toast(t.saved >= t.total
        ? 'تم ✓ تسجيل جميع الثلاجات (' + arNum(t.total) + ') اليوم'
        : 'هذا آخر قسم — تبقّى ' + arNum(t.total - t.saved) + ' ثلاجة', t.saved >= t.total ? 'ok' : 'warn');
    }
  });

  window.addEventListener('beforeunload', function(e){
    if (state.dirty.size) { e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('online', function(){
    if (state.dirty.size) scheduleAutosave();
  });
}

function boot(){
  const today = todayISO();
  const dateEl = $('#dateInput');
  dateEl.value = today;
  dateEl.max = today;

  const savedUser = localStorage.getItem(LS_USER) || '';
  $('#userName').value = savedUser;

  bind();

  let last = null;
  try { last = JSON.parse(localStorage.getItem(LS_LAST) || 'null'); } catch (e) {}

  loadBranches().then(function(){
    const hasLast = last && last.branch && state.branches.some(function(b){ return b.branch === last.branch; });
    if (hasLast) {
      $('#branchSelect').value = last.branch;
      updateBranchInfo();
      updateStartState();
    }
    if (hasLast && last.date === today && last.user) {
      state.user = last.user;
      $('#userName').value = last.user;
      openDay(last.branch, today);
    }
  });
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
