<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c66">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>تسجيل درجات الحرارة — فتح الله ماركت</title>
<style>
  :root{
    color-scheme: light;
    --bg:#eef2f1; --card:#fff; --ink:#10201c; --muted:#6a7d77;
    --line:#dde5e2; --brand:#0e7c66; --brand-dark:#0a5f4e; --brand-soft:#e3f3ee;
    --ok:#128a5f; --ok-soft:#e2f5ec; --warn:#a86f00; --warn-soft:#fdf3dd;
    --bad:#b83a2c; --bad-soft:#fdecea;
    --shadow:0 1px 2px rgba(16,32,28,.06), 0 10px 28px rgba(16,32,28,.07);
    --r:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#0d1412; --card:#16211e; --ink:#eaf2ef; --muted:#8fa7a0;
      --line:#243430; --brand:#20a98b; --brand-dark:#17866d; --brand-soft:#12312a;
      --ok:#2ecf95; --ok-soft:#12352a; --warn:#e0a326; --warn-soft:#33280e;
      --bad:#ef6a58; --bad-soft:#361714;
      --shadow:0 1px 0 rgba(255,255,255,.03);
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;
    font-family:'Segoe UI', Tahoma, 'Noto Kufi Arabic', Arial, sans-serif;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button, input, select{ font-family:inherit; font-size:16px; color:inherit; }
  button{ cursor:pointer; }
  .screen{ display:none; }
  .screen.on{ display:block; }

  .hero{
    background:linear-gradient(160deg, var(--brand), var(--brand-dark));
    color:#fff; padding:22px 18px 18px; border-radius:0 0 26px 26px;
  }
  .hero h1{ margin:0; font-size:18px; font-weight:700; }
  .hero p{ margin:2px 0 0; font-size:13px; opacity:.85; }

  .datebar{ margin-top:16px; display:flex; gap:8px; align-items:center; }
  .datebar input[type="date"]{
    flex:1; min-height:46px; border:none; border-radius:12px; padding:0 12px;
    background:rgba(255,255,255,.14); color:#fff; font-size:15px; font-weight:600;
  }
  .datebar input[type="date"]::-webkit-calendar-picker-indicator{ filter:invert(1); opacity:.85; }
  .icon-btn{
    width:46px; height:46px; flex:0 0 auto; border:none; border-radius:12px;
    background:rgba(255,255,255,.14); color:#fff; font-size:18px; display:flex;
    align-items:center; justify-content:center;
  }
  .icon-btn:active{ transform:scale(.96); }

  .pad{ padding:16px 14px 28px; max-width:520px; margin:0 auto; }

  .pick{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:16px; box-shadow:var(--shadow);
  }
  .fld{ display:block; margin-bottom:14px; }
  .fld > span{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:600; }
  .fld select, .fld input{
    width:100%; min-height:52px; border:1.5px solid var(--line); border-radius:12px;
    background:var(--bg); padding:0 12px; font-size:16px; outline:none; color:var(--ink);
  }
  .fld select:focus, .fld input:focus{ border-color:var(--brand); background:var(--card); box-shadow:0 0 0 3px var(--brand-soft); }
  .pick-info{ font-size:12.5px; color:var(--muted); min-height:18px; margin:-4px 0 14px; }

  .topstick{ position:sticky; top:0; z-index:30; background:var(--bg); }
  .workbar{
    background:var(--brand); color:#fff;
    display:flex; align-items:center; gap:10px; padding:10px 12px 10px;
    padding-top:calc(10px + env(safe-area-inset-top, 0px));
  }
  .workbar .icon-btn{ width:40px; height:40px; background:rgba(255,255,255,.16); }
  .wb-title{ flex:1; min-width:0; line-height:1.25; text-align:center; }
  .wb-title b{ display:block; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wb-title small{ font-size:12px; opacity:.85; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .progress{ height:4px; background:rgba(255,255,255,.22); }
  .progress i{ display:block; height:100%; width:0; background:#fff; transition:width .25s; }

  .chips{
    display:flex; gap:8px; overflow-x:auto; padding:10px 12px;
    scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; scroll-snap-align:center; border:1px solid var(--line); background:var(--card);
    border-radius:999px; padding:11px 16px; font-size:14px; font-weight:600; color:var(--muted);
    display:flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .chip b{ font-weight:700; color:inherit; }
  .chip .dot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .chip.done .dot{ background:var(--ok); }
  .chip.done{ color:var(--ok); border-color:var(--ok-soft); background:var(--ok-soft); }
  .chip.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .chip.on .dot{ background:#fff; }

  .cards{ padding:4px 10px 200px; max-width:640px; margin:0 auto; }
  .sec-title{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:6px 2px 10px; }
  .sec-title b{ font-size:16px; }
  .sec-title span{ font-size:12px; color:var(--muted); }

  /* كارت الثلاجة */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:9px 10px 8px; margin-bottom:7px; box-shadow:var(--shadow);
  }
  .card.alarm{ border-color:var(--bad); box-shadow:0 0 0 2px var(--bad-soft); }

  /* سطر العنوان */
  .card-header{
    display:flex; align-items:center; gap:6px; margin-bottom:7px; flex-wrap:wrap;
  }
  .code{
    font-weight:700; font-size:14px; background:var(--brand-soft); color:var(--brand-dark);
    border-radius:6px; padding:2px 8px; white-space:nowrap;
  }
  /* مربع النوع (تبريد/تجميد) */
  .type-badge{
    font-size:11px; color:var(--muted); background:var(--bg);
    border:1px solid var(--line); border-radius:5px; padding:2px 7px; white-space:nowrap;
  }
  /* مربع الموديل — نفس شكل type-badge بس بلون أغمق شوية */
  .subtype-badge{
    font-size:11px; color:var(--brand-dark); background:var(--brand-soft);
    border:1px solid var(--brand-soft); border-radius:5px; padding:2px 7px;
    font-weight:600; white-space:nowrap;
  }
  .alarm-badge{
    font-size:10px; background:var(--bad); color:#fff;
    border-radius:999px; padding:2px 7px; font-weight:700; white-space:nowrap;
  }
  .state{
    margin-inline-start:auto; font-size:10px; font-weight:700;
    padding:2px 7px; border-radius:999px; white-space:nowrap;
  }
  .state.saved{ background:var(--ok-soft); color:var(--ok); }
  .state.dirty{ background:var(--warn-soft); color:var(--warn); }
  .state.none{ display:none; }

  .card-body{ display:flex; align-items:center; gap:7px; }

  .seg{ display:flex; gap:5px; flex:1; min-width:0; }
  .seg-btn{
    flex:1; height:40px; border:1.5px solid var(--line); background:var(--card);
    border-radius:9px; font-size:13px; font-weight:700; color:var(--muted);
    padding:0; position:relative; transition:background .1s, border-color .1s, color .1s;
    white-space:nowrap;
  }
  .seg-btn:active{ transform:scale(.97); }
  .seg-btn.ok.on{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .seg-btn.bad.on{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .seg-btn.on::after{ content:"✓"; position:absolute; top:1px; inset-inline-start:4px; font-size:9px; opacity:.85; }

  .temp-wrap{ display:flex; align-items:stretch; gap:4px; flex:0 0 auto; }
  .sign{
    width:36px; flex:0 0 36px; border:1px solid var(--line); background:var(--bg);
    border-radius:8px; font-size:18px; font-weight:700; color:var(--brand-dark); line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .sign:active{ background:var(--brand-soft); }
  .temp{
    width:64px; height:40px; text-align:center; font-size:20px; font-weight:700;
    border:1.5px solid var(--line); border-radius:8px; background:var(--card); outline:none;
    direction:ltr; unicode-bidi:isolate;
  }
  .temp:focus{ border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
  .temp::placeholder{ font-size:11px; font-weight:400; color:var(--muted); }

  .hint{ font-size:11px; margin-top:5px; color:var(--muted); }
  .hint.over{ color:var(--bad); font-weight:700; }

  details.note{ margin-top:7px; }
  details.note summary{
    font-size:12px; color:var(--muted); cursor:pointer; list-style:none; padding:3px 0;
  }
  details.note summary::-webkit-details-marker{ display:none; }
  details.note summary::before{ content:"‹ "; }
  details.note[open] summary::before{ content:"⌄ "; }
  .note input{
    width:100%; margin-top:5px; min-height:38px; border:1px solid var(--line); border-radius:9px;
    padding:0 10px; background:var(--bg); font-size:13px; outline:none;
  }

  .actionbar{
    position:fixed; inset-inline:0; bottom:0; z-index:40; background:var(--card);
    border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    box-shadow:0 -6px 20px rgba(16,32,28,.07);
  }
  .actionbar .problems{ margin:0 0 10px; }
  .ab-info{ font-size:12px; color:var(--muted); text-align:center; margin-bottom:8px; }
  .ab-btns{ display:flex; gap:8px; max-width:640px; margin:0 auto; }
  .btn{
    flex:1; min-height:56px; border:none; border-radius:14px; font-size:16px; font-weight:700;
    padding:0 14px; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn.primary{ background:var(--brand); color:#fff; }
  .btn.primary:disabled{ background:var(--line); color:var(--muted); }
  .btn.ghost{ background:var(--bg); color:var(--ink); border:1px solid var(--line); flex:0 0 27%; font-size:14px; padding:0 6px; }
  .btn.ghost:disabled{ opacity:.45; }
  .btn:active{ transform:scale(.99); }

  .problems{
    display:none; background:var(--bad-soft); border:1px solid var(--bad);
    border-radius:14px; margin:0 12px 10px; padding:12px 14px; font-size:14px; color:var(--bad);
  }
  .problems b{ display:block; margin-bottom:6px; font-size:15px; }
  .problems ul{ margin:4px 0 0; padding-inline-start:18px; line-height:1.9; }

  .toast{
    position:fixed; inset-inline: 12px; bottom:calc(96px + env(safe-area-inset-bottom, 0px));
    max-width:520px; margin-inline:auto; z-index:60; pointer-events:none;
    background:#14231f; color:#fff; border-radius:12px; padding:12px 14px; font-size:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.22); opacity:0; transform:translateY(10px);
    transition:opacity .18s, transform .18s;
  }
  .toast.on{ opacity:1; transform:none; }
  .toast.ok{ background:#0e7c66; }
  .toast.bad{ background:#b83a2c; }
  .toast.warn{ background:#8a5c00; }

  .banner{
    background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn);
    border-radius:12px; padding:10px 12px; font-size:13px; margin-bottom:12px;
  }
  .empty{
    text-align:center; padding:36px 20px; color:var(--muted); font-size:14px;
    background:var(--card); border-radius:var(--r); border:1px dashed var(--line);
  }
  .skel{ height:112px; border-radius:var(--r); background:linear-gradient(90deg,var(--card),var(--bg),var(--card)); background-size:200% 100%; animation:sh 1.2s infinite; margin-bottom:12px; }
  @keyframes sh{ 0%{background-position:0 0} 100%{background-position:-200% 0} }
  .modal{ position:fixed; inset:0; background:rgba(8,20,17,.55); display:none; align-items:flex-end; z-index:80; }
  .modal.on{ display:flex; }
  .sheet{
    background:var(--card); width:100%; max-width:520px; margin:0 auto;
    border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  .sheet h3{ margin:0 0 8px; font-size:16px; }
  .sheet p{ margin:0 0 14px; font-size:13.5px; color:var(--muted); line-height:1.7; }
  .sheet .btns{ display:flex; gap:8px; }
</style>
</head>
<body>

<section id="startScreen" class="screen on">
  <div class="hero">
    <h1>فتح الله ماركت</h1>
    <p>تسجيل درجات حرارة الثلاجات</p>
    <div class="datebar">
      <input type="date" id="dateInput" aria-label="التاريخ">
      <button class="icon-btn" id="refreshBtn" title="تحديث">⟳</button>
    </div>
  </div>
  <div class="pad">
    <div id="apiBanner"></div>
    <div class="pick">
      <label class="fld">
        <span>الفرع</span>
        <select id="branchSelect"><option value="">— اختر الفرع —</option></select>
      </label>
      <label class="fld">
        <span>اسمك</span>
        <input id="userName" type="text" placeholder="الاسم" maxlength="40" autocomplete="off">
      </label>
      <div class="pick-info" id="branchInfo"></div>
      <button class="btn primary" id="startBtn" disabled>ابدأ التسجيل</button>
    </div>
  </div>
</section>

<section id="workScreen" class="screen">
  <div class="topstick">
    <div class="workbar">
      <button class="icon-btn" id="backBtn" aria-label="رجوع">→</button>
      <div class="wb-title">
        <b id="wbBranch">—</b>
        <small id="wbSub">—</small>
      </div>
      <button class="icon-btn" id="pickDateBtn" aria-label="تغيير التاريخ">📅</button>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
    <div class="chips" id="sectionChips"></div>
  </div>
  <div class="cards" id="sectionBody"></div>
  <div class="actionbar">
    <div class="problems" id="problems"></div>
    <div class="ab-info" id="abInfo"></div>
    <div class="ab-btns">
      <button class="btn ghost" id="prevBtn">السابق</button>
      <button class="btn primary" id="saveBtn">حفظ القسم</button>
      <button class="btn ghost" id="nextBtn">التالي</button>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<div class="modal" id="confirmModal">
  <div class="sheet">
    <h3>تأكيد الحفظ</h3>
    <p id="confirmText"></p>
    <div class="btns">
      <button class="btn ghost" id="confirmCancel">إلغاء</button>
      <button class="btn primary" id="confirmOk">تأكيد وإرسال</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbycG7Fld1-DO3kCcW-GotiiSPkzHpAwNL0lpmdfLpE8_bB_nh-mp8egD0cYcjPIIICI_A/exec";

const STATUSES = [
  { key: 'ok',    label: 'سليم',   tone: 'ok',  needsTemp: true },
  { key: 'fault', label: 'به عطل', tone: 'bad', needsTemp: true }
];

const ALARM_ABOVE = {
  'تبريد': 8,
  'تجميد': -15
};

const $  = (s, r) => (r || document).querySelector(s);
const LS_LAST  = 'fathalla:last';
const LS_USER  = 'fathalla:user';
const LS_DRAFT_READINGS = 'fathalla:draft:readings';

const state = {
  branches: [], branch: '', user: '', date: '',
  sections: [], readings: {}, active: 0,
  dirty: new Set(), saving: false, timer: null, force: false
};

function esc(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function arNum(n){
  const d = '٠١٢٣٤٥٦٧٨٩';
  return String(n).replace(/\d/g, function(x){ return d[+x]; });
}
function num(n){ return '<bdi dir="ltr">' + arNum(n) + '</bdi>'; }
function todayISO(){
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}
function fmtDate(iso){
  const p = String(iso).split('-');
  if (p.length !== 3) return iso;
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  try { return new Intl.DateTimeFormat('ar-EG', { weekday:'long', day:'numeric', month:'long' }).format(d); }
  catch (e) { return iso; }
}
function nowClock(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function arabicClock(hhmm){
  if (!hhmm) return '';
  const p = String(hhmm).split(':');
  if (p.length < 2) return hhmm;
  let h = +p[0];
  const suffix = h >= 12 ? 'م' : 'ص';
  h = h % 12; if (h === 0) h = 12;
  return arNum(h) + ':' + arNum(p[1].padStart(2,'0')) + ' ' + suffix;
}
function parseTemp(v){
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  if (!s || s === '-') return null;
  const n = Number(s
    .replace(/[٠-٩]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
    .replace(/[٫,]/g, '.')
    .replace(/[−–—]/g, '-'));
  return isFinite(n) ? n : null;
}
function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on ' + (kind || '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.className = 'toast ' + (kind || ''); }, 3200);
}
function apiReady(){ return API_URL && API_URL.indexOf('http') === 0; }

function fetchJSON(url, opts, timeoutMs){
  const ctrl = new AbortController();
  const timer = setTimeout(function(){ ctrl.abort(); }, timeoutMs || 25000);
  const o = Object.assign({}, opts || {}, { signal: ctrl.signal, cache: 'no-store' });
  return fetch(url, o).then(function(res){
    clearTimeout(timer);
    return res.text().then(function(txt){
      let data;
      try { data = JSON.parse(txt); }
      catch (e) { throw new Error('استجابة غير متوقعة من الخادم'); }
      if (!data || data.status !== 'success')
        throw new Error((data && data.message) ? data.message : 'فشل الطلب');
      return data;
    });
  }, function(err){
    clearTimeout(timer);
    if (err && err.name === 'AbortError') throw new Error('الاتصال بطيء — أعد المحاولة');
    throw new Error('تعذّر الاتصال بالخادم');
  });
}
function apiGet(params){
  if (!apiReady()) return Promise.reject(new Error('رابط الخادم غير مُعدّ'));
  const qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  return fetchJSON(API_URL + '?t=' + Date.now() + '&' + qs, { method:'GET' });
}
function apiPost(payload){
  if (!apiReady()) return Promise.reject(new Error('رابط الخادم غير مُعدّ'));
  return fetchJSON(API_URL, { method:'POST', body: JSON.stringify(payload), redirect:'follow' });
}

function showScreen(name){
  $('#startScreen').classList.toggle('on', name === 'start');
  $('#workScreen').classList.toggle('on', name === 'work');
  window.scrollTo(0, 0);
}

function renderBranchOptions(){
  const sel = $('#branchSelect');
  const prev = sel.value;
  if (!state.branches.length) {
    sel.innerHTML = '<option value="">لا توجد فروع مسجّلة</option>';
    updateStartState(); return;
  }
  sel.innerHTML = '<option value="">— اختر الفرع —</option>' +
    state.branches.map(function(b){
      return '<option value="' + esc(b.branch) + '">' + esc(b.branch) + '</option>';
    }).join('');
  if (prev) sel.value = prev;
  if (!sel.value && state.branches.length === 1) sel.value = state.branches[0].branch;
  updateBranchInfo();
  updateStartState();
}

function updateBranchInfo(){
  const val = $('#branchSelect').value;
  const b = state.branches.filter(function(x){ return x.branch === val; })[0];
  const info = $('#branchInfo');
  if (!b) { info.textContent = ''; return; }
  info.innerHTML = arNum(b.fridges) + ' ثلاجة في ' + arNum(b.sections) + ' أقسام · ' +
    arNum(b.saved) + ' سُجّلت اليوم';
}

function updateStartState(){
  const name = ($('#userName').value || '').trim();
  $('#startBtn').disabled = !($('#branchSelect').value && name.length >= 3);
}

function startRecording(){
  const branch = $('#branchSelect').value;
  const name = ($('#userName').value || '').trim();
  if (!branch) { toast('اختر الفرع أولًا', 'warn'); return; }
  if (name.length < 3) { toast('أدخل اسمك (٣ أحرف على الأقل)', 'warn'); $('#userName').focus(); return; }
  state.user = name;
  localStorage.setItem(LS_USER, name);
  const date = $('#dateInput').value || todayISO();
  const b = state.branches.filter(function(x){ return x.branch === branch; })[0];
  if (b && b.saved > 0 && date === todayISO()) {
    const pct = Math.round(b.saved / b.fridges * 100);
    const info = document.createElement('div');
    info.className = 'banner'; info.style.marginTop = '10px';
    info.innerHTML = '⚠ هذا الفرع سُجّل جزئياً اليوم (<b>' + arNum(b.saved) + '</b> من <b>' + arNum(b.fridges) + '</b> — ' +
      arNum(pct) + '%). <button id="continueAnyway" style="margin-top:4px;border:none;background:var(--brand);color:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer">متابعة واستكمال</button>';
    const existing = document.querySelector('.pick .banner');
    if (existing) existing.remove();
    $('#startBtn').parentNode.insertBefore(info, $('#startBtn'));
    document.getElementById('continueAnyway').onclick = function(){ info.remove(); openDay(branch, date); };
    return;
  }
  openDay(branch, date);
}

function loadBranches(){
  if (!apiReady()) {
    $('#apiBanner').innerHTML = '<div class="banner">يجب إدخال رابط النشر في API_URL.</div>';
    return Promise.resolve();
  }
  const sel = $('#branchSelect');
  if (!state.branches.length) sel.innerHTML = '<option value="">جارٍ التحميل…</option>';
  return apiGet({ action:'getBranches', date:$('#dateInput').value || todayISO() })
    .then(function(d){
      state.branches = d.branches || [];
      renderBranchOptions();
    })
    .catch(function(e){
      sel.innerHTML = '<option value="">تعذّر التحميل</option>';
      $('#branchInfo').innerHTML = '<span style="color:var(--bad);font-weight:700">خطأ: ' + esc(e.message) + '</span>' +
        '<br><button class="btn primary" style="min-height:40px;margin-top:8px" onclick="loadBranches()">🔄 إعادة المحاولة</button>';
    });
}

function openDay(branch, date){
  state.branch = branch; state.date = date;
  state.dirty.clear(); state.force = false;
  localStorage.setItem(LS_LAST, JSON.stringify({ branch, date, user:state.user, ts:Date.now() }));
  showScreen('work');
  $('#wbBranch').textContent = branch;
  $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(date) + ' · جارٍ التحميل…';
  $('#sectionChips').innerHTML = '';
  $('#sectionBody').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  setActionInfo('…'); hideProblems();

  return apiGet({ action:'getDay', branch, date })
    .then(function(d){
      state.sections = d.sections || [];
      state.readings = {};
      (d.readings || []).forEach(function(item){
        if (!item || !item.code || !item.status) return;
        const k = readingKey(item.code, item.section || '');
        state.readings[k] = {
          temp: (item.temp === null || item.temp === '' || item.temp === undefined) ? '' : String(item.temp),
          status: item.status || '', note: item.note || '', time: item.time || ''
        };
      });
      if (!state.sections.length) return renderNoFridges();

      /* استرجاع مسودة محلية */
      const draft = loadDraftReadings(branch, date);
      if (draft && draft.readings) {
        let restored = 0;
        Object.keys(draft.readings).forEach(function(k){
          if (!state.readings[k] || !state.readings[k].status) {
            state.readings[k] = draft.readings[k]; state.dirty.add(k); restored++;
          }
        });
        if (restored > 0) {
          const banner = document.createElement('div');
          banner.className = 'banner';
          banner.innerHTML = '🔄 تم استرجاع <b>' + arNum(restored) + '</b> قراءة غير محفوظة. ' +
            '<button style="border:none;background:var(--warn);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer" id="discardDraftBtn">تجاهل</button>';
          $('#sectionBody').parentNode.insertBefore(banner, $('#sectionBody'));
          document.getElementById('discardDraftBtn').onclick = function(){
            state.dirty.clear(); clearDraftReadings(); banner.remove(); openDay(branch, date);
          };
        }
      }

      state.active = firstIncomplete();
      renderChips(); renderSection(); refreshHeader();
    })
    .catch(function(e){
      $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(date);
      $('#sectionBody').innerHTML = '<div class="empty">تعذّر تحميل البيانات<br><small>' + esc(e.message) + '</small><br><br>' +
        '<button class="btn primary" style="max-width:220px;margin:auto" id="retryDay">إعادة المحاولة</button></div>';
      const b = $('#retryDay');
      if (b) b.onclick = function(){ openDay(branch, date); };
    });
}

function renderNoFridges(){
  $('#sectionChips').innerHTML = ''; $('#progressBar').style.width = '0%';
  $('#sectionBody').innerHTML = '<div class="empty">لا توجد ثلاجات مسجّلة لهذا الفرع.</div>';
  $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(state.date);
  setActionInfo('لا توجد ثلاجات');
  $('#saveBtn').disabled = true; $('#nextBtn').disabled = true; $('#prevBtn').disabled = true;
}

function readingKey(code, sectionName){
  const sec = sectionName !== undefined ? sectionName : (activeSection() ? activeSection().name : '');
  return sec + '|||' + code;
}
function readingOf(code, sectionName){
  const k = readingKey(code, sectionName);
  if (!state.readings[k]) state.readings[k] = { temp:'', status:'', note:'', time:'' };
  return state.readings[k];
}
function statusByLabel(label){
  for (let i = 0; i < STATUSES.length; i++) if (STATUSES[i].label === label) return STATUSES[i];
  return label ? { key:'other', label, tone:'info', needsTemp:true } : null;
}
function isSaved(code, sectionName){
  const r = state.readings[readingKey(code, sectionName)];
  return !!(r && r.status);
}
function sectionStats(sec){
  let total = sec.fridges.length, saved = 0;
  sec.fridges.forEach(function(f){ if (isSaved(f.code, sec.name)) saved++; });
  return { total, saved };
}
function totalStats(){
  let total = 0, saved = 0;
  state.sections.forEach(function(s){ const st = sectionStats(s); total += st.total; saved += st.saved; });
  return { total, saved };
}
function firstIncomplete(){
  for (let i = 0; i < state.sections.length; i++){
    if (sectionStats(state.sections[i]).saved < sectionStats(state.sections[i]).total) return i;
  }
  return 0;
}
function activeSection(){ return state.sections[state.active] || null; }

function refreshHeader(){
  const t = totalStats();
  const pct = t.total ? Math.round(t.saved / t.total * 100) : 0;
  const sec = activeSection();
  const st = sec ? sectionStats(sec) : { total:0, saved:0 };
  let alarms = 0;
  state.sections.forEach(function(s){ alarms += sectionAlarms(s); });
  $('#wbSub').textContent = (state.user ? state.user + ' · ' : '') + fmtDate(state.date) + ' · ' +
    arNum(t.saved) + ' من ' + arNum(t.total) + ' ثلاجة' +
    (alarms ? ' · ⚠ ' + arNum(alarms) + ' فوق الحد' : '');
  $('#progressBar').style.width = pct + '%';
  setActionInfo(sec ? 'القسم «' + sec.name + '» — ' + arNum(st.saved) + ' من ' + arNum(st.total) + ' مسجّلة' : '');
  $('#saveBtn').disabled = !sec;
  $('#nextBtn').disabled = !sec;
  $('#prevBtn').disabled = !sec || state.active === 0;
  document.title = arNum(t.saved) + '/' + arNum(t.total) + ' · ' + state.branch;
}

function renderChips(){
  const box = $('#sectionChips');
  box.innerHTML = state.sections.map(function(s, i){
    const st = sectionStats(s);
    const done = st.total > 0 && st.saved >= st.total;
    const alarms = sectionAlarms(s);
    const remaining = st.total - st.saved;
    let extra = done ? ' ✓' : (alarms > 0 ? ' <b style="color:var(--bad)">⚠' + arNum(alarms) + '</b>' : (remaining > 0 ? ' <b>(' + arNum(remaining) + ' متبقي)</b>' : ''));
    return '<button class="chip' + (i === state.active ? ' on' : '') + (done ? ' done' : '') + '" data-i="' + i + '">' +
      '<span class="dot"></span>' + esc(s.name) + ' <b>' + arNum(st.saved) + '/' + arNum(st.total) + '</b>' + extra + '</button>';
  }).join('');
  const on = box.querySelector('.chip.on');
  if (on) on.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
}

function renderSection(){
  const sec = activeSection();
  const body = $('#sectionBody');
  if (!sec) { body.innerHTML = ''; return; }

  const st0 = sectionStats(sec);
  const al0 = sectionAlarms(sec);
  const head = '<div class="sec-title"><b>' + esc(sec.name) + '</b>' +
    '<span>' + arNum(st0.saved) + ' من ' + arNum(st0.total) + ' مسجّلة' +
    (al0 ? ' · <b style="color:var(--bad)">' + arNum(al0) + ' فوق الحد</b>' : '') + '</span></div>';

  body.innerHTML = head + sec.fridges.map(function(f){
    const r = readingOf(f.code, sec.name);
    const st = statusByLabel(r.status);

    /* ======= تحديد نوع التبريد والموديل بشكل صحيح ======= */
    const cooling  = f.cooling  || 'تبريد';   /* تبريد / تجميد */
    const subtype  = f.subtype  || '';         /* مالتي ديك / عرض / إلخ */

    const limit = ALARM_ABOVE[cooling];
    const val = parseTemp(r.temp);
    const over = (limit !== undefined && val !== null && val > limit);

    const statusBtns = STATUSES.map(function(s){
      return '<button type="button" class="seg-btn ' + s.tone + (r.status === s.label ? ' on' : '') +
        '" data-act="status" data-label="' + esc(s.label) + '">' + esc(s.label) + '</button>';
    }).join('');

    const rkey = readingKey(f.code, sec.name);
    const savedState = isSaved(f.code, sec.name);
    const stateClass = savedState ? (state.dirty.has(rkey) ? 'dirty' : 'saved') : 'none';
    const stateText  = savedState ? (state.dirty.has(rkey) ? 'معدّلة' : 'محفوظة ' + arabicClock(r.time)) : '';

    return '<div class="card' + (over ? ' alarm' : '') + '" data-code="' + esc(f.code) + '" data-section="' + esc(sec.name) + '">' +

      /* ===== سطر العنوان: كود + نوع التبريد + الموديل + إشارة الإنذار + حالة الحفظ ===== */
      '<div class="card-header">' +
        '<span class="code">' + esc(f.code) + '</span>' +
        '<span class="type-badge">' + esc(cooling) + '</span>' +
        (subtype ? '<span class="subtype-badge">' + esc(subtype) + '</span>' : '') +
        (over ? '<span class="alarm-badge">⚠ فوق الحد</span>' : '') +
        '<span class="state ' + stateClass + '">' + stateText + '</span>' +
      '</div>' +

      /* ===== سطر التسجيل ===== */
      '<div class="card-body">' +
        '<div class="seg">' + statusBtns + '</div>' +
        '<div class="temp-wrap">' +
          '<input class="temp" dir="ltr" inputmode="decimal" enterkeyhint="done" autocomplete="off" ' +
            'value="' + esc(r.temp) + '" placeholder="°م">' +
          '<button type="button" class="sign" data-act="sign" aria-label="سالب">−</button>' +
        '</div>' +
      '</div>' +
      '<div class="hint"></div>' +
      '<details class="note"' + (r.note ? ' open' : '') + '>' +
        '<summary>ملاحظة (اختياري)</summary>' +
        '<input class="note-input" maxlength="120" value="' + esc(r.note) + '">' +
      '</details>' +
    '</div>';
  }).join('');

  body.querySelectorAll('.card').forEach(function(card){ updateHint(card); });
  refreshHeader();
}

function updateHint(card){
  const code = card.dataset.code;
  const sec  = card.dataset.section;
  const rkey = readingKey(code, sec);
  const f = (state.sections.find(function(s){ return s.name === sec; }) || { fridges:[] })
              .fridges.find(function(x){ return x.code === code; });
  const r = state.readings[rkey] || readingOf(code, sec);
  const hint = card.querySelector('.hint');
  if (!hint) return;

  const cooling = f ? (f.cooling || 'تبريد') : 'تبريد';
  const val   = parseTemp(r.temp);
  const limit = ALARM_ABOVE[cooling];
  const over  = (limit !== undefined && val !== null && val > limit);

  card.classList.toggle('alarm', over);
  const badge = card.querySelector('.alarm-badge');
  if (badge) badge.hidden = !over;

  hint.classList.remove('over');
  if (!String(r.temp).trim()) {
    hint.textContent = 'استخدم − للقيم السالبة';
  } else if (val === null) {
    hint.textContent = 'القراءة غير صحيحة'; hint.classList.add('over');
  } else if (over) {
    hint.innerHTML = '⚠ تجاوز الحد المسموح (' + num(limit) + ')'; hint.classList.add('over');
  } else {
    hint.textContent = '✓ داخل الحد';
  }
}

function sectionAlarms(sec){
  let n = 0;
  sec.fridges.forEach(function(f){
    const r = state.readings[readingKey(f.code, sec.name)];
    if (!r) return;
    const v = parseTemp(r.temp);
    const lim = ALARM_ABOVE[f.cooling || 'تبريد'];
    if (lim !== undefined && v !== null && v > lim) n++;
  });
  return n;
}

function alarmsIn(rows){
  return rows.filter(function(r){
    const lim = ALARM_ABOVE[r.cooling || 'تبريد'];
    return lim !== undefined && r.temp !== null && r.temp > lim;
  });
}

function openConfirm(over){
  $('#confirmText').innerHTML = 'يوجد ' + arNum(over.length) + ' قراءة متجاوزة للحد: ' +
    over.map(function(r){ return '«' + esc(r.code) + '» ' + num(r.temp); }).join('، ') +
    '<br>يمكن المتابعة وحفظها كما هي.';
  $('#confirmModal').classList.add('on');
}

function paintCardState(rkey){
  const parts = rkey.split('|||');
  const secName = parts[0];
  const code = parts.slice(1).join('|||');
  const card = document.querySelector(
    '#sectionBody .card[data-code="' + code.replace(/"/g,'\\"') + '"][data-section="' + secName.replace(/"/g,'\\"') + '"]'
  );
  if (!card) return;
  const el = card.querySelector('.state');
  const r = state.readings[rkey];
  if (!r || !r.status) { el.className = 'state none'; el.textContent = ''; return; }
  if (state.dirty.has(rkey)) { el.className = 'state dirty'; el.textContent = 'معدّلة'; }
  else { el.className = 'state saved'; el.textContent = 'محفوظة ' + arabicClock(r.time); }
}

function setActionInfo(txt){ $('#abInfo').textContent = txt || ''; }
function cardRkey(card){ return readingKey(card.dataset.code, card.dataset.section); }

function onInput(e){
  const input = e.target;
  const card = input.closest('.card');
  if (!card) return;
  const rkey = cardRkey(card);
  const r = state.readings[rkey] || (state.readings[rkey] = { temp:'', status:'', note:'', time:'' });
  if (input.classList.contains('temp')) {
    r.temp = input.value; state.dirty.add(rkey); paintCardState(rkey); updateHint(card); scheduleAutosave();
  } else if (input.classList.contains('note-input')) {
    r.note = input.value; state.dirty.add(rkey); paintCardState(rkey); scheduleAutosave();
  }
}

function onClick(e){
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const card = btn.closest('.card');
  if (!card) return;
  const rkey = cardRkey(card);
  const r = state.readings[rkey] || (state.readings[rkey] = { temp:'', status:'', note:'', time:'' });

  if (btn.dataset.act === 'status') {
    const label = btn.dataset.label; if (!label) return;
    r.status = label; state.dirty.add(rkey);
    card.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.toggle('on', b.dataset.label === label); });
    paintCardState(rkey); updateHint(card);
    if (statusByLabel(label) && statusByLabel(label).needsTemp && !String(r.temp).trim())
      card.querySelector('.temp').focus();
    scheduleAutosave();
  }
  if (btn.dataset.act === 'sign') {
    const input = card.querySelector('.temp');
    const v = input.value.trim();
    input.value = !v ? '-' : (v.charAt(0) === '-' ? v.slice(1) : '-' + v);
    r.temp = input.value; state.dirty.add(rkey); paintCardState(rkey); updateHint(card); scheduleAutosave();
  }
}

/* ======= تجميع بيانات القسم — الإصلاح الأساسي ======= */
function collectSection(sec){
  const rows = [], problems = [];
  sec.fridges.forEach(function(f){
    const r = readingOf(f.code, sec.name);
    const st = statusByLabel(r.status);
    const tempStr = String(r.temp === null || r.temp === undefined ? '' : r.temp).trim();
    if (!r.status) { problems.push(f.code + ': لم تختر الحالة بعد'); return; }
    if (st && st.needsTemp && !tempStr) { problems.push(f.code + ': لم تكتب درجة الحرارة'); return; }
    const n = tempStr ? parseTemp(tempStr) : null;
    if (tempStr && n === null) { problems.push(f.code + ': الرقم المكتوب غير صحيح'); return; }
    rows.push({
      code:    f.code,
      cooling: f.cooling || 'تبريد',   /* ← تبريد/تجميد منفصل */
      subtype: f.subtype || '',         /* ← الموديل منفصل */
      temp:    n,
      status:  r.status,
      note:    (r.note || '').trim()
    });
  });
  return { rows, problems };
}

function hasDirtyIn(sec){
  return sec.fridges.some(function(f){ return state.dirty.has(readingKey(f.code, sec.name)); });
}

function saveDraftReadings(){
  if (!state.branch || !state.date) return;
  try { localStorage.setItem(LS_DRAFT_READINGS, JSON.stringify({ branch:state.branch, date:state.date, readings:state.readings, ts:Date.now() })); }
  catch(e) {}
}
function loadDraftReadings(branch, date){
  try {
    const raw = localStorage.getItem(LS_DRAFT_READINGS);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return (d.branch === branch && d.date === date) ? d : null;
  } catch(e) { return null; }
}
function clearDraftReadings(){ try { localStorage.removeItem(LS_DRAFT_READINGS); } catch(e) {} }

function scheduleAutosave(){
  clearTimeout(state.timer);
  saveDraftReadings();
  state.timer = setTimeout(function(){
    const sec = activeSection();
    if (!sec || state.saving || !hasDirtyIn(sec)) return;
    const c = collectSection(sec);
    if (!c.rows.length || c.problems.length) return;
    saveSection({ silent:true, force:true });
  }, 1800);
}

function saveSection(opts){
  opts = opts || {};
  const sec = activeSection();
  if (!sec || state.saving) return Promise.resolve();
  const c = collectSection(sec);
  if (!c.rows.length) { toast('لا توجد قراءات مكتملة في هذا القسم', 'warn'); return Promise.resolve(); }
  if (c.problems.length && !opts.force) { showProblems(c.problems, sec, c.rows.length); return Promise.resolve(); }
  const over = alarmsIn(c.rows);
  if (over.length && !opts.confirmed && !opts.silent) { openConfirm(over); return Promise.resolve(); }
  hideProblems();
  state.force = false; state.saving = true;
  $('#saveBtn').textContent = 'جارٍ الحفظ…';

  /* ======= الـ payload يبعت cooling و subtype منفصلين ======= */
  const payload = {
    action: 'saveSection',
    branch: state.branch,
    date:   state.date,
    by:     state.user,
    section: sec.name,
    readings: c.rows   /* كل row فيه code, cooling, subtype, temp, status, note */
  };

  return apiPost(payload)
    .then(function(res){ applySaved(sec, c.rows, res.time); return res; })
    .catch(function(err){
      return verifySaved(sec, c.rows).then(function(ok){
        if (!ok) throw err;
        applySaved(sec, c.rows, nowClock());
        return { time:nowClock() };
      });
    })
    .then(function(){
      if (!opts.silent) toast('تم حفظ «' + sec.name + '» ✓', 'ok');
    })
    .catch(function(err){
      toast('تعذّر الحفظ: ' + err.message + ' — أعد المحاولة', 'bad');
    })
    .then(function(){
      state.saving = false;
      $('#saveBtn').textContent = 'حفظ القسم';
      refreshHeader();
    });
}

function verifySaved(sec, rows){
  return apiGet({ action:'getDay', branch:state.branch, date:state.date })
    .then(function(d){
      const list = d.readings || [];
      return rows.every(function(r){
        const s = list.find(function(x){ return x.code === r.code && x.section === sec.name; });
        if (!s) return false;
        return s.status === r.status;
      });
    })
    .catch(function(){ return false; });
}

function applySaved(sec, rows, time){
  rows.forEach(function(r){
    const cur = readingOf(r.code, sec.name);
    cur.temp = r.temp === null ? '' : String(r.temp);
    cur.status = r.status; cur.note = r.note; cur.time = time || nowClock();
    state.dirty.delete(readingKey(r.code, sec.name));
  });
  if (!state.dirty.size) clearDraftReadings();
  renderChips(); refreshHeader();
  document.querySelectorAll('#sectionBody .card').forEach(function(card){ paintCardState(cardRkey(card)); });
  const st = sectionStats(sec);
  const head = document.querySelector('#sectionBody .sec-title span');
  if (head) head.textContent = arNum(st.saved) + ' من ' + arNum(st.total) + ' مسجّلة';
}

function showProblems(problems, sec, readyCount){
  const box = $('#problems');
  box.innerHTML = '<b>' + arNum(problems.length) + ' ثلاجة ناقصة</b><ul>' +
    problems.slice(0, 6).map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
    (readyCount > 0 ? '<div style="margin-top:8px;font-weight:600">اضغط حفظ مرة ثانية لحفظ ' + arNum(readyCount) + ' ثلاجة مكتملة.</div>' : '');
  box.style.display = 'block';
  $('#saveBtn').textContent = readyCount > 0 ? 'حفظ المكتمل (' + arNum(readyCount) + ')' : 'حفظ القسم';
  state.force = readyCount > 0;
}
function hideProblems(){
  $('#problems').style.display = 'none'; $('#problems').innerHTML = '';
  if (!state.saving) $('#saveBtn').textContent = 'حفظ القسم';
}

function goSection(i){
  if (i < 0 || i >= state.sections.length) return;
  const cur = activeSection();
  const after = function(){
    state.active = i; hideProblems(); renderChips(); renderSection(); window.scrollTo(0, 0);
  };
  if (cur && hasDirtyIn(cur)) {
    const c = collectSection(cur);
    if (c.rows.length) { saveSection({ silent:true, force:true }).then(after); return; }
  }
  after();
}

function bind(){
  $('#dateInput').addEventListener('change', function(){ loadBranches(); });
  $('#refreshBtn').addEventListener('click', function(){ loadBranches(); });
  $('#branchSelect').addEventListener('change', function(){ updateBranchInfo(); updateStartState(); });
  $('#userName').addEventListener('input', updateStartState);
  $('#userName').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !$('#startBtn').disabled) startRecording(); });
  $('#startBtn').addEventListener('click', startRecording);
  $('#backBtn').addEventListener('click', function(){
    if (state.dirty.size) { const sec = activeSection(); if (sec) saveSection({ silent:true, force:true }); }
    showScreen('start'); loadBranches();
  });
  $('#pickDateBtn').addEventListener('click', function(){
    const el = document.createElement('input');
    el.type = 'date'; el.value = state.date; el.max = todayISO();
    el.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(el);
    el.addEventListener('change', function(){
      if (el.value && el.value !== state.date) openDay(state.branch, el.value);
      setTimeout(function(){ el.remove(); }, 100);
    });
    try { el.showPicker(); } catch(e) { el.focus(); el.click(); }
  });
  $('#sectionChips').addEventListener('click', function(e){
    const chip = e.target.closest('.chip');
    if (chip) goSection(+chip.dataset.i);
  });
  $('#sectionBody').addEventListener('input', onInput);
  $('#sectionBody').addEventListener('click', onClick);
  $('#saveBtn').addEventListener('click', function(){
    if (state.force) { saveSection({ force:true }); return; }
    const sec = activeSection(); if (!sec) return;
    const c = collectSection(sec);
    if (c.problems.length) { showProblems(c.problems, sec, c.rows.length); return; }
    saveSection({ force:true });
  });
  $('#prevBtn').addEventListener('click', function(){ if (state.active > 0) goSection(state.active - 1); });
  $('#nextBtn').addEventListener('click', function(){
    if (state.active < state.sections.length - 1) { goSection(state.active + 1); }
    else {
      const t = totalStats();
      toast(t.saved >= t.total ? 'تم ✓ تسجيل جميع الثلاجات (' + arNum(t.total) + ') اليوم' :
        'هذا آخر قسم — تبقّى ' + arNum(t.total - t.saved) + ' ثلاجة', t.saved >= t.total ? 'ok' : 'warn');
    }
  });
  $('#confirmCancel').addEventListener('click', function(){ $('#confirmModal').classList.remove('on'); });
  $('#confirmOk').addEventListener('click', function(){ $('#confirmModal').classList.remove('on'); saveSection({ force:true, confirmed:true }); });
  window.addEventListener('beforeunload', function(e){ if (state.dirty.size) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('online', function(){ if (state.dirty.size) scheduleAutosave(); });
}

function boot(){
  const today = todayISO();
  const dateEl = $('#dateInput');
  dateEl.value = today; dateEl.max = today;
  $('#userName').value = localStorage.getItem(LS_USER) || '';
  bind();

  let last = null;
  try { last = JSON.parse(localStorage.getItem(LS_LAST) || 'null'); } catch(e) {}

  loadBranches().then(function(){
    const hasLast = last && last.branch && state.branches.some(function(b){ return b.branch === last.branch; });
    if (hasLast) { $('#branchSelect').value = last.branch; updateBranchInfo(); updateStartState(); }
    if (hasLast && last.date === today && last.user) {
      state.user = last.user; $('#userName').value = last.user; openDay(last.branch, today);
    }
  });
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
