<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>إعداد بيانات الثلاجات — أسواق فتح الله للجملة</title>
<style>
  :root{
    color-scheme: light;
    --bg:#F5F4F2; --card:#FFFFFF; --ink:#141414; --muted:#666666;
    --line:#E5E2DC; --brand:#F37021; --brand-dark:#DF5B00; --brand-soft:#FFF1E6;
    --black:#141414;
    --ok:#107C41; --ok-soft:#E7F6ED;
    --warn:#B45309; --warn-soft:#FEF3C7;
    --bad:#C62828; --bad-soft:#FDECEA;
    --shadow:0 1px 3px rgba(20,20,20,.06);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#0E0E0E; --card:#181818; --ink:#F4F4F2; --muted:#A3A3A3;
      --line:#2B2B2B; --brand:#F37021; --brand-dark:#FF8538; --brand-soft:#2D1A0E;
      --black:#111111;
      --ok:#2DCE7A; --ok-soft:#102B1D;
      --warn:#F59E0B; --warn-soft:#2F220B;
      --bad:#EF5350; --bad-soft:#341616;
      --shadow:none;
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-size:15.5px; line-height:1.45;
    font-family:'Segoe UI', Tahoma, 'Noto Kufi Arabic', Arial, sans-serif;
    padding-bottom:130px;
  }
  button, input, select{ font-family:inherit; font-size:15.5px; color:inherit; }
  button{ cursor:pointer; }

  .hero{
    background:linear-gradient(165deg, #1A1A1A, #0D0D0D);
    color:#fff; padding:20px 16px;
    border-bottom:4px solid var(--brand);
    border-radius:0 0 22px 22px;
  }
  .brand-lockup{ display:flex; align-items:center; gap:12px; max-width:720px; margin:0 auto; }
  .brand-mark{
    width:42px; height:42px; flex:0 0 42px; border-radius:11px;
    background:var(--brand); display:grid; place-items:center;
    box-shadow:0 4px 12px rgba(243,112,33,.35);
  }
  .hero h1{ margin:0; font-size:18px; font-weight:800; }
  .hero p{ margin:2px 0 0; font-size:12.5px; color:#D4D4D4; }

  .wrap{ max-width:720px; margin:0 auto; padding:16px 14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden; }
  .card-head{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
  .num{ width:26px; height:26px; border-radius:50%; background:var(--brand); color:#fff; font-size:12.5px; font-weight:800; display:grid; place-items:center; flex:0 0 auto; }
  .card-head h2{ margin:0; font-size:15px; }
  .card-body{ padding:14px; }

  label.lbl{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:700; }
  select, input[type="text"]{
    width:100%; min-height:46px; padding:0 12px; border:1.5px solid var(--line);
    border-radius:11px; background:var(--bg); outline:none;
  }
  select:focus, input[type="text"]:focus{ border-color:var(--brand); background:var(--card); box-shadow:0 0 0 3px var(--brand-soft); }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media (min-width: 600px){ .grid{ grid-template-columns:repeat(3, 1fr); } }
  .sec-check{
    display:flex; align-items:center; gap:8px; padding:10px; border:1.5px solid var(--line);
    border-radius:11px; cursor:pointer; font-size:13px; font-weight:600; color:var(--muted);
    background:var(--card); text-align:right; min-height:46px;
  }
  .sec-check .box{ width:18px; height:18px; border-radius:5px; border:1.5px solid var(--line); flex:0 0 auto; display:grid; place-items:center; font-size:11px; color:#fff; }
  .sec-check.on{ border-color:var(--brand); background:var(--brand-soft); color:var(--ink); font-weight:700; }
  .sec-check.on .box{ background:var(--brand); border-color:var(--brand); }

  .block{ background:var(--card); border:1px solid var(--line); border-radius:14px; margin-top:12px; overflow:hidden; box-shadow:var(--shadow); }
  .block-head{ display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--black); color:#fff; }
  .block-head b{ font-size:14px; flex:1; }
  .block-head .cnt{ font-size:12px; color:#D4D4D4; font-weight:700; font-variant-numeric:tabular-nums; }
  .add{ border:none; background:var(--brand); color:#fff; border-radius:8px; padding:6px 12px; font-size:12.5px; font-weight:700; min-height:34px; }

  .rows{ padding:10px 12px; display:flex; flex-direction:column; gap:10px; }
  .row{ display:flex; flex-direction:column; gap:6px; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .row:last-child{ padding-bottom:0; border-bottom:none; }
  .row-top{ display:flex; align-items:center; gap:8px; }
  .row-top input[type="text"]{
    flex:1; min-height:44px; border:1.5px solid var(--line); border-radius:10px;
    background:var(--bg); padding:0 12px; font-size:15px; outline:none;
  }
  .row-top input[type="text"]:focus{ border-color:var(--brand); background:var(--card); box-shadow:0 0 0 3px var(--brand-soft); }
  .row-top input[type="text"]::placeholder{ font-size:12px; color:var(--muted); }

  .row-selects{ display:flex; gap:7px; }
  .row-selects select{
    flex:1; min-width:0; min-height:42px; padding:0 10px; border-radius:10px;
    font-size:13px; background:var(--card); border:1.5px solid var(--line); color:var(--ink); outline:none;
  }
  .row-selects select:focus{ border-color:var(--brand); box-shadow:0 0 0 2px var(--brand-soft); }

  .del{
    width:44px; height:44px; flex:0 0 44px; border:1.5px solid var(--line); background:var(--card);
    color:var(--bad); border-radius:10px; font-size:16px; line-height:1;
  }
  .del:active{ background:var(--bad-soft); }
  .empty-row{ font-size:12.5px; color:var(--muted); text-align:center; padding:8px; }

  .bar{
    position:fixed; inset-inline:0; bottom:0; background:var(--card); border-top:1px solid var(--line);
    padding:8px 14px calc(8px + env(safe-area-inset-bottom, 0px)); z-index:40;
    box-shadow:0 -4px 18px rgba(0,0,0,.08);
  }
  .bar .info{ text-align:center; font-size:12px; color:var(--muted); margin-bottom:6px; font-variant-numeric:tabular-nums; }
  .bar .btns{ display:flex; gap:8px; max-width:720px; margin:auto; }
  .btn{ flex:1; min-height:48px; border:none; border-radius:12px; font-size:15px; font-weight:800; padding:0 14px; }
  .btn.primary{ background:var(--brand); color:#fff; }
  .btn.primary:disabled{ background:var(--line); color:var(--muted); }
  .btn.ghost{ background:var(--bg); border:1.5px solid var(--line); flex:0 0 36%; }

  .msg{ border-radius:11px; padding:11px 13px; font-size:13px; margin-bottom:12px; display:none; }
  .msg.err{ display:block; background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad); }
  .msg.ok{ display:block; background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok); }
  .msg.warn{ display:block; background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn); }
  .msg ul{ margin:6px 0 0; padding-inline-start:16px; }

  .result{ text-align:center; padding:26px 18px; }
  .result .tick{ width:64px; height:64px; border-radius:50%; background:var(--ok-soft); color:var(--ok); font-size:32px; display:grid; place-items:center; margin:0 auto 12px; }
  .result h2{ margin:0 0 6px; font-size:18px; }
  .result p{ margin:0; color:var(--muted); font-size:13.5px; }

  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; z-index:80; }
  .modal.on{ display:flex; }
  .sheet{ background:var(--card); width:100%; max-width:640px; margin:0 auto; border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .sheet h3{ margin:0 0 8px; font-size:16px; }
  .sheet p{ margin:0 0 14px; font-size:13.5px; color:var(--muted); }
  .sheet .btns{ display:flex; gap:8px; }
  .spin{ width:18px; height:18px; border:2.5px solid #ffffff55; border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; display:inline-block; vertical-align:-3px; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="hero">
  <div class="brand-lockup">
    <div class="brand-mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M5 5H19V8.4H9.4V11H17.2V14.2H9.4V19H5V5Z" fill="#FFFFFF"/>
      </svg>
    </div>
    <div>
      <h1>أسواق فتح الله للجملة</h1>
      <p>إعداد بيانات الثلاجات — لكل فرع مرة واحدة</p>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="topMsg" class="msg"></div>

  <div class="card" id="formCard">
    <div class="card-head"><div class="num">١</div><h2>الفرع</h2></div>
    <div class="card-body">
      <label class="lbl" for="branch">اسم الفرع</label>
      <select id="branch">
        <option value="">-- اختر الفرع --</option>
      </select>
      <div id="existingInfo" style="font-size:12.5px;color:var(--muted);margin-top:8px"></div>
    </div>
  </div>

  <div class="card" id="sectionsCard">
    <div class="card-head"><div class="num">٢</div><h2>الأقسام</h2></div>
    <div class="card-body">
      <label class="lbl">اختر الأقسام الموجودة في الفرع</label>
      <div class="grid" id="secGrid"></div>
    </div>
  </div>

  <div id="blocks"></div>

  <div class="card" id="resultCard" style="display:none">
    <div class="result">
      <div class="tick">✓</div>
      <h2>تم حفظ الإعداد</h2>
      <p id="resultText"></p>
      <div style="display:flex;gap:8px;margin-top:16px">
        <a class="btn primary" href="index.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">فتح صفحة التسجيل</a>
        <button class="btn ghost" onclick="location.reload()">فرع آخر</button>
      </div>
    </div>
  </div>
</div>

<div class="bar">
  <div class="info" id="barInfo">اختر الفرع أولًا</div>
  <div class="btns">
    <button class="btn ghost" id="clearBtn">تفريغ</button>
    <button class="btn primary" id="submitBtn" disabled>حفظ الإعداد</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="mTitle">تأكيد الحفظ</h3>
    <p id="mText"></p>
    <div class="btns">
      <button class="btn ghost" id="mCancel">رجوع</button>
      <button class="btn primary" id="mOk">تأكيد</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ⚙️  الإعدادات
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbycG7Fld1-DO3kCcW-GotiiSPkzHpAwNL0lpmdfLpE8_bB_nh-mp8egD0cYcjPIIICI_A/exec";

const BRANCHES = [
  'المحلة','دمنهور','دمنهور الاستاد','دمياط','طنطا','طنطا اوتلت','كفر الدوار',
  'كفر الدوار مول','استانلي','الابراهيمية','الابراهيمية الميني','الانفوشى','النصر',
  'جاردنيا','سموحة','سموحة الميني','سيتى سكوير','سيدى جابر المحطة','سيدي بشر ميني',
  'سيدي جابر ميني','طوسون','فلمنج','ملك حفني','ابو يوسف','الهانوفيل','اكتوبر',
  'الدخيلة 1 ميني','الدخيلة 2 ميني','عجمى ستار','مطروح','الرحاب'
];

const SECTIONS = [
  'البقالة بالوزن','البقالة المعبأة','الدواجن الفريش','الجزارة البلدي','الجزارة المجمدة',
  'الاسماك الفريش','الوجبات الجاهزة','الخضار و الفاكهة','العطارة','المجمدات',
  'الحلويات','الحلواني و الخباز'
];

const FRIDGE_SUBTYPES = [
  'مالتي ديك',
  'بروموشن',
  'غرفة ( رئيسية )',
  'غرفة ( معمل قسم )',
  'عرض',
  'اندرتيبول',
  'فريزر افقي',
  'كومبي'
];

const CODE_PLACEHOLDER = 'رمز الثلاجة مثال : A';

/* ============================================================
   الحالة والمنطق
   ============================================================ */
const $ = (s, r) => (r || document).querySelector(s);
const LS_DRAFT = 'fathalla:setup:draft';

const state = {
  branch: '',
  existing: null,
  picked: [],
  data: {},
  busy: false
};

function esc(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function arNum(n){
  const d = '٠١٢٣٤٥٦٧٨٩';
  return String(n).replace(/\d/g, function(x){ return d[+x]; });
}
function cleanCode(s){ return String(s || '').replace(/\s+/g, ' ').trim(); }
function apiReady(){ return API_URL && API_URL.indexOf('http') === 0; }

function fetchJSON(url, opts, timeoutMs){
  const ctrl = new AbortController();
  const timer = setTimeout(function(){ ctrl.abort(); }, timeoutMs || 25000);
  const o = Object.assign({}, opts || {}, { signal: ctrl.signal, cache: 'no-store' });
  return fetch(url, o).then(function(res){
    clearTimeout(timer);
    return res.text().then(function(txt){
      let data;
      try { data = JSON.parse(txt); } catch (e) { throw new Error('استجابة غير متوقعة من الخادم'); }
      if (!data || data.status !== 'success') throw new Error((data && data.message) || 'فشل الطلب');
      return data;
    });
  }, function(err){
    clearTimeout(timer);
    if (err && err.name === 'AbortError') throw new Error('الاتصال بطيء — أعد المحاولة');
    throw new Error('تعذّر الاتصال بالخادم');
  });
}
function apiGet(params){
  if (!apiReady()) return Promise.reject(new Error('رابط الخادم غير مُعدّ'));
  const qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  return fetchJSON(API_URL + '?t=' + Date.now() + '&' + qs, { method:'GET' });
}
function apiPost(payload){
  if (!apiReady()) return Promise.reject(new Error('رابط الخادم غير مُعدّ'));
  return fetchJSON(API_URL, { method:'POST', body: JSON.stringify(payload), redirect:'follow' });
}

function msg(kind, html){
  const el = $('#topMsg');
  el.className = 'msg ' + kind;
  el.innerHTML = html;
  el.scrollIntoView({ behavior:'smooth', block:'center' });
}
function clearMsg(){ $('#topMsg').className = 'msg'; $('#topMsg').innerHTML = ''; }

function buildRowHTML(r, i){
  const cooling = r.cooling || 'تبريد';
  const subtype = r.subtype || '';

  const coolingOpts = ['تبريد', 'تجميد'].map(function(v){
    return '<option value="' + esc(v) + '"' + (cooling === v ? ' selected' : '') + '>' + esc(v) + '</option>';
  }).join('');

  const subtypeOpts = '<option value="">-- نوع الثلاجة --</option>' +
    FRIDGE_SUBTYPES.map(function(v){
      return '<option value="' + esc(v) + '"' + (subtype === v ? ' selected' : '') + '>' + esc(v) + '</option>';
    }).join('');

  return '<div class="row" data-i="' + i + '">' +
    '<div class="row-top">' +
      '<input type="text" class="code-input" value="' + esc(r.code) + '" placeholder="' + esc(CODE_PLACEHOLDER) + '" maxlength="30" autocomplete="off">' +
      '<button type="button" class="del" aria-label="حذف">✕</button>' +
    '</div>' +
    '<div class="row-selects">' +
      '<select class="cooling-select">' + coolingOpts + '</select>' +
      '<select class="subtype-select">' + subtypeOpts + '</select>' +
    '</div>' +
  '</div>';
}

function fillBranches(){
  const sel = $('#branch');
  sel.innerHTML = '<option value="">-- اختر الفرع --</option>' +
    BRANCHES.map(function(b){ return '<option value="' + esc(b) + '">' + esc(b) + '</option>'; }).join('');
}

function renderSecGrid(){
  $('#secGrid').innerHTML = SECTIONS.map(function(s){
    const on = state.picked.indexOf(s) > -1;
    return '<div class="sec-check' + (on ? ' on' : '') + '" data-sec="' + esc(s) + '">' +
      '<span class="box">' + (on ? '✓' : '') + '</span><span>' + esc(s) + '</span></div>';
  }).join('');
}

function toggleSection(name){
  const i = state.picked.indexOf(name);
  if (i > -1) {
    state.picked.splice(i, 1);
    delete state.data[name];
  } else {
    state.picked.push(name);
    if (!state.data[name]) state.data[name] = [{ code:'', cooling:'تبريد', subtype:'' }];
  }
  renderSecGrid();
  renderBlocks();
  updateBar();
  saveDraft();
}

function renderBlocks(){
  const box = $('#blocks');
  if (!state.picked.length) { box.innerHTML = ''; return; }

  box.innerHTML = state.picked.map(function(sec){
    const rows = state.data[sec] || [];
    const rowsHtml = rows.map(function(r, i){ return buildRowHTML(r, i); }).join('');

    return '<div class="block" data-sec="' + esc(sec) + '">' +
      '<div class="block-head"><b>' + esc(sec) + '</b>' +
        '<span class="cnt">' + arNum(rows.length) + '</span>' +
        '<button type="button" class="add">+ ثلاجة</button>' +
      '</div>' +
      '<div class="rows">' + (rowsHtml || '<div class="empty-row">لا توجد ثلاجات</div>') + '</div>' +
    '</div>';
  }).join('');
}

function updateBar(){
  const total = countAll();
  const secs = state.picked.length;
  const info = $('#barInfo');
  if (!state.branch) { info.textContent = 'اختر الفرع أولًا'; }
  else if (!secs) { info.textContent = 'اختر قسمًا واحدًا على الأقل'; }
  else { info.textContent = arNum(secs) + ' أقسام · ' + arNum(total) + ' ثلاجة'; }
  $('#submitBtn').disabled = state.busy || !state.branch || !secs || total === 0;
  $('#submitBtn').textContent = state.busy ? 'جارٍ الحفظ…' : 'حفظ الإعداد';
}

function countAll(){
  let n = 0;
  state.picked.forEach(function(s){
    (state.data[s] || []).forEach(function(r){ if (cleanCode(r.code)) n++; });
  });
  return n;
}

function onGridClick(e){
  const el = e.target.closest('.sec-check');
  if (el) toggleSection(el.dataset.sec);
}

function onBlockClick(e){
  const block = e.target.closest('.block');
  if (!block) return;
  const sec = block.dataset.sec;

  if (e.target.closest('.add')) {
    state.data[sec].push({ code:'', cooling:'تبريد', subtype:'' });
    renderBlocks();
    updateBar();
    saveDraft();
    const rows = document.querySelector('[data-sec="' + sec.replace(/"/g, '\\"') + '"] .rows');
    if (rows) {
      const inputs = rows.querySelectorAll('.code-input');
      if (inputs.length) inputs[inputs.length - 1].focus();
    }
    return;
  }

  if (e.target.closest('.del')) {
    const rowEl = e.target.closest('.row');
    const i = +rowEl.dataset.i;
    state.data[sec].splice(i, 1);
    renderBlocks();
    updateBar();
    saveDraft();
    return;
  }
}

function onBlockChange(e){
  const block = e.target.closest('.block');
  if (!block) return;
  const sec = block.dataset.sec;
  const rowEl = e.target.closest('.row');
  if (!rowEl) return;
  const i = +rowEl.dataset.i;
  if (!state.data[sec] || !state.data[sec][i]) return;

  if (e.target.classList.contains('cooling-select')) {
    state.data[sec][i].cooling = e.target.value;
    saveDraft();
  } else if (e.target.classList.contains('subtype-select')) {
    state.data[sec][i].subtype = e.target.value;
    saveDraft();
  }
}

function onBlockInput(e){
  if (!e.target.classList.contains('code-input')) return;
  const block = e.target.closest('.block');
  const rowEl = e.target.closest('.row');
  const i = +rowEl.dataset.i;
  state.data[block.dataset.sec][i].code = e.target.value;
  updateBar();
  saveDraft();
}

function onBlockKey(e){
  if (e.key !== 'Enter') return;
  if (!e.target.classList.contains('code-input')) return;
  e.preventDefault();
  e.target.closest('.block').querySelector('.add').click();
}

function loadBranchConfig(branch){
  if (!branch) { state.existing = null; $('#existingInfo').textContent = ''; return Promise.resolve(); }
  $('#existingInfo').innerHTML = '<span style="opacity:.7">جارٍ تحميل الإعداد الحالي…</span>';
  return apiGet({ action:'getSetup', branch:branch })
    .then(function(d){
      state.existing = { count: d.count || 0, sections: d.sections || [] };
      if (d.exists) {
        $('#existingInfo').innerHTML = 'الإعداد الحالي: <b>' + arNum(d.count) + '</b> ثلاجة في ' +
          arNum(d.sections.length) + ' أقسام — أي حفظ جديد سيستبدله.';
        applyExisting();
      } else {
        $('#existingInfo').textContent = 'لا يوجد إعداد لهذا الفرع — سيتم البدء من جديد.';
        clearForm();
      }
    })
    .catch(function(e){
      $('#existingInfo').innerHTML = '<span style="color:var(--bad)">تعذر تحميل الإعداد: ' + esc(e.message) + '</span>';
    });
}

function applyExisting(){
  const ex = state.existing;
  if (!ex || !ex.sections) return;
  state.picked = ex.sections.map(function(s){ return s.name; });
  state.data = {};
  ex.sections.forEach(function(s){
    state.data[s.name] = s.fridges.map(function(f){
      const parts = String(f.type || '').split(/[|·]/);
      const cooling = f.cooling || ((parts[0] && parts[0].trim() === 'تجميد') ? 'تجميد' : 'تبريد');
      const subtype = f.subtype || (parts[1] ? parts[1].trim() : '');
      return { code: f.code, cooling: cooling, subtype: subtype };
    });
    if (!state.data[s.name].length) state.data[s.name] = [{ code:'', cooling:'تبريد', subtype:'' }];
  });
  renderSecGrid();
  renderBlocks();
  updateBar();
}

function clearForm(){
  state.picked = [];
  state.data = {};
  renderSecGrid();
  renderBlocks();
  updateBar();
  saveDraft();
}

/* التحقق: يُمنع التكرار فقط لو نفس القسم + الكود + النوع + نوع الثلاجة متطابقين */
function validate(){
  const problems = [];
  if (!state.branch) problems.push('اختر الفرع');
  if (!state.picked.length) problems.push('اختر قسمًا واحدًا على الأقل');

  const seen = {};
  state.picked.forEach(function(sec){
    const rows = (state.data[sec] || []).filter(function(r){ return cleanCode(r.code); });
    if (!rows.length) { problems.push('القسم «' + sec + '» بدون ثلاجات'); return; }
    rows.forEach(function(r){
      const c = cleanCode(r.code);
      const cooling = r.cooling || 'تبريد';
      const subtype = r.subtype || '';
      const k = [sec, c.toLowerCase(), cooling, subtype].join('|||');
      if (seen[k]) {
        problems.push('ثلاجة مكررة بالكامل في «' + sec + '»: ' + c + ' (' + cooling + (subtype ? ' · ' + subtype : '') + ')');
      }
      seen[k] = 1;
      if (c.length > 30) problems.push('رمز طويل جدًا: ' + c.slice(0, 12) + '…');
    });
  });
  return problems;
}

function payload(){
  const sections = state.picked.map(function(sec){
    return {
      name: sec,
      fridges: (state.data[sec] || [])
        .map(function(r){
          const code = cleanCode(r.code);
          const cooling = r.cooling || 'تبريد';
          const subtype = r.subtype || '';
          const typeStr = subtype ? (cooling + '|' + subtype) : cooling;
          return { code: code, cooling: cooling, subtype: subtype, type: typeStr };
        })
        .filter(function(r){ return r.code; })
    };
  }).filter(function(s){ return s.fridges.length; });

  return {
    action: 'submitSetup',
    branch: state.branch,
    sections: sections,
    expected: sections.reduce(function(a, s){ return a + s.fridges.length; }, 0)
  };
}

let modalAction = null;
function openModal(title, text, okText, action){
  $('#mTitle').textContent = title;
  $('#mText').innerHTML = text;
  $('#mOk').textContent = okText || 'تأكيد';
  modalAction = action || null;
  $('#modal').classList.add('on');
}
function closeModal(){ $('#modal').classList.remove('on'); modalAction = null; }

function askAndSubmit(){
  clearMsg();
  const problems = validate();
  if (problems.length) {
    msg('err', '<b>لا يمكن الحفظ بهذه البيانات:</b><ul>' +
      problems.slice(0, 8).map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>');
    return;
  }

  const p = payload();
  const was = state.existing && state.existing.count ? state.existing.count : 0;
  const now = p.expected;

  let text = 'الفرع: <b>' + esc(state.branch) + '</b><br>' +
    'عدد الأقسام: <b>' + arNum(p.sections.length) + '</b> · عدد الثلاجات: <b>' + arNum(now) + '</b>';
  if (was) {
    text += '<br><br>سيتم استبدال الإعداد القديم (<b>' + arNum(was) + '</b> ثلاجة) بالجديد.';
    if (now < was) {
      text += '<br><span style="color:var(--warn);font-weight:700">تحذير: العدد الجديد أقل من القديم بـ ' +
        arNum(was - now) + ' ثلاجة.</span>';
    }
  }

  state.pending = p;
  openModal('تأكيد حفظ الإعداد', text, 'حفظ ' + arNum(now) + ' ثلاجة', doSubmit);
}

function doSubmit(){
  const p = state.pending;
  if (!p) return;
  state.pending = null;
  closeModal();
  state.busy = true;
  updateBar();
  $('#submitBtn').innerHTML = '<span class="spin"></span> جارٍ الحفظ…';

  apiPost(p)
    .then(function(){
      return apiGet({ action:'getSetup', branch:p.branch }).then(function(d){
        const got = d.count || 0;
        if (!d.exists || got !== p.expected) {
          throw new Error('الحفظ غير مكتمل — عدد المحفوظ في الخادم: ' + arNum(got) + ' من ' + arNum(p.expected) + ' ثلاجة');
        }
        return { got:got, sections:(d.sections || []).length };
      });
    })
    .then(function(r){
      state.busy = false;
      localStorage.removeItem(draftKey(p.branch));
      $('#formCard').style.display = 'none';
      $('#sectionsCard').style.display = 'none';
      $('#blocks').style.display = 'none';
      $('#resultCard').style.display = 'block';
      $('#resultText').innerHTML = 'فرع <b>' + esc(p.branch) + '</b> — ' +
        arNum(r.got) + ' ثلاجة في ' + arNum(r.sections) + ' أقسام.<br>' +
        'يمكنك الآن تسجيل درجات الحرارة من صفحة التسجيل.';
      $('.bar').style.display = 'none';
      window.scrollTo(0, 0);
    })
    .catch(function(err){
      state.busy = false;
      updateBar();
      $('#submitBtn').textContent = 'حفظ الإعداد';
      msg('err', '<b>لم يتم الحفظ:</b> ' + esc(err.message) +
        '<br><small>البيانات المدخلة محفوظة — عدّلها ثم أعد المحاولة.</small>');
    });
}

function draftKey(b){ return LS_DRAFT + ':' + b; }
function saveDraft(){
  if (!state.branch) return;
  try {
    localStorage.setItem(draftKey(state.branch), JSON.stringify({
      branch: state.branch, picked: state.picked, data: state.data, ts: Date.now()
    }));
  } catch (e) {}
}
function readDraft(b){
  try { return JSON.parse(localStorage.getItem(draftKey(b)) || 'null'); } catch (e) { return null; }
}

function boot(){
  fillBranches();
  renderSecGrid();
  updateBar();

  if (!apiReady()) {
    msg('warn', 'يجب إدخال رابط النشر في أعلى الكود (المتغير API_URL) في الصفحتين.');
  }

  $('#branch').addEventListener('change', function(){
    const b = this.value;
    if (state.branch && state.picked.length) saveDraft();
    state.branch = b;
    clearMsg();
    updateBar();
    if (!b) { state.existing = null; clearForm(); $('#existingInfo').textContent = ''; return; }
    loadBranchConfig(b).then(function(){
      const d = readDraft(b);
      if (d && d.picked && d.picked.length) {
        msg('warn', 'توجد مسودة غير محفوظة لهذا الفرع. ' +
          '<button id="restoreDraft" style="margin-top:6px;border:none;background:var(--warn);color:#fff;border-radius:8px;padding:6px 10px;font-weight:700">استرجاع المسودة</button> ' +
          '<button id="dropDraft" style="margin-top:6px;border:1px solid var(--warn);background:transparent;color:var(--warn);border-radius:8px;padding:6px 10px;font-weight:700">تجاهل</button>');
        $('#restoreDraft').onclick = function(){
          state.picked = d.picked;
          state.data = d.data || {};
          renderSecGrid(); renderBlocks(); updateBar(); clearMsg();
        };
        $('#dropDraft').onclick = function(){ localStorage.removeItem(draftKey(b)); clearMsg(); };
      }
    });
  });

  $('#secGrid').addEventListener('click', onGridClick);
  $('#blocks').addEventListener('click', onBlockClick);
  $('#blocks').addEventListener('change', onBlockChange);
  $('#blocks').addEventListener('input', onBlockInput);
  $('#blocks').addEventListener('keydown', onBlockKey);

  $('#clearBtn').addEventListener('click', function(){
    if (!state.picked.length) return;
    openModal('تفريغ النموذج',
      'سيتم مسح جميع الأقسام والثلاجات المدخلة هنا (لن يُحذف شيء من الشيت).',
      'مسح', function(){ clearForm(); updateBar(); });
  });

  $('#submitBtn').addEventListener('click', askAndSubmit);
  $('#mCancel').addEventListener('click', closeModal);
  $('#mOk').addEventListener('click', function(){ const a = modalAction; closeModal(); if (a) a(); });
  $('#modal').addEventListener('click', function(e){ if (e.target === this) closeModal(); });
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
